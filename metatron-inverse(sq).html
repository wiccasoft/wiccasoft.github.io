<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>3D Kusursuz Metatron Gök Mekanizması</title>
    <style>
        body {
            margin: 0;
            background-color: #020204;
            overflow: hidden;
        }
        #canvas3d {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Yerel kütüphane bağlantıların aynen korunmuştur -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script
</head>
<body>

     <div id="canvas3d"></div>
    <script>
        // --- 1. ADIM: SAHNE VE ALTYAPI ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 100);
        camera.position.set(0, 0.8, 1.8);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas3d').appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(2, 4, 3);
        scene.add(dirLight);

        // --- 2. ADIM: FRAKTAL METATRON GENERATÖRÜ (SINIF İLK BÖLÜM) ---
        class MetatronOktav {
            constructor(x_ofset, katmanIndex, temelBoyut, renkA, renkB) {
                this.group = new THREE.Group();
                this.group.position.x = x_ofset;
                this.radius = temelBoyut * Math.pow(2, katmanIndex - 1);
                this.renkA = renkA; this.renkB = renkB;
                this.tersSpin = (katmanIndex % 2 === 0);
                
                this.gluon1 = this.createGluon(this.renkA);
                this.gluon2 = this.createGluon(this.renkB);
                this.group.add(this.gluon1, this.gluon2);
                
                this.halkaGrup = new THREE.Group();
                this.group.add(this.halkaGrup);
                this.initMetatronKafesi();
            }
            createGluon(color) {
                return new THREE.Mesh(new THREE.SphereGeometry(this.radius*0.04, 8,8), new THREE.MeshBasicMaterial({color:color}));
            }



    initMetatronKafesi() {
                // 🔲 Küp İskeletini Çiz
                const icKupGeo = new THREE.BoxGeometry(this.radius * 2, this.radius * 2, this.radius * 2);
                const icKupMat = new THREE.MeshBasicMaterial({
                    color: this.renkA,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.05 * (1.0 / Math.pow(this.radius, 2))
                });
                this.group.add(new THREE.Mesh(icKupGeo, icKupMat));

                // 🪞 180° Kutuplu Karşıt Odalar
                const posA = new THREE.Vector3(this.radius, this.radius, this.radius);
                const posB = posA.clone().multiplyScalar(-1);
                this.odaA = this.createCamOda(this.renkA, posA, `Oda_A_${this.radius}`);
                this.odaB = this.createCamOda(this.renkB, posB, `Oda_B_${this.radius}`);
                this.group.add(this.odaA, this.odaB);

                // 🔮 13 Çentikli Dişli Halkası (Hatalı parantez düzeltildi, fonksiyon içine alındı)
                const halkaGeo = new THREE.RingGeometry(this.radius * 1.2, this.radius * 1.3, 13);
                const halkaMat = new THREE.MeshBasicMaterial({
                    color: this.renkB,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.15 * (1.0 / Math.pow(this.radius, 2))
                });
                const halkaMesh = new THREE.Mesh(halkaGeo, halkaMat);
                this.halkaGrup.add(halkaMesh);

                // 13 Çentik Üzerine Noktaları Yerleştir
                for (let i = 0; i < 13; i++) {
                    const rAci = (i * Math.PI * 2) / 13;
                    const noktaGeo = new THREE.SphereGeometry(this.radius * 0.025, 8, 8);
                    const noktaMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
                    const noktaMesh = new THREE.Mesh(noktaGeo, noktaMat);
                    noktaMesh.position.set(this.radius * 1.25 * Math.cos(rAci), this.radius * 1.25 * Math.sin(rAci), 0);
                    this.halkaGrup.add(noktaMesh);
                }
            }

            createCamOda(color, pos, name) {
                const geom = new THREE.SphereGeometry(this.radius * 0.18, 16, 16);
                const mat = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.4 * (1.0 / Math.pow(this.radius, 2)),
                    transparent: true,
                    opacity: 0.6
                });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.copy(pos);
                mesh.name = name;
                return mesh;
            }


    vortexGuncelle(zamanAcisi) {
                // ... (Ouroboros hareket mantığı)
            }
        } // MetatronOktav sınıfı kapanışı

        // 3'lü Metatron Matrisinin Oluşturulması ve Sahneye Eklenmesi
        const KuantumKafesi = new THREE.Group();
        scene.add(KuantumKafesi);

        const metatronMatrisi = [
            new MetatronOktav(-0.6, 1, 0.12, 0xff0000, 0x00ff00),
            new MetatronOktav(0.0, 2, 0.12, 0xff6600, 0x00bfff),
            new MetatronOktav(0.6, 3, 0.12, 0xffff00, 0x8a2be2)
        ];
        metatronMatrisi.forEach(m => KuantumKafesi.add(m.group));

        // Animasyon ve Galaktik Zaman Döngüsü
        let kalpAtisiZamani = 0;
        function animate() {
            // ... (Kırpılmasız, 3D Metatron Gök Mekanizması güncelleme mantığı)
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
