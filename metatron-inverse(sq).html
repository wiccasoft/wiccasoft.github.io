<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>3D Kutsal Geometri: 24 Odalı Metatron Saati</title>
    <style>
        body { margin: 0; background-color: #020204; overflow: hidden; }
        #canvas3d { width: 100vw; height: 100vh; }
    </style>
    <!-- Kararlı, THREE.OrbitControls'ü destekleyen r128 sürümleri -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas3d"></div>
    <script>

        // --- THREE.JS ENGINE INITIALIZATION ---
        const scene = new THREE.Scene();
        const container = document.getElementById('canvas3d');

        // Camera setup with a diagonal perspective looking at the core geometry
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(1.5, 1.5, 2.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Orbit controls for smooth interaction
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Balanced lighting to illuminate the 3D nodes and wireframes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(4, 5, 3);
        scene.add(dirLight);

        // Viewport resize handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- THE METATRON GRID CORE CLASS ---
        class MetatronGridSaati {
            constructor(baseSize) {
                this.group = new THREE.Group();
                this.radius = baseSize;
                
                // Inverse Square Law density multiplier (1 / r²)
                this.energyDensity = 1.0 / Math.pow(this.radius, 2);
                
                // Structural array arrays
                this.internalCubes = [];
                this.zamanOdaları = [];
                
                this.initMekanizma();
                this.initIcosahedronKafesi();
            }
initMekanizma() {
                // 1️⃣ ADIM: 8-Segmented Core Wireframe Cube (2,2,2)
                const coreGeo = new THREE.BoxGeometry(this.radius, this.radius, this.radius, 2, 2, 2);
                const coreMat = new THREE.MeshBasicMaterial({ 
                    color: 0x00ffff, 
                    wireframe: true, 
                    transparent: true, 
                    opacity: 0.35 
                });
                this.coreCube = new THREE.Mesh(coreGeo, coreMat);
                this.group.add(this.coreCube);

                // 2️⃣ ADIM: Inverse Square Law Volume Expansion (2x Volume via sqrt(2) Scale)
                // Forming the nested 9-cube inverted pyramid rezonans structure
                const expandedSize = this.radius * Math.sqrt(2);
                const outerGeo = new THREE.BoxGeometry(expandedSize, expandedSize, expandedSize, 2, 2, 2);
                const outerMat = new THREE.MeshBasicMaterial({ 
                    color: 0xff3300, 
                    wireframe: true, 
                    transparent: true, 
                    opacity: 0.15 
                });
                this.outerCube = new THREE.Mesh(outerGeo, outerMat);
                this.group.add(this.outerCube);

                // 3️⃣ ADIM: Sqrt(2) Diagonal Axis Poles (Passing through opposite corner vertices)
                const halfKup = (this.radius * Math.sqrt(2)) * 0.5;
                const nodeGeo = new THREE.SphereGeometry(this.radius * 0.08, 16, 16);
                
                // Positive Polar Node (Jüpiter-Aks A)
                const matA = new THREE.MeshPhongMaterial({ color: 0xffaa00, emissive: 0xffaa00, emissiveIntensity: 0.5 });
                this.poleA = new THREE.Mesh(nodeGeo, matA);
                this.poleA.position.set(halfKup, halfKup, halfKup); // Diagonal corner vertex
                this.group.add(this.poleA);

                // Negative Polar Node (Satürn-Aks B)
                const matB = new THREE.MeshPhongMaterial({ color: 0x8a2be2, emissive: 0x8a2be2, emissiveIntensity: 0.5 });
                this.poleB = new THREE.Mesh(nodeGeo, matB);
                this.poleB.position.set(-halfKup, -halfKup, -halfKup); // Opposite diagonal corner vertex
                this.group.add(this.poleB);

                // 4️⃣ ADIM: 13-Notched Dreamspell Cosmic Gear Ring
                for (let i = 0; i < 13; i++) {
                    const angle = (i * Math.PI * 2) / 13;
                    const zrGeo = new THREE.SphereGeometry(this.radius * 0.04, 8, 8);
                    const zrMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 });
                    const zrMesh = new THREE.Mesh(zrGeo, zrMat);
                    
                    // Placed on the gyro-vites plane orbiting the mechanism
                    zrMesh.position.set(Math.cos(angle) * this.radius * 1.3, 0, Math.sin(angle) * this.radius * 1.3);
                    this.group.add(zrMesh);
                    this.zamanOdaları.push(zrMesh);
                }
            }


            // 🏟️ ADIM 5: ISOCOSAHEDRON (20 YÜZLÜ ENERJİ KAFESİ) TOHUMU
            // Kütlesel olarak dönmeyen, içinden 124875 enerji akacak 12 köşe noktası
            initIcosahedronKafesi() {
                this.icoOdaları = [];
                // Icosahedron geometrisini (Kutsal 20 yüzlü grid ağı)
                // Ters piramit ($\sqrt{2}$) katsayısıyla merkez kübün dışına sabitliyoruz
                const icoGeo = new THREE.IcosahedronGeometry(this.radius * 1.5, 0);
                
                // Enerji akışını çizgisel göreceğimiz kafes materyali
                const icoMat = new THREE.MeshBasicMaterial({ 
                    color: 0x8a2be2, 
                    wireframe: true, 
                    transparent: true, 
                    opacity: 0.25 
                });
                this.icoKafesMesh = new THREE.Mesh(icoGeo, icoMat);
                this.group.add(this.icoKafesMesh);

                // Icosahedron'un 12 köşesine Tesla 124875 akışını bağlayacağımız enerji düğüm odaları
                const kureGeo = new THREE.SphereGeometry(this.radius * 0.04, 8, 8);
                const pozisyonlar = icoGeo.attributes.position;

                for (let i = 0; i < pozisyonlar.count; i++) {
                    const nodeMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.7 });
                    const nodeMesh = new THREE.Mesh(kureGeo, nodeMat);
                    
                    // Konumları sabit Icosahedron köşelerine kilitlenir (Dönüş yok!)
                    nodeMesh.position.fromArray(pozisyonlar.array, i * 3);
                    this.group.add(nodeMesh);
                    this.icoOdaları.push(nodeMesh);
                }
            }

// 🌀 124875 TESLA/VORTEX MATHEMATICAL ENGINE
 // 🌀 124875 TESLA/VORTEX MATHEMATICAL ENGINE (DÜZELTİLMİŞ EKVATORAL AKIŞ)
            updateVortex(galaktikZaman) {
                // Tesla 124875 serisi jiro-vites çarpanı
                const vortexPattern = [1, 2, 4, 8, 7, 5];
                
                // 1️⃣ Küpler kütlesel dönmüyor: Tekillik stabilizasyonu korundu
                this.coreCube.rotation.x = 0; this.coreCube.rotation.y = 0;
                this.outerCube.rotation.x = 0; this.outerCube.rotation.z = 0;

                // 2️⃣ Sqrt(2) Diagonal Aks Odaları (Ters Kare Yasası ile Titreşim)
                let radiusOffset = this.radius * Math.sqrt(2) * 0.5;
                this.poleA.position.set(radiusOffset, radiusOffset, radiusOffset);
                this.poleB.position.set(-radiusOffset, -radiusOffset, -radiusOffset);
                
                // Emissive intensity, 0.5'ten başlayarak sinüs dalgasıyla 2.5'e kadar artar
                this.poleA.material.emissiveIntensity = 0.5 + Math.abs(Math.sin(galaktikZaman * 3.0)) * 2.0;
                this.poleB.material.emissiveIntensity = 0.5 + Math.abs(Math.cos(galaktikZaman * 3.0)) * 2.0;

                // 3️⃣ Orbiting 13 Dreamspell Nodes following the 124875 velocity sequence
                this.zamanOdaları.forEach((node, index) => {
                    let baseAngle = (index * Math.PI * 2) / 13;
                    
                    // Tesla 124875 serisi hıza uygulanıyor
                    let stepMultiplier = vortexPattern[index % vortexPattern.length];
                    
                    // Zaman aksı ekvatoral düzlemde akıyor
                    let currentAngle = baseAngle + (galaktikZaman * 0.3 * stepMultiplier);
                    
                    // Yeşiller tam ekvator çemberinde kilitli, y=0
                    node.position.x = Math.cos(currentAngle) * this.radius * 1.3;
                    node.position.z = Math.sin(currentAngle) * this.radius * 1.3;
                    // 🔑 OUROBOROS MOTORU: Yeşiller dönerken index ivmesine bağlı olarak 
                    // aşağı ve yukarı sarmal sinüs dalgaları (Helix) çizer
                    node.position.y = Math.sin(galaktikZaman * 2.0 + baseAngle) * this.radius * 0.25 * Math.sqrt(2);
                    
                    // 124875 akış hızı parlama enerjisini (opasite) katlıyor
                    node.material.opacity = 0.4 + (stepMultiplier * 0.05);
                });
            }
        } // 🔑 MetatronGridSaati CLASS TERMINATION

        // --- INSTANTIATE MECHANISM & START GALAKTİK TIME CYCLE ---
        const KuantumKafesi = new THREE.Group();
        scene.add(KuantumKafesi);

  // 🧱 HARAMEIN GRID: İç içe kilitlenen 3 farklı fraktal katman (Oktav Matrisi)
        const metatronMatrisi = [
            new MetatronGridSaati(0.35), // İç Tohum (Çekirdek)
            new MetatronGridSaati(0.55), // Orta Bölme (Dünya Katmanı)
            new MetatronGridSaati(0.85)  // Dış Kalkan (192'li Kafes Çeperi)
        ];

        // Küpleri yan yana dizmek yerine, tam merkezde fraktal olarak iç içe geçiriyoruz
        metatronMatrisi.forEach((saat, index) => {
            saat.group.position.set(0, 0, 0);
            KuantumKafesi.add(saat.group);
        });

        function animate() {
            requestAnimationFrame(animate);

            // Galaktik time track using high-precision performance clock
            let galaktikZaman = performance.now() * 0.001;

            // Trigger the 124875 vortex engine updates
            // Tüm iç içe geçmiş katmanların vortex motorlarını aynı anda tetikle
            metatronMatrisi.forEach(saat => saat.updateVortex(galaktikZaman));

            // Subtle secondary drift for structural depth observation
            KuantumKafesi.rotation.y += 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        // START ENGINE
        animate();
    </script>
</body>
</html>
