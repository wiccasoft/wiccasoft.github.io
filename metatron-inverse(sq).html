<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>3D Kutsal Geometri: 24 Odalı Metatron Saati</title>
    <style>
        body { margin: 0; background-color: #020204; overflow: hidden; }
        #canvas3d { width: 100vw; height: 100vh; }
    </style>
    <!-- Kararlı, THREE.OrbitControls'ü destekleyen r128 sürümleri -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas3d"></div>
    <script>

        // --- THREE.JS ENGINE INITIALIZATION ---
        const scene = new THREE.Scene();
        const container = document.getElementById('canvas3d');

        // Camera setup with a diagonal perspective looking at the core geometry
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(1.5, 1.5, 2.0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Orbit controls for smooth interaction
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Balanced lighting to illuminate the 3D nodes and wireframes
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(4, 5, 3);
        scene.add(dirLight);

        // Viewport resize handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- THE METATRON GRID CORE CLASS ---
        class MetatronGridSaati {
            constructor(baseSize) {
                this.group = new THREE.Group();
                this.radius = baseSize;
                
                // Inverse Square Law density multiplier (1 / r²)
                this.energyDensity = 1.0 / Math.pow(this.radius, 2);
                
                // Structural array arrays
                this.internalCubes = [];
                this.zamanOdaları = [];
                
                this.initMekanizma();
            }
initMekanizma() {
                // 1️⃣ ADIM: 8-Segmented Core Wireframe Cube (2,2,2)
                const coreGeo = new THREE.BoxGeometry(this.radius, this.radius, this.radius, 2, 2, 2);
                const coreMat = new THREE.MeshBasicMaterial({ 
                    color: 0x00ffff, 
                    wireframe: true, 
                    transparent: true, 
                    opacity: 0.35 
                });
                this.coreCube = new THREE.Mesh(coreGeo, coreMat);
                this.group.add(this.coreCube);

                // 2️⃣ ADIM: Inverse Square Law Volume Expansion (2x Volume via sqrt(2) Scale)
                // Forming the nested 9-cube inverted pyramid rezonans structure
                const expandedSize = this.radius * Math.sqrt(2);
                const outerGeo = new THREE.BoxGeometry(expandedSize, expandedSize, expandedSize, 2, 2, 2);
                const outerMat = new THREE.MeshBasicMaterial({ 
                    color: 0xff3300, 
                    wireframe: true, 
                    transparent: true, 
                    opacity: 0.15 
                });
                this.outerCube = new THREE.Mesh(outerGeo, outerMat);
                this.group.add(this.outerCube);

                // 3️⃣ ADIM: Sqrt(2) Diagonal Axis Poles (Passing through opposite corner vertices)
                const halfKup = (this.radius * Math.sqrt(2)) * 0.5;
                const nodeGeo = new THREE.SphereGeometry(this.radius * 0.08, 16, 16);
                
                // Positive Polar Node (Jüpiter-Aks A)
                const matA = new THREE.MeshPhongMaterial({ color: 0xffaa00, emissive: 0xffaa00, emissiveIntensity: 0.5 });
                this.poleA = new THREE.Mesh(nodeGeo, matA);
                this.poleA.position.set(halfKup, halfKup, halfKup); // Diagonal corner vertex
                this.group.add(this.poleA);

                // Negative Polar Node (Satürn-Aks B)
                const matB = new THREE.MeshPhongMaterial({ color: 0x8a2be2, emissive: 0x8a2be2, emissiveIntensity: 0.5 });
                this.poleB = new THREE.Mesh(nodeGeo, matB);
                this.poleB.position.set(-halfKup, -halfKup, -halfKup); // Opposite diagonal corner vertex
                this.group.add(this.poleB);

                // 4️⃣ ADIM: 13-Notched Dreamspell Cosmic Gear Ring
                for (let i = 0; i < 13; i++) {
                    const angle = (i * Math.PI * 2) / 13;
                    const zrGeo = new THREE.SphereGeometry(this.radius * 0.04, 8, 8);
                    const zrMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8 });
                    const zrMesh = new THREE.Mesh(zrGeo, zrMat);
                    
                    // Placed on the gyro-vites plane orbiting the mechanism
                    zrMesh.position.set(Math.cos(angle) * this.radius * 1.3, 0, Math.sin(angle) * this.radius * 1.3);
                    this.group.add(zrMesh);
                    this.zamanOdaları.push(zrMesh);
                }
            }


// 🌀 124875 TESLA/VORTEX MATHEMATICAL ENGINE
            updateVortex(galaktikZaman) {
                // 800-year precession wave simulated via slow harmonic oscillations
                let precessionOscillation = Math.sin(galaktikZaman * 0.05) * 0.15;
                
                // Rotational spin inversion based on the 124875 vortex sequence sequence
                const vortexPattern =;
                
                // 1️⃣ Animate Core and Outer Cubes via inverse square bükülme waves
                this.coreCube.rotation.x = galaktikZaman * 0.15;
                this.coreCube.rotation.y = galaktikZaman * 0.25;
                
                // Outer expansion cube rotates in opposition (Yin-Yang dual synchronization)
                this.outerCube.rotation.x = -galaktikZaman * 0.10;
                this.outerCube.rotation.z = -galaktikZaman * 0.15;

                // 2️⃣ Dynamic bükme on the Sqrt(2) Diagonal Aks Poles (Jüpiter-Satürn)
                let radiusOffset = this.radius * Math.sqrt(2) * 0.5;
                let dynamicScale = radiusOffset + (Math.sin(galaktikZaman * 0.5) * 0.1);
                
                this.poleA.position.set(
                    dynamicScale * Math.cos(precessionOscillation),
                    dynamicScale,
                    dynamicScale * Math.sin(precessionOscillation)
                );
                this.poleB.position.set(
                    -dynamicScale * Math.cos(precessionOscillation),
                    -dynamicScale,
                    -dynamicScale * Math.sin(precessionOscillation)
                );

                // 3️⃣ Orbiting 13 Dreamspell Nodes following the vortex velocity sequence
                this.zamanOdaları.forEach((node, index) => {
                    let baseAngle = (index * Math.PI * 2) / 13;
                    
                    // Apply Tesla's 124875 sequence to variable index-based step speeds
                    let stepMultiplier = vortexPattern[index % vortexPattern.length];
                    let currentAngle = baseAngle + (galaktikZaman * 0.2 * stepMultiplier);
                    
                    node.position.x = Math.cos(currentAngle) * this.radius * 1.3;
                    node.position.z = Math.sin(currentAngle) * this.radius * 1.3;
                    
                    // Inverted pyramid height wave ($\sqrt{2}$ harmonic axis)
                    node.position.y = Math.sin(galaktikZaman + baseAngle) * 0.15 * Math.sqrt(2);
                });
            }
        } // 🔑 MetatronGridSaati CLASS TERMINATION

        // --- INSTANTIATE MECHANISM & START GALAKTİK TIME CYCLE ---
        const KuantumKafesi = new THREE.Group();
        scene.add(KuantumKafesi);

        // Deploy the 9-cube structured core grid
        const metatronSaati = new MetatronGridSaati(0.6);
        KuantumKafesi.add(metatronSaati.group);

        function animate() {
            requestAnimationFrame(animate);

            // Galaktik time track using high-precision performance clock
            let galaktikZaman = performance.now() * 0.001;

            // Trigger the 124875 vortex engine updates
            metatronSaati.updateVortex(galaktikZaman);

            // Subtle secondary drift for structural depth observation
            KuantumKafesi.rotation.y += 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        // START ENGINE
        animate();
    </script>
</body>
