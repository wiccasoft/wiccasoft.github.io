<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>3D Kutsal Geometri: 24 Odalı Metatron Saati</title>
    <style>
        body { margin: 0; background-color: #020204; overflow: hidden; }
        #canvas3d { width: 100vw; height: 100vh; }
    </style>
    <!-- Kararlı, THREE.OrbitControls'ü destekleyen r128 sürümleri -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas3d"></div>
    <script>
        // Sahne ve Kamera
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 2;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 8 Bölmeli Küp (2,2,2 segmentasyon ile XYZ eksenlerinde)
        const geometry = new THREE.BoxGeometry(1, 1, 1, 2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Animasyon
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
