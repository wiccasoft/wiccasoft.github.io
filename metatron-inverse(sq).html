<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>3D Kusursuz Metatron Gök Mekanizması</title>
    <style>
        body {
            margin: 0;
            background-color: #020204;
            overflow: hidden;
        }
        #canvas3d {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Yerel kütüphane bağlantıların aynen korunmuştur -->
    <script src="./three.min.js"></script>
    <script src="./OrbitControls.js"></script>
</head>
<body>

    <div id="canvas3d"></div>

<script>

const scene = new THREE.Scene(); // Önce sahne oluşturulur


// --- 1. ADIM: SAHNE OLUŞTURULDUKTAN HEMEN SONRA ÇALIŞACAK ALTYAFI ---
const container = document.getElementById('canvas3d');

// 🎥 Perspektif Kamera (Derinlik ve 3D Projeksiyon İçin)
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0.0, 0.8, 1.8); // Çapraz galaktik bakış açısı

// 🖼️ WebGL Ekran Basıcı
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

// 🕹️ OrbitControls (Fare / Ekran döndürme, yakınlaştırma)
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;      // Yumuşak jiro ivmelenmesi
controls.dampingFactor = 0.05;

// 💡 Cam Odaların Fosforlu Parlaması İçin Gerekli Nükleer Işıklar
const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(2, 4, 3);
scene.add(dirLight);

// Ekran Boyutu Değiştiğinde Pencereyi Otomatik Re-size Eden Sinyal
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

   // ============================================================================
// BÖLÜM 1: INVERSE SQUARE FRAKTAL METATRON GENERATÖRÜ (KUTSAL MEKANİZMA)
// ============================================================================
class MetatronOktav {
    constructor(x_ofset, katmanIndex, temelBoyut, renkA, renkB) {
        this.x_ofset = x_ofset;             // Yan yana 3 küp için X koordinatı kayması
        this.katmanIndex = katmanIndex;     // 1, 2, 3... (Enerji Seviyesi)
        
        // 📐 Ters Kare Yasası (Inverse Square Law) Boyut Katsayısı
        // Katman büyüdükçe yarıçap katlanarak genişler (r = 1, r = 2, r = 4...)
        this.radius = temelBoyut * Math.pow(2, katmanIndex - 1); 
        
        // Ters kareye göre enerji yoğunluğu (1 / r²)
        this.enerjiYogunlugu = 1.0 / Math.pow(this.radius, 2);

        this.group = new THREE.Group();
        this.group.position.x = x_ofset; // Küpün uzaydaki dikey/yatay yönü

        this.renkA = renkA;
        this.renkB = renkB;

        // 🔑 MetatronOktav Sınıfının İçine Yeni Bir Yardımcı Fonksiyon:
        createGluonParcacik(color) {
            const geo = new THREE.SphereGeometry(this.radius * 0.04, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
            return new THREE.Mesh(geo, mat);
        }

        // 🔑 constructor() İÇİNDE, İNİT FONKSİYONUNDAN HEMEN SONRA 
            this.gluon1 = this.createGluonParcacik(this.renkA);
            this.gluon2 = this.createGluonParcacik(this.renkB);
            this.group.add(this.gluon1);
            this.group.add(this.gluon2);
            this.gIlerleme1 = 0.0;
            this.gIlerleme2 = 0.5; // Karşıt faz dengesi (Biri giderken diğeri gelir)

        this.initMetatronKafesi();
    }

    initMetatronKafesi() {
        // 🔲 Katman İskeletini (Küp/Tetrahedron) Otomatik Çiz
        const icKupGeo = new THREE.BoxGeometry(this.radius * 2, this.radius * 2, this.radius * 2);
        // Çizgi saydamlığı da Ters Kare Yasası'na göre dışa doğru solar
        const icKupMat = new THREE.MeshBasicMaterial({ 
            color: this.renkA, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.05 * this.enerjiYogunlugu 
        });
        const kafesMesh = new THREE.Mesh(icKupGeo, icKupMat);
        this.group.add(kafesMesh);

        // 🪞 4 Yön Pusulası ve Zıtların Birliği (Union of Opposites) Opozit Odaları
        // Küre konumları elle değil, vektörel olarak tam 180° karşıt aksa otomatik hesaplanır
        const posA = new THREE.Vector3(this.radius, this.radius, this.radius);
        const posB = posA.clone().multiplyScalar(-1); // Tam 180° kutupsallık (Aks)

        // Odaların boyutları da fraktal olarak katsayıya göre ölçeklenir
        this.odaA = this.createCamOda(this.renkA, posA, `Oda_A_Katman_${this.katmanIndex}`);
        this.odaB = this.createCamOda(this.renkB, posB, `Oda_B_Katman_${this.katmanIndex}`);

        this.group.add(this.odaA);
        this.group.add(this.odaB);
    }

    // 🔑 EKLEMELİSİN: Küpün etrafına 13 Ay/Ton Dreamspell dişli halkasını giydir
this.halkaGrup = new THREE.Group();
this.group.add(this.halkaGrup);

const halkaGeo = new THREE.RingGeometry(this.radius * 1.2, this.radius * 1.3, 13); // 13 Çentikli Dişli
const halkaMat = new THREE.MeshBasicMaterial({ 
    color: this.renkB, 
    wireframe: true, 
    transparent: true, 
    opacity: 0.15 * this.enerjiYogunlugu 
});
this.halkaMesh = new THREE.Mesh(halkaGeo, halkaMat);
this.halkaGrup.add(this.halkaMesh);

// 13 Çentik Üzerine Kozmik Kapı Noktaları (Matris Puanları) Yerleştir
for (let i = 0; i < 13; i++) {
    const rAci = (i * Math.PI * 2) / 13;
    const noktaGeo = new THREE.SphereGeometry(this.radius * 0.025, 8, 8);
    const noktaMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
    const noktaMesh = new THREE.Mesh(noktaGeo, noktaMat);
    
    noktaMesh.position.set(this.radius * 1.25 * Math.cos(rAci), this.radius * 1.25 * Math.sin(rAci), 0);
    this.halkaGrup.add(noktaMesh);
}

    createCamOda(color, pos, name) {
        const geom = new THREE.SphereGeometry(this.radius * 0.18, 16, 16);
        const mat = new THREE.MeshPhongMaterial({
            color: color,
            emissive: color,
            // Kalp Atışı (Pulse) parlama şiddeti Ters Kare Yoğunluğuna bağlanır
            emissiveIntensity: 0.4 * this.enerjiYogunlugu,
            transparent: true,
            opacity: 0.6,
            depthCompass: true
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.copy(pos);
        mesh.name = name;
        return mesh;
    }

    vortexGuncelle(zamanAçısı) {
        //  Yılan gibi sinüs dalgası çizen Ouroboros (3D Helix) hareketi
        let sY = Math.sin(zamanAçısı) * this.radius * 0.6;
        
        this.odaA.position.set(this.radius * Math.cos(zamanAçısı), sY, this.radius * Math.sin(zamanAçısı));
        this.odaB.position.set(this.radius * Math.cos(zamanAçısı + Math.PI), -sY, this.radius * Math.sin(zamanAçısı + Math.PI));
   
            // 🔑 vortexGuncelle(zamanAçısı) FONKSİYONUNUN İÇİNE
        // Gluon İlerlemeleri
        this.gIlerleme1 += 0.008;
        this.gIlerleme2 += 0.008;
        if (this.gIlerleme1 > 1.0) this.gIlerleme1 = 0.0;
        if (this.gIlerleme2 > 1.0) this.gIlerleme2 = 0.0;

        // Odalar arasında sarmal LERP (Ouroboros) akışı
        this.gluon1.position.lerpVectors(this.odaA.position, this.odaB.position, this.gIlerleme1);
        this.gluon2.position.lerpVectors(this.odaB.position, this.odaA.position, this.gIlerleme2);
    }
// 🔑 EKLEMELİSİN: 13 Ay Çarkını kendi katman vitesine (ters/düz) göre jiro bükümüne sok
let vitesYonu = this.tersSpin ? -0.2 : 0.2;
this.halkaGrup.rotation.z = zamanAçısı * vitesYonu;
this.halkaGrup.rotation.y = Math.sin(zamanAçısı * 0.5) * 0.15; // 3D Sallantı dalgası

}


const KuantumKafesi = new THREE.Group();
// --- GEZEGEN VE KAFES YAPILARINI SAHNEYE ONAYLI EKLEME ---

// Kuantum Kafesi grubunu bütünüyle ana sahneye bağla
scene.add(KuantumKafesi); 

//  Yan Yana ve İç İçe 3 Farklı Metatron Enerji Seviyesini Otomatik Üret
const metatronMatrisi = [
    new MetatronOktav(-0.6, 1, 0.12, 0xff0000, 0x00ff00), // 1. Küp (Sol: Kırmızı-Yeşil Çekirdek)
    new MetatronOktav( 0.0, 2, 0.12, 0xff6600, 0x00bfff), // 2. Küp (Orta: Turuncu-Mavi Aks)
    new MetatronOktav( 0.6, 3, 0.12, 0xffff00, 0x8a2be2)  // 3. Küp (Sağ: Satürn-Güneş Oktavı)

    
];



metatronMatrisi.forEach(m => KuantumKafesi.add(m.group));


    let kalpAtisiZamani = 0;
// Animasyon motorunda tek bir döngüde sarmalı (Ouroboros) tetikle
// --- ⏳ GALAKTİK ZAMAN VE OUROBOROS MOTORU (BOZULMAZ OMURGA) ---
function animate() {
    // 1. ADIM: 1 Hz Kalp Atışı (Pulse) Zamanlayıcı Ritimleri
    let delta = 0.016; // 60 FPS standart akış adımı
    kalpAtisiZamani += delta;

    if (kalpAtisiZamani >= 1.0) { // Her 1 Saniyede Evrenin Kalbi 1 Kez Çakar
        kalpAtisiZamani = 0;
        
        // Tüm katman odalarını Ters Kare Yasasına (1/r²) göre şarj et
        metatronMatrisi.forEach(kup => {
            kup.odaA.material.emissiveIntensity = 4.0 * kup.enerjiYogunlugu;
            kup.odaB.material.emissiveIntensity = 4.0 * kup.enerjiYogunlugu;
        });
    }

    // Cam odaların parlamasını zamanla yavaşça sönümleme (Stabilite Dengesi)
    metatronMatrisi.forEach(kup => {
        if (kup.odaA.material.emissiveIntensity > 0.4 * kup.enerjiYogunlugu) {
            kup.odaA.material.emissiveIntensity -= delta * 2.0;
        }
        if (kup.odaB.material.emissiveIntensity > 0.4 * kup.enerjiYogunlugu) {
            kup.odaB.material.emissiveIntensity -= delta * 2.0;
        }
    });

    // 2. ADIM: Maya 13 Ay Dreamspell Galaktik Zaman Katsayısı
    // Düz zaman yerine, tüm sistemi 13'lü Wavespell dalgasına bağlayan akış
    let galaktikZaman = performance.now() * 0.0006; 

    // 3'lü Küp ve 6 Gluon Parçacığının Ters Yönlü Girdaplarını Tetikle
    metatronMatrisi.forEach((kup, index) => {
        // Çarkların birbirini ezmemesi, Yaşam Çiçeğinin tepeden bakışta 
        // korunması için sol ve sağ küp düz, ortadaki küp ters yönlü (Yin-Yang) döner
        let spinYonu = (index % 2 === 0) ? 1 : -1;
        kup.vortexGuncelle((galaktikZaman * spinYonu) + (index * Math.PI / 4));
    });

    // Ana kuantum kafesini (Uzay Gemisi Dünya) yavaşça döndürerek 3D derinliği artır
    KuantumKafesi.rotation.y += 0.0002;

    // 3. ADIM: WebGL Canlandırma ve Ekran Basıcı Bağlantıları
    requestAnimationFrame(animate);

    // OrbitControls jiro yumuşatmasını güncelle
    controls.update(); 

    // Sahneyi kameradan ekrana bas
    renderer.render(scene, camera);
}

// 🔑 ENERJİ VER: Dosyanın çalışması için en altta motoru tetiklemeyi unutmuyoruz
animate();
</script>
</body>
</html>
