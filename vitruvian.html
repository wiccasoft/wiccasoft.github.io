<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Heykelsi Siberpunk İnsan Modelleme</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>

<!-- 🔑 Sabitlenmiş Kütüphane Bağlantıları -->
<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>

<script>
// Sahne ve Kamera Kurulumu
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 1, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);

// ============================================================================
// 🛠️ GELİŞMİŞ SİBERPUNK HEYKEL VE ÇAKRA ENJEKSİYONU
// ============================================================================
const person = new THREE.Group();

// 1. Neon Çizgi Malzemesi (Ana İskelet Tel Kafesi)
const neonMat = new THREE.MeshBasicMaterial({
    color: 0xff3300,
    wireframe: true,
    transparent: true,
    opacity: 0.5
});

// 2. Çakra Enerji Merkezleri İçin Parlayan Malzeme (Kırmızı/Turuncu Kor)
const cakraMat = new THREE.MeshBasicMaterial({
    color: 0xffaa00,
    wireframe: true,
    transparent: true,
    opacity: 0.9
});

// --- BAŞ VE BOYUN ---
const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 6), neonMat);
head.position.y = 1.8;

const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.12, 5), neonMat);
neck.position.y = 1.62;

// --- GÖĞÜS KAFESİ VE OMURGA (Traşlanmış Kristalize Toraks) ---
const thorax = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.18, 0.45, 6, 2), neonMat);
thorax.position.y = 1.35;

// Pelvis (Leğen Kemiği Altlığı)
const pelvis = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.2, 6, 1), neonMat);
pelvis.position.y = 0.95;

// --- EKLEMLER VE KOLLAR (Vitruvian Duruşu) ---
const jointGeo = new THREE.SphereGeometry(0.04, 4, 4);
const armGeo = new THREE.CylinderGeometry(0.03, 0.02, 0.55, 4);

// Sol Kol Kompleksi
const leftShoulder = new THREE.Mesh(jointGeo, neonMat); leftShoulder.position.set(-0.28, 1.5, 0);
const leftArm = new THREE.Mesh(armGeo, neonMat); leftArm.position.set(-0.58, 1.5, 0); leftArm.rotation.z = Math.PI / 2;

// Sağ Kol Kompleksi
const rightShoulder = new THREE.Mesh(jointGeo, neonMat); rightShoulder.position.set(0.28, 1.5, 0);
const rightArm = new THREE.Mesh(armGeo, neonMat); rightArm.position.set(0.58, 1.5, 0); rightArm.rotation.z = -Math.PI / 2;

// --- BACAKLAR ---
const legGeo = new THREE.CylinderGeometry(0.04, 0.02, 0.75, 4);

const leftLeg = new THREE.Mesh(legGeo, neonMat); leftLeg.position.set(-0.2, 0.5, 0); leftLeg.rotation.z = Math.PI / 14;
const rightLeg = new THREE.Mesh(legGeo, neonMat); rightLeg.position.set(0.2, 0.5, 0); rightLeg.rotation.z = -Math.PI / 14;

// --- 🔱 ANATOMİK ÇAKRA SARKACI (Dikey Enerji Hattı) ---
const cakraGeo = new THREE.SphereGeometry(0.035, 5, 5);

// Boğaz Çakrası
const cakraBogaz = new THREE.Mesh(cakraGeo, cakraMat); cakraBogaz.position.set(0, 1.58, 0.05);
// Kalp Çakrası
const cakraKalp = new THREE.Mesh(cakraGeo, cakraMat); cakraKalp.position.set(0, 1.35, 0.05);
// Solar Plexus Çakrası
const cakraSolar = new THREE.Mesh(cakraGeo, cakraMat); cakraSolar.position.set(0, 1.15, 0.05);
// Sakral Çakra
const cakraSakral = new THREE.Mesh(cakraGeo, cakraMat); cakraSakral.position.set(0, 0.95, 0.05);

// Tüm Parçaları Heykel Grubuna Çivile
person.add(
    head, neck, thorax, pelvis, 
    leftShoulder, leftArm, rightShoulder, rightArm, 
    leftLeg, rightLeg,
    cakraBogaz, cakraKalp, cakraSolar, cakraSakral
);

person.position.y = -0.8; // Sahne dengelemesi
scene.add(person);
// Animasyon Döngüsü
function animate() {
    requestAnimationFrame(animate);
    
    // Heykelin her detayını görmek için yavaş kozmik dönüş
    person.rotation.y += 0.005; 
    
    controls.update();
    renderer.render(scene, camera);
}

// Güvenli Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
