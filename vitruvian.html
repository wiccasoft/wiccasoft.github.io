<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Heykelsi Siberpunk İnsan Modelleme</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>

<!-- 🔑 Sabitlenmiş Kütüphane Bağlantıları -->
<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>

<script>
// Sahne ve Kamera Kurulumu
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 1, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);

// 3D Model Grubu (Yontulmuş Geometrik İnsan)
const person = new THREE.Group();

// Neon Çizgi Malzemesi (Wireframe)
const neonMat = new THREE.MeshBasicMaterial({ 
    color: 0xff3300, 
    wireframe: true, 
    transparent: true, 
    opacity: 0.7 
});

// 🛠️ HEYKEL TRAŞLAMA MATRİSİ: Segment sayıları azaltılarak köşeli/keskin hatlar verildi
// Kafa (Az segmentli küre - Kristalize kafa yapısı)
const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), neonMat);
head.position.y = 1.8;

// Gövde (Üstü geniş, altı dar yontulmuş göğüs kafesi)
const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.12, 0.6, 6, 3), neonMat);
torso.position.y = 1.3;

// Kollar (Da Vinci / Vitruvian Man gibi iki yana dümdüz açılan kollar)
const armGeo = new THREE.CylinderGeometry(0.03, 0.02, 0.65, 4, 1);

const leftArm = new THREE.Mesh(armGeo, neonMat);
leftArm.position.set(-0.5, 1.45, 0); 
leftArm.rotation.z = Math.PI / 2; // 90 derece tam yana açıldı

const rightArm = new THREE.Mesh(armGeo, neonMat);
rightArm.position.set(0.5, 1.45, 0); 
rightArm.rotation.z = -Math.PI / 2; // 90 derece tam yana açıldı

// Bacaklar (Vitruvian Man duruşuna uygun, iki yana hafifçe açılan asil bacaklar)
const legGeo = new THREE.CylinderGeometry(0.04, 0.02, 0.8, 4, 2);

const leftLeg = new THREE.Mesh(legGeo, neonMat);
leftLeg.position.set(-0.25, 0.5, 0);
leftLeg.rotation.z = Math.PI / 16; // Dışa doğru hafif açı

const rightLeg = new THREE.Mesh(legGeo, neonMat);
rightLeg.position.set(0.25, 0.5, 0);
rightLeg.rotation.z = -Math.PI / 16; // Dışa doğru hafif açı

// Parçaları Heykel Grubuna Birleştir
person.add(head, torso, leftArm, rightArm, leftLeg, rightLeg);
person.position.y = -0.8; // Sahne merkezine oturtma
scene.add(person);

// Animasyon Döngüsü
function animate() {
    requestAnimationFrame(animate);
    
    // Heykelin her detayını görmek için yavaş kozmik dönüş
    person.rotation.y += 0.005; 
    
    controls.update();
    renderer.render(scene, camera);
}

// Güvenli Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
