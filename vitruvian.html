<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Da Vinci Base64 İzole Test Sahnesi</title>
  <style>
/* 🔑 BEYAZ PERDEYİ ANINDA YIRTAN CSS MÜHÜRÜ: HTML gövdesini kalıcı kozmik siyaha boyar! */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000 !important; 
    overflow: hidden !important; 
}
canvas { 
    display: block; 
    width: 100% !important;
    height: 100% !important;
}

/* 🔑 PARLAYAN ASTRO-ANATOMİ PANELİ CSS MÜHÜRÜ */
#zodyak-saati {
    position: absolute; top: 20px; left: 20px;
    background: rgba(0, 0, 0, 0.75);
    padding: 15px; border-radius: 10px;
    border: 1px solid #111; font-family: monospace; z-index: 999;
}
  </style>
</head>
<body>

<div id="zodyak-saati">
    <div style="color:#888; font-size:11px; margin-bottom:5px; border-bottom:1px solid #222; padding-bottom:5px;">🫖 KUANTUM BİYOLOJİK SAAT</div>
    <div id="ay-fazi" style="color:#00ffff; font-size:12px; font-weight:bold; margin-bottom:5px;">🌙 AY FAZI: YENİAY (Taban Deşarj)</div>
    <div id="aktif-cakra" style="color:#ff0055; font-size:11px; font-weight:bold; margin-bottom:10px; border-bottom:1px solid #222; padding-bottom:5px;">🫀 ÇAKRA: KÖK (0-7 Gün)</div>
</div>

<!-- Three.js ve OrbitControls yüklemeleri -->
<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>
  
<script>
// ============================================================================
// BÖLÜM 1: GEOMETRİ SİSTEMİ VE SAHNE KURULUMU
// ============================================================================
const scene = new THREE.Scene();

// 🔑 DA VINCI VITRUVIAN MAN ARKAPLAN TUVALİ MÜHÜRÜ
const loader = new THREE.TextureLoader();

// Kürelerin arkasından patlayacak özel Neon Kırmızı Vitruvian Man Base64 kodu
const daVinciDataURI = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIiB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiI+Cgk8Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0NSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmYzMzAwIiBzdHJva2Utd2lkdGg9IjAuNzUiLz4KCTxyZWN0IHg9IjE1IiB5PSIxIiB3aWR0aD0iNzAiIGhlaWdodD0iNzAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmMzMwMCIgc3Ryb2tlLXdpZHRoPSIwLjc1Ii8+Cgk8IS0tIEdvdmRlIC0tPgoJPGxpbmUgeDE9IjUwIiB5MT0iMTUiIHgyPSI1MCIgeTI9IjcwIiBzdHJva2U9IiNmZjMzMDAiIHN0cm9rZS13aWR0aD0iMSIvPgoJPGxpbmUgeDE9IjMwIiB5MT0iMzAiIHgyPSI3MCIgeTI9IjMwIiBzdHJva2U9IiNmZjMzMDAiIHN0cm9rZS13aWR0aD0iMSIvPgoJPGxpbmUgeDE9IjMwIiB5MT0iNDAiIHgyPSI3MCIgeTI9IjQwIiBzdHJva2U9IiNmZjMzMDAiIHN0cm9rZS13aWR0aD0iMC43NSIvPgoJPCEtLSBLb2xsYXIgdmUgQmFjYW5ha2xhciAtLTk+Cgk8bGluZSB4MT0iNTAiIHkxPSIxNSIgeDI9IjIwIiB5Mj0iMzAiIHN0cm9rZT0iI2ZmMzMwMCIgc3Ryb2tlLXdpZHRoPSIwLjc1Ii8+Cgk8bGluZSB4MT0iNTAiIHkxPSIxNSIgeDI9IjgwIiB5Mj0iMzAiIHN0cm9rZT0iI2ZmMzMwMCIgc3Ryb2tlLXdpZHRoPSIwLjc1Ii8+Cgk8bGluZSB4MT0iNTAiIHkxPSI3MCIgeDI9IjM1IiB5Mj0iOTAiIHN0cm9rZT0iI2ZmMzMwMCIgc3Ryb2tlLXdpZHRoPSIwLjc1Ii8+Cgk8bGluZSB4MT0iNTAiIHkxPSI3MCIgeDI9IjY1IiB5Mj0iOTAiIHN0cm9rZT0iI2ZmMzMwMCIgc3Ryb2tlLXdpZHRoPSIwLjc1Ii8+Cgk8bGluZSB4MT0iNTAiIHkxPSI3MCIgeDI9IjI1IiB5Mj0iODUiIHN0cm9rZT0iI2ZmMzMwMCIgc3Ryb2tlLXdpZHRoPSIwLjc1Ii8+Cgk8bGluZSB4MT0iNTAiIHkxPSI3MCIgeDI9Ijc1IiB5Mj0iODUiIHN0cm9rZT0iI2ZmMzMwMCIgc3Ryb2tlLXdpZHRoPSIwLjc1Ii8+Cjwvc3ZnPg==";

const daVinciDokusu = loader.load(daVinciDataURI);
const daVinciGeom = new THREE.PlaneGeometry(2.2, 2.2);

const daVinciMat = new THREE.MeshBasicMaterial({
  map: daVinciDokusu,
  transparent: true,
  opacity: 1.0, // Boş sahnede parlamayı tam görmek için 1.0 yapıldı
  side: THREE.DoubleSide
});

const daVinciMesh = new THREE.Mesh(daVinciGeom, daVinciMat);

// 📐 Ortografik (5,5,5) kameranın baktığı çapraza dik hizalama mühürü
daVinciMesh.rotation.set(-0.615, 0.785, 0); 
daVinciMesh.position.set(0, 0, 0); 
scene.add(daVinciMesh); 

// --- Ortografik Kamera En-Boy Oranı Düzeltmesi ---
const aspect = window.innerWidth / window.innerHeight;
const d = 1.5; 
const camera = new THREE.OrthographicCamera(- d * aspect, d * aspect, d, - d, 0.1, 1000);
camera.position.set(5, 5, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);

// 🔑 EKSİK OLAN ENERJİ VEREN RENDERING DÖNGÜSÜ ENJEKTE EDİLDİ
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

// 🔑 GÜVENLİ RESIZE
window.addEventListener('resize', () => {
    const yeniAspect = window.innerWidth / window.innerHeight;
    camera.left = -d * yeniAspect; camera.right = d * yeniAspect;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(); // Döngüyü ateşle
</script>
</body>
</html>
