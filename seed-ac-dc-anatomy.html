function setPoles(northName, southName) {
  if (currentAxis) scene.remove(currentAxis);

  const northSphere = scene.getObjectByName(northName);
  const southSphere = scene.getObjectByName(southName);
  if (!northSphere || !southSphere) return;

  const northPos = northSphere.position;
  const southPos = southSphere.position;

  const direction = new THREE.Vector3().subVectors(northPos, southPos).normalize();
  const centerPos = new THREE.Vector3().addVectors(northPos, southPos).multiplyScalar(0.5);

  const length = 10;
  const from = centerPos.clone().add(direction.clone().multiplyScalar(-length));
  const to   = centerPos.clone().add(direction.clone().multiplyScalar(length));

  const axisGeom = new THREE.BufferGeometry().setFromPoints([from,to]);
  const axisMat = new THREE.LineBasicMaterial({color:0x00ff00});
  currentAxis = new THREE.Line(axisGeom, axisMat);
  scene.add(currentAxis);

  // 🔑 Kamerayı yeni eksene hizala
  camera.position.copy(centerPos.clone().add(direction.clone().multiplyScalar(10)));
  camera.lookAt(centerPos);
  controls.target.copy(centerPos);
  controls.update();
}

class KuantumPaketi {
    constructor(kaynakMesh, hedefMesh, renk, tip, layer) { // 🔑 tip ve layer eklendi
        this.kaynak = kaynakMesh;
        this.hedef = hedefMesh;
        this.ilerleme = 0.0;
        this.tip = tip;       // 🔑 "A" veya "B" mühürü içeri alındı
        this.layer = layer;   // 🔑 "UP", "CENTER", "DOWN" katmanı çakıldı

        paketSayaci++; 
        this.uuid = paketSayaci; 
        
        const pGeom = new THREE.SphereGeometry(0.03, 8, 8); // Görsel netlik için parçacık hafif küçültüldü
  // 🔑 WebGL KATMAN MÜHÜRÜ: neonRengi hatasını çözer, zıt akımları Turkuaz ve Pembe olarak ayırır!
        const pMat = new THREE.MeshBasicMaterial({ 
            color: this.tip === "A" ? 0x00ffff : 0xff0055, // A akımı Turkuaz, B akımı Pembe parlar
            transparent: true, opacity: 0.95,
            depthWrite: false, // Zıt izlerin birbirini derinlik katmanında maskelemesini engeller
            blending: THREE.AdditiveBlending // Çarpışma anında element haçında plazma parlaması yaratır
        });
        this.mesh = new THREE.Mesh(pGeom, pMat);
        
        // İlk doğuş pozisyonu
        this.mesh.position.copy(this.kaynak.position);
        
        // 🚀 3 AŞAMALI KAYNAK ANTENİ: Katmanına göre dikey eksende ilk kırılmayı başlatır
        //if (this.layer === "UP") this.mesh.position.y += 0.08;
        //if (this.layer === "DOWN") this.mesh.position.y -= 0.08;

        KuantumKafesi.add(this.mesh);
    }

guncelle(delta) {
        // 🔑 ABSOLUTE SYMMETRY UNIFICATION: Both streams now share the exact same speed limits
        let hizKatsayisi = 1.6; // Fully unified velocity constant
        let dalgaliIvme = 0.5 + Math.sin(this.ilerleme * Math.PI) * hizKatsayisi;
        
        // Fluid speed pacing: 0.6 ensures they move beautifully without dragging or blinking away
        this.ilerleme += (delta * 0.6) * dalgaliIvme;

        let p = Math.min(this.ilerleme, 1.0);
        let merkezPos = new THREE.Vector3().lerpVectors(this.kaynak.position, this.hedef.position, p);
        
        // 🔑 PERFECTLY MIRRORED RADIAL CONSTANT: Broadens both orbits equally to match your logo's wheel
        let yorungeCap = 0.38; // Shared unified radius
        let dalgaBoyu = Math.sin(p * Math.PI) * yorungeCap; 
        let yonKatsayisi = this.tip === "A" ? 1 : -1; // Handled purely by the inverted compass direction

        // Symmetric polar gravity draw
        let cekimKuvveti = 1.0 - Math.sin(p * Math.PI) * 0.45;
        dalgaBoyu *= cekimKuvveti;

        // Unified 3D depth wave path tracking
        let layerKavisY = 0;
        if (this.layer === "UP") layerKavisY = Math.sin(p * Math.PI) * 0.15 * cekimKuvveti;
        if (this.layer === "DOWN") layerKavisY = -Math.sin(p * Math.PI) * 0.15 * cekimKuvveti;

        // The absolute spatial position: Fully symmetric, fluid, and perfectly mirrored
        this.mesh.position.set(
            merkezPos.x + Math.cos(p * Math.PI * 2) * dalgaBoyu * yonKatsayisi,
            merkezPos.y + layerKavisY,
            merkezPos.z + Math.sin(p * Math.PI * 2) * dalgaBoyu * yonKatsayisi
        );
    }
}

                gezegenEnerjiAlani = 18.0; // Orta hızda süzülerek söner, çıkış sarmalını görünür kılar.
            }

            // 🔑 Nihai Gezegen Enerji Alanı Deşarjı: Kararlı homeostasis mühürlenir
            if (odaMesh.material.emissiveIntensity > 0.3) {
                odaMesh.material.emissiveIntensity -= sabitDelta * gezegenEnerjiAlani;
            }
            if (odaMesh.material.opacity > 0.15) {
                odaMesh.material.opacity -= sabitDelta * (odaMesh.material.opacity > 0.35 ? (gezegenEnerjiAlani * 0.06) : (gezegenEnerjiAlani * 0.12));
            }
        }
    });


        // 🔑 MARS ZODYAK PUSULASI: Mars'ın (Kırmızı Oda) anlık hangi enerji alanında olduğunu konsola veya ekrana basar
    let marsFazı = rodinDizisiA[aktifIndexA];
    if (marsFazı === 1) console.log("🪐 Mars Koç/Aslan Aksında - Yüksek Basınç Çekirdeği");
    if (marsFazı === 4) console.log("🪐 Mars Terazi/Akrep Aksında - Solar Plexus Sapanı");
    if (marsFazı === 7) console.log("🪐 Mars Boğa/Değişken Aksta - Çıkış Sarmalı");
    

 // === 🌀 NEON TRAIL (PLAZMA İZ BIRAKMA) MOTORU ===
    // 🔑 KOZMİK SİYAH AÇILIŞI: Beyaz Alpha katmanını anında yırtar, gluonları kapatmadan arkadaki derin karanlık matrisi açar!
    if (renderer.autoClear === true || performance.now() < 2000) {
        renderer.setClearColor(0x000000, 1);
        renderer.clear(); // İlk karelerde beyaz buffer katmanını tamamen kazır ve simsiyah yapar
        renderer.autoClear = false;
    }
    
    // Her karede eski neon izlerini %5 sönümleyerek havada asılı kalan Yaşam Çiçeği tüplerini örer
    renderer.setClearColor(0x000000, 0.05);
    renderer.clearColor(); 
    renderer.clearDepth(); // 3D derinlik tamponunu sıfırlayarak GPU'yu tamamen rahatlatır

    if (typeof controls !== 'undefined') controls.update();
    renderer.render(scene, camera);
} // 🔑 animate fonksiyon kapanışı

// 🔑 GÜVENLİ RESIZE (Tekil ve dışarıda)
window.addEventListener('resize', () => {
    const yeniAspect = window.innerWidth / window.innerHeight;
    camera.left = -d * yeniAspect; camera.right = d * yeniAspect;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();

</script>
