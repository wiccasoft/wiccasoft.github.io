<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salvator Mundi + AC-DC Kuantum Motoru Entegrasyonu</title>
  <style>
    /* 🔑 KOZMİK ALTLIK */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000 !important;
        overflow: hidden !important; 
    }

    /* 🎨 BAĞIMSIZ SALVATOR MUNDI KATMANI */
    #arka-plan-tablo {
        position: absolute;
        /* 📐 KALP HİZALAMA MÜHÜRÜ: Buradaki değerlerle oynayarak resmi milimetrik kaydırabilirsiniz */
        top: 45%;               /* Ekranın dikey konumu (Yukarı almak için azaltın, aşağı için artırın) */
        left: 50%;              /* Yatayda tam ortalama */
        transform: translate(-50%, -50%); /* Tam merkezleme pivotu */
        width: auto;
        height: 90vh;           /* Ekran yüksekliğinin %90'ını kaplasın (Kasmaması için optimize boyut) */
        z-index: 1;             /* En arkada kalır */
        pointer-events: none;
    }

    /* 🔑 AC-DC MOTOR ENJEKTÖRÜ: seed-ac-dc-anatomy.html dosyasını çağırır */
    iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 50;            /* Tablonun önünde, panellerin arkasında kalır */
        background: transparent !important;
        mix-blend-mode: screen; /* Siyah arka planı eritip sadece neonları parlatır */
        pointer-events: none; 
    }
  </style>
</head>
<body>

  <!-- 🎨 TABLO BAĞIMSIZ ELEMAN OLARAK EN ARKEYA GÖMÜLDÜ -->
  <img id="arka-plan-tablo" src="./salvador-mundi.jpg" alt="Salvator Mundi">

  <!-- ⚡ AC-DC ANATOMY MOTORU ÖNE BİNDİRİLDİ -->
  <iframe src="./seed-ac-dc-anatomy.html"></iframe>

</body>
</html>
