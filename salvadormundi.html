<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salvator Mundi + AC-DC Kuantum Motoru Entegrasyonu</title>
  <style>
    /* 🔑 KOZMİK ALTLIK */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000 !important;
        overflow: hidden !important; 
    }

    /* 🎨 BAĞIMSIZ SALVATOR MUNDI KATMANI */
    #arka-plan-tablo {
        position: absolute;
        /* 📐 KALP HİZALAMA MÜHÜRÜ: Buradaki değerlerle oynayarak resmi milimetrik kaydırabilirsiniz */
        top: 45%;               /* Ekranın dikey konumu (Yukarı almak için azaltın, aşağı için artırın) */
        left: 50%;              /* Yatayda tam ortalama */
        transform: translate(-50%, -50%); /* Tam merkezleme pivotu */
        width: auto;
        height: 90vh;           /* Ekran yüksekliğinin %90'ını kaplasın (Kasmaması için optimize boyut) */
        z-index: 1;             /* En arkada kalır */
        pointer-events: none;

        
    }

    /* If you have a specific background container for the Salvator Mundi portrait, 
   upscale it by 1.15x or 1.2x to fill the Metatron grid lines perfectly */
/* 🎨 BAĞIMSIZ SALVATOR MUNDI KATMANI (EN-BOY ORANI KORUMALI FİTLENMİŞ) */
#bg-image {
    position: absolute;
    top: 50%; left: 50%;
    
    /* 📐 KESİN ORAN KİLİDİ: Resmin kalitesini bozmadan dikey yüksekliğe sabitler */
    height: 100vh !important;
    width: auto !important;
    object-fit: contain;
    
    /* 👑 UP-SCALE MATRIX: İsa'yı tam senin istediğin oranda büyütür ve ekranı ortalar */
    transform: translate(-50%, -50%) scale(1.15);
    transform-origin: center center;
    z-index: 1;
    pointer-events: none;
}

    /* 🔑 AC-DC MOTOR ENJEKTÖRÜ: seed-ac-dc-anatomy.html dosyasını çağırır */
    iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 50;            /* Tablonun önünde, panellerin arkasında kalır */
        background: transparent !important;
        mix-blend-mode: screen; /* Siyah arka planı eritip sadece neonları parlatır */
        pointer-events: none; 
    }
  </style>
</head>
<body>

  <!-- 🎨 TABLO BAĞIMSIZ ELEMAN OLARAK EN ARKEYA GÖMÜLDÜ -->
  <img id="bg-image" src="./salvador-mundi.jpg" alt="Salvator Mundi">

  <!-- ⚡ AC-DC ANATOMY MOTORU ÖNE BİNDİRİLDİ -->
  <iframe src="./seed-ac-dc-anatomy.html"></iframe>

</body>
</html>
