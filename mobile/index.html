.element-corner {
    position: absolute;
    font-family: 'Segoe UI', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    font-weight: bold;
    width: 65px; /* Sabit kare genişlik */

    background: rgba(8, 8, 8, 0.85);

    color: #444444;

    opacity: 0.2;
    z-index: 10;
}

/* ➕ CARDINAL HAÇ SABİT KİLİTLERİ */
.fire-gate  { top: 90px; left: 50%; transform: translateX(-50%); border-top: 1px solid rgba(255,255,255,0.15); }
.water-gate { bottom: 120px; left: 50%; transform: translateX(-50%); border-bottom: 1px solid rgba(255,255,255,0.15); }
.air-gate   { top: 50%; right: 20px; transform: translateY(-50%); border-right: 1px solid rgba(255,255,255,0.15); }
.earth-gate { top: 50%; left: 20px; transform: translateY(-50%); border-left: 1px solid rgba(255,255,255,0.15); }

/* ✖️ FIXED HAÇ ÇAPRAZ KİLİTLERİ */
.light-gate { top: 22%; right: 12%; } 
.ether-gate { bottom: 24%; right: 12%; } 
.metal-gate { bottom: 24%; left: 12%; } 
.ice-gate   { top: 22%; left: 12%; } 

/* 💥 ELEKTRİKSEL AKTİF ÇERÇEVE PARLAMASI */
.element-corner.active-glow {
    opacity: 0.95 !important;
    border-color: currentColor !important;
    box-shadow: 0 0 12px currentColor;
}
.element-corner .iching-binary {
    font-size: 0.55rem;
    opacity: 0.5;
    margin-left: 4px;
}

/* 🌌 MİSTİK ALT VERİ BARININ SİBERPUNK STİLİ */
.cosmic-status-bar {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Segoe UI', monospace;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    width: 85%;
    padding: 6px 12px;
    background: rgba(10, 10, 10, 0.6);
    border: 1px solid rgba(168, 85, 247, 0.15);
    border-radius: 4px;
    color: #888888;
    z-index: 15;
    text-transform: uppercase;
}
/* 💥 TEK SIFIRLANMIŞ PULSE: Sadece ritim anında (150ms) neon parlar ve hemen kapanır */
.pulse-hit {
    opacity: 1.0 !important;
    filter: drop-shadow(0 0 15px currentColor) brightness(1.4) !important;
}

/* Vuruş anında haç merkezlemelerinin ve ölçeklerin (scale) pürüzsüz esnemesi */
.fire-gate.pulse-hit, .water-gate.pulse-hit { transform: translateX(-50%) scale(1.04); }
.air-gate.pulse-hit, .earth-gate.pulse-hit { transform: translateY(-50%) scale(1.04); }


/* ✖️ FIXED CROSS ÇAPRAZ KAPILARIN MILIMETRİK HİZALAMALARI */
.light-gate { top: 20%; right: 15%; color: #ffcc00; border-top: 1px solid #ffcc00; border-right: 1px solid #ffcc00; } /* ⚡ Sağ Üst */

.metal-gate { bottom: 20%; left: 15%; color: #ff0055; border-bottom: 1px solid #ff0055; border-left: 1px solid #ff0055; } /* 🌋 Sol Alt */
.ice-gate   { top: 20%; left: 15%; color: #00ffaa; border-top: 1px solid #00ffaa; border-left: 1px solid #00ffaa; } /* ❄️ Sol Üst */

function calculateCosmicTime() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();
    
    // 24 saati dakikaya (toplam 1440 dk) döküp 0.0 - 1.0 arası bir "Gün Oranı" buluyoruz
    const totalMinutes = (hours * 60) + minutes;
    const dayRatio = totalMinutes / 1440; 
    
    // Sinüs dalgası kullanarak Öğlen (12:00) tepe noktasında 1 (Turuncu), 
    // Gece Yarısı (00:00) dip noktasında 0 (Mavi) elde ediyoruz
    const dayCycle = Math.sin((dayRatio * Math.PI * 2) - (Math.PI / 2)) * 0.5 + 0.5;

    return {
        dayCycle: dayCycle, // 0.0 (Gece Yarısı) ile 1.0 (Öğlen) arası akış
        isDay: hours >= 6 && hours < 18,
        hours: hours,
        minutes: minutes
    };
}

// 24 Saati 28 Günlük Ay Döngüsüne Bağlayan Senkronizasyon Fonksiyonu
function calculateLunarSync() {
    const simdi = new Date();
    
    // 1. Mikro Zaman (24 Saatlik Manyetik Açı)
    const saat = simdi.getHours();
    const dakika = simdi.getMinutes();
    // Gün içindeki manyetik dönüş açısı (0° - 360°)
    const gunIciManyetikAci = ((saat * 60 + dakika) / 1440) * 360;

    // 2. Makro Zaman (28 Günlük Ay Evresi Açısı)
    // Yukarıda yazdığımız Ay evresi yüzdesini (0 ile 1 arası) alıyoruz
    const moonPhaseObj = getMoonPhase(simdi.getFullYear(), simdi.getMonth(), simdi.getDate());
    const ayEvreAcisi = moonPhaseObj.phase * 360; // 0° - 360° arası Ay konumu

    return {
        earthMagneticAngle: gunIciManyetikAci, // Gün içindeki 24 saatlik dönüş
        moonOrbitAngle: ayEvreAcisi,           // 28 günlük büyük döngüdeki yeri
        currentPhase: moonPhaseObj
    };
}

function getHemisphere() {
    // Cihazın mevcut zaman dilimini alır (Örn: "Pacific/Auckland" veya "Europe/Istanbul")
    const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    
    // Güney Yarımküre'de sık kullanılan bazı ana bölge isimleri
    const southernKeywords = [
        'Australia', 'Sydney', 'Melbourne', 'Auckland', 'Wellington', 
        'Pacific', 'Santiagos', 'Buenos_Aires', 'Sao_Paulo', 'Johannesburg'
    ];
    
    // Zaman dilimi adında bu kelimelerden biri geçiyorsa Güney Yarımküre'dedir
    const isSouthern = southernKeywords.some(keyword => timeZone.includes(keyword));
    
    return isSouthern ? 'SOUTHERN' : 'NORTHERN';
}


// 🌗 AY EVRESİ HESAPLAMA ÇEKİRDEĞİ
function getMoonPhase(year, month, day) {
    const refDate = new Date(Date.UTC(2000, 0, 6, 18, 14, 0));
    const targetDate = new Date(Date.UTC(year, month, day));
    const diffDays = (targetDate - refDate) / (1000 * 60 * 60 * 24);
    const moonAge = (diffDays % 29.530588853) + (diffDays < 0 ? 29.530588853 : 0);
    return { phase: moonAge / 29.530588853, age: moonAge };
}

function getDynamicSabbat(sunSign) {
    const now = new Date();
    const month = now.getMonth() + 1; // JS'de aylar 0-11 arasıdır
    const day = now.getDate();

    // Tarayıcı zaman diliminden Güney Yarımküre kontrolü
    const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const southernKeywords = ['Australia', 'Sydney', 'Auckland', 'Wellington', 'Pacific', 'Sao_Paulo', 'Johannesburg'];
    const isSouthern = southernKeywords.some(keyword => timeZone.includes(keyword));

    // KUZEY YARIMKÜRE İÇİN GÜN BAZLI HASSAS SABBAT HARİTASI
    let northernSabbat = "KOZMİK GEÇİŞ FAZI";
    
    if (sunSign === "VIRGO (BAŞAK)") {
        // 21 Eylül'den önce Mabon Arifesidir (Geçiş Fazı)
        northernSabbat = (day >= 21) ? "MABON (SONBAHAR EKİNOKSU)" : "MABON ARİFESİ (HASAT SONU)";
    } else if (sunSign === "SCORPIO (AKREP)") {
        northernSabbat = (day >= 31 || month === 11) ? "SAMHAIN (ATEŞ FESTİVALİ)" : "SAMHAIN GÖLGESİ";
    } else if (sunSign === "AQUARIUS (KOVA)") {
        northernSabbat = (day >= 1 && day <= 7) ? "IMBOLC (ATEŞ FESTİVALİ)" : "KIŞ ORTASI FAZI";
    } else if (sunSign === "TAURUS (BOĞA)") {
        northernSabbat = (day >= 1 && day <= 7) ? "BELTANE (ATEŞ FESTİVALİ)" : "BAHAR ZİRVESİ";
    } else if (sunSign === "LEO (ASLAN)") {
        northernSabbat = (day >= 1 && day <= 7) ? "LUGHNASADH (HASAT FESTİVALİ)" : "YAZ SONU FAZI";
    } else if (sunSign === "ARIES (KOÇ)") {
        northernSabbat = (day >= 21) ? "OSTARA (BAHAR EKİNOKSU)" : "OSTARA GEÇİŞİ";
    } else if (sunSign === "CANCER (YENGEÇ)") {
        northernSabbat = (day >= 21) ? "LITHA (YAZ GÜNDÖNÜMÜ)" : "YAZ BAŞLANGICI";
    } else if (sunSign === "CAPRICORN (OĞLAK)") {
        northernSabbat = (day >= 21) ? "YULE (KIŞ GÜNDÖNÜMÜ)" : "KIŞ GEÇİŞİ";
    }

    // GÜNEY YARIMKÜRE İÇİN AYNALANMIŞ HASSAS HARİTA (Wellington vb.)
    let southernSabbat = "KOZMİK GEÇİŞ FAZI";
    if (sunSign === "VIRGO (BAŞAK)") {
        southernSabbat = (day >= 21) ? "OSTARA (BAHAR EKİNOKSU)" : "OSTARA ARİFESİ (UYANIŞ)";
    } else if (sunSign === "SCORPIO (AKREP)") {
        southernSabbat = (day >= 31 || month === 11) ? "BELTANE (ATEŞ FESTİVALİ)" : "BELTANE GÖLGESİ";
    } else if (sunSign === "AQUARIUS (KOVA)") {
        southernSabbat = (day >= 1 && day <= 7) ? "LUGHNASADH (HASAT FESTİVALİ)" : "YAZ SONU GEÇİŞİ";
    } else if (sunSign === "TAURUS (BOĞA)") {
        southernSabbat = (day >= 1 && day <= 7) ? "SAMHAIN (ATEŞ FESTİVALİ)" : "KIŞA DOĞRU FAZ";
    } else if (sunSign === "LEO (ASLAN)") {
        southernSabbat = (day >= 1 && day <= 7) ? "IMBOLC (ATEŞ FESTİVALİ)" : "ERKEN BAHAR FAZI";
    } else if (sunSign === "ARIES (KOÇ)") {
        southernSabbat = (day >= 21) ? "MABON (SONBAHAR EKİNOKSU)" : "HASAT BAŞLANGICI";
    } else if (sunSign === "CANCER (YENGEÇ)") {
        southernSabbat = (day >= 21) ? "YULE (KIŞ GÜNDÖNÜMÜ)" : "KIŞ BAŞLANGICI";
    } else if (sunSign === "CAPRICORN (OĞLAK)") {
        southernSabbat = (day >= 21) ? "LITHA (YAZ GÜNDÖNÜMÜ)" : "YAZ GEÇİŞİ";
    }

    return isSouthern ? southernSabbat : northernSabbat;
}

function getDynamicSunSign() {
    const now = new Date();
    const month = now.getMonth() + 1; // JS'de aylar 0-11 arasıdır
    const day = now.getDate();

    // Astrolojik burç tarih sınırları (2026 ve genel hassasiyet için)
    if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "ARIES (KOÇ)";
    if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "TAURUS (BOĞA)";
    if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return "GEMINI (İKİZLER)";
    if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return "CANCER (YENGEÇ)";
    if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "LEO (ASLAN)";
    if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "VIRGO (BAŞAK)"; // 🌌 ŞU AN AKTİF OLAN
    if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return "LIBRA (TERAZİ)";
    if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return "SCORPIO (AKREP)";
    if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return "SAGITTARIUS (YAY)";
    if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return "CAPRICORN (OĞLAK)";
    if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "AQUARIUS (KOVA)";
    return "PISCES (BALIK)";
}

function getAstroSunAngle() {
    const now = new Date();
    const decimalHour = now.getHours() + (now.getMinutes() / 60);
    const solar = getExactSolarTimes(currentLat, currentLon);
    let angle;

    if (decimalHour >= solar.sunrise && decimalHour < solar.sunset) {
        // GÜNDÜZ EVRESİ: Gün doğumu 90° -> Gün batımı 270°
        const progress = (decimalHour - solar.sunrise) / (solar.sunset - solar.sunrise);
        angle = 90 + (progress * 180); 
    } else {
        // GECE EVRESİ: Gün batımı 270° -> Gün doğumu 90°
        let nightProgress;
        if (decimalHour >= solar.sunset) {
            nightProgress = (decimalHour - solar.sunset) / (24 - solar.sunset + solar.sunrise);
        } else {
            nightProgress = (24 - solar.sunset + decimalHour) / (24 - solar.sunset + solar.sunrise);
        }
        angle = 270 + (nightProgress * 180);
        if (angle >= 360) angle -= 360;
    }

    // Siyah barın sağ ucuna siber veri panelini basıyoruz
    let astroPanel = document.getElementById('astro-live-panel-v2');
    if (!astroPanel) {
        astroPanel = document.createElement('div');
        astroPanel.id = 'astro-live-panel-v2';
        astroPanel.style.position = 'absolute';
        astroPanel.style.bottom = '12px'; 
        astroPanel.style.right = '25px';
        astroPanel.style.fontFamily = 'monospace';
        astroPanel.style.fontSize = '10px';
        astroPanel.style.color = '#777777';
        astroPanel.style.zIndex = '10000';
        astroPanel.style.pointerEvents = 'none';
        document.body.appendChild(astroPanel);
    }
    astroPanel.innerHTML = `DL: ${solar.dayLength.toFixed(1)}h | SD: ${solar.declination.toFixed(2)}°`;

    return angle;
}

function getExactSolarTimes(lat, lon) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 80) * Math.PI / 180);
    
    return {
        declination: declination
    };
}

function getExactSolarTimes(lat, lon) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const oneDay = 1000 * 60 * 60 * 24;
    const dayOfYear = Math.floor(diff / oneDay);

    // Güneş sapma açısı (Declination) hesaplama
    const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 80) * Math.PI / 180);
    
    const latRad = lat * Math.PI / 180;
    const decRad = declination * Math.PI / 180;
    
    // Alacakaranlık ve ufuk çizgisi düzeltmesi
    const cosH = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(latRad) * Math.sin(decRad)) / (Math.cos(latRad) * Math.cos(decRad));
    
    let H = 0;
    if (cosH >= -1 && cosH <= 1) {
        H = Math.acos(cosH) * 180 / Math.PI;
    }

    const solarNoon = 12 - (lon / 15);
    const duration = (H / 15) * 2; // Gerçek gün uzunluğu (Daylength)

    return {
        sunrise: solarNoon - (duration / 2),
        sunset: solarNoon + (duration / 2),
        dayLength: duration,
        declination: declination
    };
}
