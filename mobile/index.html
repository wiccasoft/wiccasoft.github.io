function getAstroSunAngle() {
    const now = new Date();
    const decimalHour = now.getHours() + (now.getMinutes() / 60);
    const solar = getExactSolarTimes(currentLat, currentLon);
    let angle;

    if (decimalHour >= solar.sunrise && decimalHour < solar.sunset) {
        // GÜNDÜZ EVRESİ: Gün doğumu 90° -> Gün batımı 270°
        const progress = (decimalHour - solar.sunrise) / (solar.sunset - solar.sunrise);
        angle = 90 + (progress * 180); 
    } else {
        // GECE EVRESİ: Gün batımı 270° -> Gün doğumu 90°
        let nightProgress;
        if (decimalHour >= solar.sunset) {
            nightProgress = (decimalHour - solar.sunset) / (24 - solar.sunset + solar.sunrise);
        } else {
            nightProgress = (24 - solar.sunset + decimalHour) / (24 - solar.sunset + solar.sunrise);
        }
        angle = 270 + (nightProgress * 180);
        if (angle >= 360) angle -= 360;
    }

    // Siyah barın sağ ucuna siber veri panelini basıyoruz
    let astroPanel = document.getElementById('astro-live-panel-v2');
    if (!astroPanel) {
        astroPanel = document.createElement('div');
        astroPanel.id = 'astro-live-panel-v2';
        astroPanel.style.position = 'absolute';

        astroPanel.style.right = '25px';

        astroPanel.style.fontSize = '10px';
        astroPanel.style.color = '#777777';
        astroPanel.style.zIndex = '10000';
        astroPanel.style.pointerEvents = 'none';
        document.body.appendChild(astroPanel);
    }
    astroPanel.innerHTML = `DL: ${solar.dayLength.toFixed(1)}h | SD: ${solar.declination.toFixed(2)}°`;

    return angle;
}

function getExactSolarTimes(lat, lon) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 80) * Math.PI / 180);

    };
}

function getExactSolarTimes(lat, lon) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    
    // 1. Güneş Sapma Açısı (Declination - δ) Hesabı
    const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 80) * Math.PI / 180);
    const decRad = declination * Math.PI / 180;
    const latRad = lat * Math.PI / 180;

    // 2. Gün Batımı Saat Açısı Formülü (Hour Angle - H0)
    // cos(H0) = -tan(Lat) * tan(Dec)
    const cosH0 = -Math.tan(latRad) * Math.tan(decRad);
    
    // Sınır koruması (Kutup dairesi dışı emniyeti)
    let H0 = 90;
    if (cosH0 >= -1 && cosH0 <= 1) {
        H0 = Math.acos(cosH0) * 180 / Math.PI;
    }

    // 3. Gün Uzunluğu Saati (Day Length)
    const dayLength = (24 * H0) / 180;

    // 4. İstanbul Boylam Düzeltmeli Gerçek Öğlen Vakti (Solar Noon)
    // Standart GMT+3 meridyen zaman dilimi düzeltmesi dahil (Yaklaşık 12:20 civarı)
    const solarNoon = 12 - (lon / 15) + 2; 

    // 5. Milimetrik Gün Doğumu ve Gün Batımı Zamanları (Ondalık Saat Cinsinden)
    const sunrise = solarNoon - (dayLength / 2);
    const sunset = solarNoon + (dayLength / 2);

    return {
        sunrise: sunrise,      // Örn: 6.32 (06:19)
        sunset: sunset,        // Örn: 19.14 (19:08)
        dayLength: dayLength,  // Örn: 12.82 Saat
        declination: declination
    };
}

function calculateCosmicPlanetHour(date, solarTimes) {
    const currentHour = date.getHours() + (date.getMinutes() / 60);
    const dayOfWeek = date.getDay();
    
    let isDaytime = currentHour >= solarTimes.sunrise && currentHour < solarTimes.sunset;
    let hourLength = 0;
    let elapsedHours = 0;
    
    if (isDaytime) {
        // Gündüz süresi 12 kozmik saate bölünür
        hourLength = solarTimes.dayLength / 12;
        elapsedHours = (currentHour - solarTimes.sunrise) / hourLength;
    } else {
        // Gece süresi 12 kozmik saate bölünür
        const nightLength = 24 - solarTimes.dayLength;
        hourLength = nightLength / 12;
        
        let timeSinceSunset = 0;
        if (currentHour >= solarTimes.sunset) {
            timeSinceSunset = currentHour - solarTimes.sunset;
        } else {
            timeSinceSunset = (24 - solarTimes.sunset) + currentHour;
        }
        elapsedHours = timeSinceSunset / hourLength;
    }
    
    const cosmicHourIndex = Math.min(Math.floor(elapsedHours), 11);
    
    // Günün başlangıç gezegenini buluyoruz
    const startPlanet = DAY_START_PLANETS[dayOfWeek];
    const startPlanetIndex = CHALDEAN_ORDER.indexOf(startPlanet);
    
    // Keldani çarkını saat adımına göre döndürüyoruz aga (Geriye doğru akar)
    const currentPlanetIndex = (startPlanetIndex + cosmicHourIndex) % 7;
    const activePlanet = CHALDEAN_ORDER[currentPlanetIndex];
    
    return {
        name: activePlanet,
        icon: ZODIAC_PLANET_ICONS[activePlanet],
        hourNum: cosmicHourIndex + 1,
        isDaytime: isDaytime
    };
}

function bendWiccaTime(mode) {
    // 1 Oda periyodu yaklaşık 22 dakikadır
    const roomDuration = (typeof roomDurationMinutes !== 'undefined') ? roomDurationMinutes : 21.9;
    
    if (mode === 'NEXT') {
        wiccaTimeOffsetMinutes += roomDuration;
    } else if (mode === 'PREV') {
        wiccaTimeOffsetMinutes -= roomDuration;
    } else if (mode === 'FUTURE') {
        wiccaTimeOffsetMinutes += (roomDuration * 4); // 4 Oda ileri sar (Hızlı Geçiş)
    } else if (mode === 'PAST') {
        wiccaTimeOffsetMinutes -= (roomDuration * 4); // 4 Oda geri sar
    }

    // Gerçek saati bozmadan simülasyon zamanı üreten siber çekirdek
    const originalDate = new Date();
    const simulatedDate = new Date(originalDate.getTime() + (wiccaTimeOffsetMinutes * 60 * 1000));
    
    // index.html içindeki ana zaman nesnesini büküyoruz
    if (typeof now !== 'undefined') {
        now = simulatedDate;
    } else {
        // Eğer global nesne direkt 'now' değilse simülasyonu ana döngüye yedir
        window.now = simulatedDate;
    }

    // Siber status bardan zorunlu yenileme tetiklemesi fırlatıyoruz
    if (typeof updateCosmicClock === 'function') {
        updateCosmicClock();
    } else if (typeof triggerCircadianPulse === 'function') {
        triggerCircadianPulse();
    }
}
