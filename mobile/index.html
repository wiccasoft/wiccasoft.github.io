/* =========================================================================
   📱 WICCA OS: GLOBAL UYGULAMA ALT ANA MENÜ BAR SÜRÜCÜSÜ
   ========================================================================= */
.wicca-unified-dock {
    position: fixed !important;
    bottom: 50px !important; /* Alt barın tam üst çizgisine kilitli */
    left: 50% !important;
    transform: translateX(-50%) !important;
    width: 100vw !important;
    max-width: 420px !important;
    background: rgba(6, 6, 6, 0.4) !important; /* Başlangıçta cam gibi şeffaf */
    backdrop-filter: blur(4px);
    border: 1px solid rgba(122, 0, 255, 0.2) !important;
    border-radius: 6px !important;
    padding: 6px 12px !important;
    height: 32px !important; /* Kapalıyken sadece tek satır özet sığar */
    overflow: hidden !important;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
    z-index: 999999 !important;
    pointer-events: auto !important;
    cursor: pointer;
}

/* Dokunulduğunda yukarı doğru bir aplikasyon kartı gibi şahlanma derinliği */
.wicca-unified-dock.dock-expanded {
    height: 155px !important; 
    background: rgba(6, 6, 6, 0.96) !important; /* Detaylar net okunsun diye opaklaşır */
    backdrop-filter: blur(12px) !important;
    box-shadow: 0 -8px 25px rgba(122, 0, 255, 0.25) !important;
}

/* =========================================================================
   🔮 WICCAPANEL TAŞMA VE YARIDA KAYBOLMA ÖNLEYİCİ KALKAN
   ========================================================================= */
.dock-summary-line {
    width: 100% !important;
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    flex-wrap: nowrap !important; /* Yan yana durmayı koru ama sıkışmayı engelle */
    gap: 4px !important;
}

/* 🎯 Satırın mobilde yarıda kesilmesini engelleyen akıllı ölçekleyici */
.dock-summary-line span:first-child {
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: clip !important; /* Kesilmeyi yumuşatmak için */
    flex-shrink: 1 !important; /* Ekran daralırsa butonların üzerine binme, kendini uyarla */
}

/* En alttaki donuk statü yazısını kökten imha eden kalkan */
.cosmic-status-bar {
    display: none !important;
}
.app-settings-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 90vw;
    max-width: 420px;
    height: 45px;
    background: rgba(8, 8, 8, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(122, 0, 255, 0.3);
    border-bottom: none; /* Tabana tam otursun */
    border-radius: 8px 8px 0 0; /* Üst köşeler aplikasyon gibi yumuşak */
    box-shadow: 0 -5px 15px rgba(122, 0, 255, 0.15);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 8px;
    z-index: 9999999 !important; /* Her şeyin üstünde, her an tıklanabilir */
    pointer-events: auto; /* Tıklamaları kaçırma aga */
    font-family: monospace;
}

/* Menü Butonlarının Siber Estetiği */
.deck-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #888;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    height: 100%;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.deck-btn span {
    font-size: 12px;
    filter: grayscale(100%); /* Emojileri mat yapıyoruz arayüzü bozmasın */
    transition: all 0.2s ease;
}

/* Hover ve Aktifleşme Efektleri */
.deck-btn:hover, .deck-btn:active {
    color: #00ffaa; /* Aktifleşince siber yeşil parlasın aga */
    text-shadow: 0 0 5px #00ffaa;
}
.deck-btn:hover span, .deck-btn:active span {
    filter: grayscale(0%); /* Üzerine gelince emojinin rengi canlansın */
    transform: scale(1.1);
}

/* =========================================================================
   📐 ESKİ ALT PANELLERİN ÇAKIŞMASINI ÖNLEYEN KONTROL KİLİTLERİ
   ========================================================================= */
/* Yeni eklediğimiz bu 45px'lik bar altı kaplayacağı için, eski alt panellerini 
   tam olarak bu barın üzerine jilet gibi hizalıyoruz aga, hiçbir şey kaymıyor! */

}

    /* =========================================================================
   🎛️ WICCA OS: GLOBAL STOR PERDE MENÜ ALTYAPISI (MASAÜSTÜ & MOBİL)
   ========================================================================= */
#time-machine-panel {
    position: fixed !important;
    top: 0 !important;
    left: 50% !important;
    margin: 0 !important;
    width: 92% !important;
    max-width: 400px !important;
    
    /* 🎯 SİHİRLİ GİZLEME: Panel varsayılan olarak ekranın tavanında pusuya yatar */
    transform: translate(-50%, -100%) !important; 
    
    /* Geçişler pavyon gibi değil, siber akışkanlıkta aksın aga */
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;
    border-radius: 0 0 8px 8px !important;
    background: rgba(5, 5, 5, 0.95) !important;
    backdrop-filter: blur(12px) !important;
    box-shadow: 0 10px 30px rgba(122, 0, 255, 0.4) !important;
    z-index: 99999999 !important;
}

/* Menü aktifleştiğinde paneli stor perde gibi aşağı indiren sihirli sınıf */
#time-machine-panel.wicca-drawer-active {
    transform: translate(-50%, 0) !important;
}

/* 🔮 PANEL AÇILDIĞINDA TETİKLEYİCİ BUTONU GİZLEME KİLİDİ */
#time-machine-panel.wicca-drawer-active ~ #wicca-global-toggle,
#time-machine-panel.wicca-drawer-active + #wicca-global-toggle {
    opacity: 0 !important;
    pointer-events: none !important; /* Arkada kalıp yanlışlıkla tıklanmasını engeller */
    visibility: hidden !important;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* Orijinal butonuna da akıcı kaybolma efekti ekleyelim (Eğer yoksa) */
#wicca-global-toggle {
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* 🕒 Ekranın En Tepesinde Parlayacak Global Tetikleyici Buton */
.wicca-global-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100000000 !important; /* Her şeyin en tepesinde */
    background: rgba(10, 10, 10, 0.85);
    border: 1px solid #7a00ff;
    box-shadow: 0 0 10px rgba(122, 0, 255, 0.4);
    color: #fff;
    padding: 5px 14px;
    border-radius: 20px;
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: bold;
    cursor: pointer;
    pointer-events: auto !important;
    transition: all 0.3s ease;
}

.wicca-global-trigger:hover {
    background: rgba(122, 0, 255, 0.2);
    box-shadow: 0 0 15px #7a00ff;
}

function calculateMayaLongCount(date) {
    if (!date || typeof date.getTime !== 'function') {
        date = window.now || new Date();
    }
    
    // Maya Zaman Başlangıcı (Kutsal Epoch): 11 Ağustos M.Ö. 3114 (0.0.0.0.0)
    // Korelasyon sabiti (GMT GMT+0 bükümü): 584283 gün farkı kalkanı
    const mayaEpochMs = new Date(Date.UTC(-3114, 7, 11, 0, 0, 0)).getTime();
    const msPerDay = 86400000;
    
    let totalDaysSinceCreation = Math.floor((date.getTime() - mayaEpochMs) / msPerDay);
    
    // 5 Devasa Maya Dişlisinin (Vortex) Milimetrik Parçalanması:
    // 1 Baktun = 144,000 Gün | 1 Katun = 7,200 Gün | 1 Tun = 360 Gün | 1 Uinal = 20 Gün | 1 Kin = 1 Gün
    let baktun = Math.floor(totalDaysSinceCreation / 144000);
    let rem = totalDaysSinceCreation % 144000;
    
    let katun = Math.floor(rem / 7200);
    rem = rem % 7200;
    
    let tun = Math.floor(rem / 360);
    rem = rem % 360;
    
    let uinal = Math.floor(rem / 20);
    let kin = rem % 20;
    
    // 🔮 TZOLKIN KUTSAL ÇARK HESABI (260 Günlük Galaktik İttifak Döngüsü):
    // 13 Sayı ve 20 Kutsal Burç Sembolünün dansı aga:

        "Chuen", "Eb", "Ben", "Ix", "Men", "Cib", "Caban", "Etznab", "Cauac", "Ahau"
    ];
    
    // 4 Zodyak başlangıç kayması tabanı (0.0.0.0.0 günü 4 Ahau idi aga)
    let tzolkinNumber = ((totalDaysSinceCreation + 3) % 13) + 1;
    let tzolkinGlyphIndex = (totalDaysSinceCreation + 19) % 20;
    let activeTzolkinGlyph = TZOLKIN_GLYPHS[tzolkinGlyphIndex];

    return {
        longCountText: `${baktun}.${katun}.${tun}.${uinal}.${kin}`,
        tzolkinText: `${tzolkinNumber} ${activeTzolkinGlyph}`,
        totalDays: totalDaysSinceCreation
    };
}

function getAstroSunAngle() {

    let angle;

    if (decimalHour >= solar.sunrise && decimalHour < solar.sunset) {
        // GÜNDÜZ EVRESİ: Gün doğumu 90° -> Gün batımı 270°
        const progress = (decimalHour - solar.sunrise) / (solar.sunset - solar.sunrise);
        angle = 90 + (progress * 180); 
    } else {
        // GECE EVRESİ: Gün batımı 270° -> Gün doğumu 90°
        let nightProgress;
        if (decimalHour >= solar.sunset) {
            nightProgress = (decimalHour - solar.sunset) / (24 - solar.sunset + solar.sunrise);
        } else {
            nightProgress = (24 - solar.sunset + decimalHour) / (24 - solar.sunset + solar.sunrise);
        }
        angle = 270 + (nightProgress * 180);
        if (angle >= 360) angle -= 360;
    }

    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));

function getExactSolarTimes(lat, lon) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    
    // 1. Güneş Sapma Açısı (Declination - δ) Hesabı
    const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 80) * Math.PI / 180);
    const decRad = declination * Math.PI / 180;
    const latRad = lat * Math.PI / 180;

    // 2. Gün Batımı Saat Açısı Formülü (Hour Angle - H0)
    // cos(H0) = -tan(Lat) * tan(Dec)
    const cosH0 = -Math.tan(latRad) * Math.tan(decRad);
    
    // Sınır koruması (Kutup dairesi dışı emniyeti)
    let H0 = 90;
    if (cosH0 >= -1 && cosH0 <= 1) {
        H0 = Math.acos(cosH0) * 180 / Math.PI;
    }

    // 3. Gün Uzunluğu Saati (Day Length)
    const dayLength = (24 * H0) / 180;

    // 4. İstanbul Boylam Düzeltmeli Gerçek Öğlen Vakti (Solar Noon)
    // Standart GMT+3 meridyen zaman dilimi düzeltmesi dahil (Yaklaşık 12:20 civarı)
    const solarNoon = 12 - (lon / 15) + 2; 

    // 5. Milimetrik Gün Doğumu ve Gün Batımı Zamanları (Ondalık Saat Cinsinden)
    const sunrise = solarNoon - (dayLength / 2);
    const sunset = solarNoon + (dayLength / 2);

    return {
        sunrise: sunrise,      // Örn: 6.32 (06:19)
        sunset: sunset,        // Örn: 19.14 (19:08)
        dayLength: dayLength,  // Örn: 12.82 Saat
        declination: declination
    };
}

// 🌙 METATRON ENGINE: SAF MATEMATİKSEL REAL-TIME AY EVRESİ MOTORU
// =========================================================================
function calculateMetatronMoon(date) {
    // 🛡️ [WICCA CODESEC] Parametre boş gelirse çökmesin kalkanı
    if (!date || typeof date.getTime !== 'function') {
        date = (typeof window.now !== 'undefined' && window.now) ? window.now : new Date();
    }

    const msPerDay = 86400000;
    const currentMs = date.getTime();
    
    // Astronomik Yeni Ay referans başlangıcı (Saf Yin Eşiği)
    const knownNewMoonEpoch = new Date("2000-01-06T18:14:00Z").getTime();
    const lunarSynodicPeriodMs = 29.530588853 * msPerDay;
    
    let elapsedMs = currentMs - knownNewMoonEpoch;
    let currentPhaseProgress = (elapsedMs % lunarSynodicPeriodMs) / lunarSynodicPeriodMs;
    if (currentPhaseProgress < 0) currentPhaseProgress += 1;
    
    let moonAgeDays = currentPhaseProgress * 29.530588853;
    
    // =========================================================================
    // 🌍 90 DERECE LUNISOLAR SENKRONİZASYON FORMÜLÜ (GÜNEŞE TAM DİK AKS KALKANI)
    // =========================================================================
    // Eski düz çarpanlı if-else formülünü çöpe fırlattık aga! 
    // Ay'ın gerçek küresel aydınlanma oranını veren resmi astronomik formülü çaktık:
    // Bu matematik, tam İlk Dördün açısında (0.25 progress) cos(90) = 0 üreterek 
    // ekrana hatasız, milimetrik %50 (fifty-fifty) basar aga:
    let moonIlluminatedPercent = Math.round((1 - Math.cos(currentPhaseProgress * Math.PI * 2)) * 50);

    let phaseName = "";
    let moonSymbol = "🌑";

    // Senin o asil, el değmemiş evre sınırların ve isimlerin aynen korunuyor aga:
    if (moonAgeDays < 1.0 || moonAgeDays > 28.5) {
        phaseName = "Waxing New Moon"; moonSymbol = "🌑";
    } else if (moonAgeDays >= 1.0 && moonAgeDays < 6.89) {
        phaseName = "Waxing Crescent (Hilal)"; moonSymbol = "🌙";
    } else if (moonAgeDays >= 6.89 && moonAgeDays < 8.39) {
        phaseName = "First Quarter (İlk Dördün)"; moonSymbol = "🌓";
    } else if (moonAgeDays >= 8.39 && moonAgeDays < 13.76) {
        phaseName = "Waxing Gibbous (Büyüyen)"; moonSymbol = "🌔";
    } else if (moonAgeDays >= 13.76 && moonAgeDays < 15.76) {
        phaseName = "Full Moon (Dolunay — Yang Zirvesi)"; moonSymbol = "🌕";
    } else if (moonAgeDays >= 15.76 && moonAgeDays < 21.14) {
        phaseName = "Waning Gibbous (Küçülen)"; moonSymbol = "🌖";
    } else if (moonAgeDays >= 21.14 && moonAgeDays < 22.64) {
        phaseName = "Last Quarter (Son Dördün)"; moonSymbol = "🌗";
    } else {
        phaseName = "Waning Crescent (Eski Hilal)"; moonSymbol = "🌘";
    }

    return {
        percent: moonIlluminatedPercent, // Artık gerçek gökyüzüyle tam senkron akacak yüzde verisi
        name: phaseName,
        icon: moonSymbol,
        age: moonAgeDays.toFixed(1),
        seleneProgress: currentPhaseProgress // Üst panele ikon seçen o akışkan katsayı
    };
}

// 🪐 KUTSAL AKS MOTORU: NORTH & SOUTH NODE (RAHU & KETU) DOĞRULAYICI
// =========================================================================
function calculateCosmicNodes(date) {
    const currentMs = date.getTime();
    
    // Astronomik referans noktası: 1 Ocak 2000'de North Node tam 149.38° (Aslan) boylamındaydı.
    const refMs = new Date("2000-01-01T00:00:00Z").getTime();
    const elapsedDays = (currentMs - refMs) / (1000 * 60 * 60 * 24);
    
    // Ay düğümleri gökyüzünde sürekli GERİYE (Retrograde) doğru yürür aga.
    // Tam bir turu (360 dereceyi) 6793.5 günde (18.6 yılda) tamamlarlar:
    let northNodeDegrees = (149.38 - (elapsedDays * (360 / 6793.5))) % 360;
    if (northNodeDegrees < 0) northNodeDegrees += 360;
    
    // South Node her zaman North Node'un tam 180 derece karşı (opposite) kutbundadır!
    let southNodeDegrees = (northNodeDegrees + 180) % 360;
    
    // 64 odalık sirkadiyen kadrandaki yansıma odalarını türetiyoruz aga:
    let northNodeRoom = Math.floor((northNodeDegrees / 360) * 64);
    let southNodeRoom = Math.floor((southNodeDegrees / 360) * 64);
    
    return {
        northRoom: northNodeRoom,
        southRoom: southNodeRoom,
        northDeg: northNodeDegrees.toFixed(1),
        southDeg: southNodeDegrees.toFixed(1)
    };
}

// =========================================================================
// 🎛️ 790Y KELDANİ ÇARKI & 13 AY DÖNGÜSÜ ZAMAN BÜKÜM MOTORU [CHALDEAN_GEAR]
// =========================================================================
function calculateChaldeanMatrix(targetDate) {
    // Keldani Çarkı başlangıç (Epoch) referansı: 26 Temmuz 2026 (Yeni Yıl / Manyetik Sıçrama)
    const chaldeanEpoch = new Date("2026-07-26T00:00:00");
    
    let diffTime = targetDate.getTime() - chaldeanEpoch.getTime();
    let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    
    // Zaman makinesi negatif taşma (Past) kalkanı:
    if (diffDays < 0) {
        diffDays = (365 * 1000 + diffDays) % (365 * 1000); 
    }
    
    // 🌌 [WICCA_TUNB_GEAR]: Gün ilerlemesini tam 365 günlük güneş yılı moduna alıyoruz aga!
    let yearDayIndex = diffDays % 365; // 0 ile 364 arası bir değer döner
    
    let currentChaldeanDay = (yearDayIndex % 28) + 1;
    let currentChaldeanMonthIndex = Math.floor(yearDayIndex / 28) + 1;
    
    const CHALDEAN_MOONS = [
        "MAGNETIC MOON", "LUNAR MOON", "ELECTRIC MOON", "SELF-EXISTING MOON",
        "OVERTONE MOON", "RHYTHMIC MOON", "RESONANT MOON", "GALACTIC MOON",
        "SOLAR MOON", "PLANETARY MOON", "SPECTRAL MOON", "CRYSTAL MOON", "COSMIC MOON"
    ];
    
    let moonName = CHALDEAN_MOONS[currentChaldeanMonthIndex - 1] || "TIMELESS MOON";
    
    // ☯ [GREEN DAY KALKANI]: Yılın tam 365. günü (İndex 364) zaman durur, sarkaç sıfırlanır!
    if (yearDayIndex === 364) {
        moonName = "GREEN DAY [ZAMAN DIŞI GÜN]";
        currentChaldeanDay = "☯";
        currentChaldeanMonthIndex = 13; // 13. Ayın son mühür eşiği
    }
    
    return {
        monthNum: currentChaldeanMonthIndex,
        moonName: moonName,
        dayNum: currentChaldeanDay
    };
}

// 🪐 METATRON ENGINE: 8000 YILLIK SAF MATEMATİKSEL PLANET İŞLEMCİSİ
// =========================================================================
function calculateMetatronPlanets(date) {
    const msPerDay = 86400000;
    const currentMs = date.getTime();
    
    // J2000.0 Astronomik Hizalama Çağı (1 Ocak 2000 Başlangıç Noktası)
    const epochJ2000 = new Date("2000-01-01T12:00:00Z").getTime();
    const elapsedDays = (currentMs - epochJ2000) / msPerDay;

    // 🧬 Gezegenlerin Hassas Yörünge Periyotları (Dünya Gün Değeri) ve Başlangıç Dereceleri
    const PLANET_CYCLES = {
        "SATÜRN":  { period: 10759.22, startDeg: 49.94,  color: "#1a1a1a", icon: "♄" }, // Siyah/Koyu Gri
        "JÜPİTER": { period: 4332.59,  startDeg: 34.35,  color: "#7a00ff", icon: "♃" }, // Mor
        "MARS":    { period: 686.98,   startDeg: 355.45, color: "#ff0000", icon: "♂" }, // Kırmızı Mars!
        "VENÜS":   { period: 224.70,   startDeg: 181.98, color: "#00ffaa", icon: "♀" }, // Yeşil Venüs!
        "MERKÜR":  { period: 87.97,    startDeg: 252.25, color: "#ffaa00", icon: "☿" }  // Sarı
    };

    const ZODIAC_SIGNS = [
        { name: "ARIES", sym: "♈" }, { name: "TAURUS", sym: "♉" }, { name: "GEMINI", sym: "♊" },
        { name: "CANCER", sym: "♋" }, { name: "LEO", sym: "♌" }, { name: "VIRGO", sym: "♍" },
        { name: "LIBRA", sym: "♎" }, { name: "SCORPIO", sym: "♏" }, { name: "SAGITTARIUS", sym: "♐" },
        { name: "CAPRICORN", sym: "♑" }, { name: "AQUARIUS", sym: "♒" }, { name: "PISCES", sym: "♓" }
    ];

    let computedPlanets = {};

    for (let pName in PLANET_CYCLES) {
        let p = PLANET_CYCLES[pName];
        
        // Gezegenin 8000 yıllık lineer uzay-zaman büküm açısı hesaplanıyor aga:
        let totalShiftDeg = (elapsedDays * (360 / p.period));
        let finalDeg = (p.startDeg + totalShiftDeg) % 360;
        if (finalDeg < 0) finalDeg += 360;

        let signIdx = Math.floor(finalDeg / 30) % 12;
        let bakiyeDeg = Math.floor(finalDeg % 30);
        
        // Sinodik retro büküm filtresi (Yıllık Dünya-Gezegen yaklaşma anomalisi)
        const dayOfYear = (date.getTime() - new Date(date.getFullYear(), 0, 1).getTime()) / msPerDay;
        let isRetro = false;
        if (pName === "MARS" && (dayOfYear % 780 >= 350 && dayOfYear % 780 <= 430)) isRetro = true;
        if (pName === "VENÜS" && (dayOfYear % 584 >= 540 || dayOfYear % 584 <= 40)) isRetro = true;
        if (pName === "SATÜRN" && (dayOfYear % 378 >= 130 && dayOfYear % 378 <= 270)) isRetro = true;

        computedPlanets[pName] = {
            sign: ZODIAC_SIGNS[signIdx].name,
            symbol: ZODIAC_SIGNS[signIdx].sym,
            deg: bakiyeDeg,
            color: p.color,
            icon: p.icon,
            retro: isRetro ? "[Rx]" : "[DIR]"
        };
    }

    return computedPlanets;
}

    window.isTimeBended = true; 
    
    // Giriş odasını mutlak korumalı global hafıza hücresinden çekiyoruz aga
    if (typeof window.currentCalculatedRoom === 'undefined' || window.currentCalculatedRoom === null) {
        window.currentCalculatedRoom = typeof sunRoom64 !== 'undefined' ? sunRoom64 : 0;
    }
    
    let currentRoom = window.currentCalculatedRoom;

    // Vites kontrolünü normalize et aga
    let mode = window.wiccaTimeMode ? window.wiccaTimeMode.toUpperCase() : 'ODA';
    if (mode === 'SAAT') mode = 'ODA';

    // 🎯 SADECE SAYISAL AKIŞ MATRİSİ (Zaman kayması karmaşası tamamen bypass edildi!)
    if (mode === 'ODA') {
        let kalan = currentRoom % 8;

        if (direction === 'FUTURE') {
            forcedRoom = currentRoom + (kalan === 0 ? 8 : (8 - kalan)); 
        } 
        else if (direction === 'PAST') {
            forcedRoom = currentRoom - (kalan === 0 ? 8 : kalan);
        }
        
        forcedRoom = (forcedRoom + 64) % 64;
    } else {
        // GÜN, HAFTA, AY modları için sarsılmaz makro blok adımları:
        let delta = (mode === 'GÜN') ? 2 : (mode === 'HAFTA' ? 3 : 4);
        let idx = (Math.floor(currentRoom / 8) + (direction === 'FUTURE' ? delta : -delta + 8)) % 8;
        forcedRoom = idx * 8;
    }

    // 🎯 [MUTLAK KİLİT]: Değerleri senkron olarak anında hafızaya çiviliyoruz!
    window.currentCalculatedRoom = forcedRoom;
    if (typeof sunRoom64 !== 'undefined') { sunRoom64 = forcedRoom; }
    if (typeof currentRoomSafe !== 'undefined') { currentRoomSafe = forcedRoom; }
    window.wiccaSabbatIndex = Math.floor(forcedRoom / 8) % 8;

    // Astronomik kütüphanelerinin çökmemesi için sanal zaman havuzunu da senkron işletiyoruz:
    window.wiccaTimeOffsetMinutes = forcedRoom * 22.5;
    const baseDate = new Date();
    window.now = new Date(baseDate.getTime() + (window.wiccaTimeOffsetMinutes * 60 * 1000));
    window.wiccaCurrentAxisDate = window.now;

    console.log(`🔮 [MÜHÜR V20] Oda Tam 8'in Katına Kilitlendi: ${forcedRoom}`);

    // Ekranı gecikmesiz, anında senkron olarak çizdir aga fırlat!
    if (typeof updateWiccaDock === 'function') { updateWiccaDock(); }
};

        // Sınır koruması
        moonIndex = Math.max(0, Math.min(12, moonIndex));
        
        mayaPhaseStr = `${MAYA_MOONS[moonIndex]} [Day: ${moonDay}/28]`;

const boylamiBurcaCevirAga = (deg) => {
    const ZODIAC_SIGNS = [
        { name: "Koç", symbol: "♈" },     { name: "Boğa", symbol: "♉" }, 
        { name: "İkizler", symbol: "♊" }, { name: "Yengeç", symbol: "♋" },
        { name: "Aslan", symbol: "♌" },    { name: "Başak", symbol: "♍" }, // 150° - 180°
        { name: "Terazi", symbol: "♎" },   { name: "Akrep", symbol: "♏" },
        { name: "Yay", symbol: "♐" },     { name: "Oğlak", symbol: "♑" }, // 270° - 300°
        { name: "Kova", symbol: "♒" },     { name: "Balık", symbol: "♓" }
    ];

    // Derece ne gelirse gelsin 0-360 arasına kusursuz çiviler, eksi değerleri korur aga:
    let normalized = (deg % 360 + 360) % 360;
    
    // Saf dürüst matematik: 30 dereceye bölerek hangi burç indeksinde olduğunu kendi bulur!
    let signIndex = Math.floor(normalized / 30);
    
    let signDeg = Math.floor(normalized % 30);
    let signMin = Math.floor((normalized % 1) * 60);

    const sign = ZODIAC_SIGNS[signIndex] || ZODIAC_SIGNS[0];
    return `${sign.symbol} ${signDeg}°${signMin < 10 ? '0' : ''}${signMin}' ${sign.name}`;
};

// 🧭 1. STATÜ FONKSİYONU (En başta olmalı ki alttaki event'ler çağırabilsin aga)
const wiccaStatuyuMuhurle = (room) => {
    // Oda 41-50 arası tam gece (Yin Derinlik / Midnight) evresidir!
    let isGece = (room >= 41 && room <= 50);
    
    // Kök elemente (body) durumu dikte ediyoruz, CSS katmanları salisesinde kilitliyor
    if (document.body) {
        document.body.setAttribute('data-wicca-phase', isGece ? 'YIN_NIGHT' : 'YANG_DAY');
    }
    
    // Mesh texture tetikleyicisi
    if (typeof window.selectMeshTexture === 'function') {
        window.selectMeshTexture(isGece ? 'MUNDI' : 'LISA');
    }
};


// =========================================================================
// 🎛️ GLOBAL SFX STATE SHIELD (FONKSİYONLARIN DIŞINDA DURMALI AGA!)
// =========================================================================
window.wiccaAudioCtx = window.wiccaAudioCtx || null;
window.wiccaOscillator = window.wiccaOscillator || null;
window.wiccaGainNode = window.wiccaGainNode || null;
window.isWiccaAudioPlaying = window.isWiccaAudioPlaying || false;


// 🚀 2. [AÇILIŞ TETİKLEYİCİSİ]: Tarayıcı DOM'u indirdiği an (downloaded) ilk iş statüye bakılır
document.addEventListener("DOMContentLoaded", () => {
    let openingRoom = 0;
    
    // safeActiveRoom için ReferenceError korumalı kalkan:
    if (typeof window.safeActiveRoom !== 'undefined') {
        openingRoom = window.safeActiveRoom;
    } else if (typeof safeActiveRoom !== 'undefined') {
        openingRoom = safeActiveRoom;
    }

    // İlk iş statüyü mühürle ki render motoru Mona'yı üste fırlatmasın
    wiccaStatuyuMuhurle(openingRoom);

    // Saat modunu mor neonla ateşle
    if (typeof window.setWiccaMode === 'function') {
        window.setWiccaMode('SAAT'); 
    }


 // =========================================================================
    // ⚙️ WICCA OS: AUDIO WEB-SYNTH FREKANS SÜRÜCÜSÜ (SANDBOX BYPASS - RE-FIXTURE)
    // =========================================================================
    const settingsBtn = document.getElementById('settings-btn') || document.querySelector('.deck-btn-settings');
    
    if (settingsBtn) {
        settingsBtn.addEventListener('click', async (e) => {
            e.stopPropagation(); // Kuantum çakışma önleyici kalkan

            try {
                // 🗃️ Yerel dosya (file:///) kilitlerini kırmak için AudioContext'i her durumda zorla ayağa kaldırıyoruz:
                if (!window.wiccaAudioCtx) {
                    window.wiccaAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                // 🚨 GÜVENLİK DUVARI EZİCİ: Tarayıcının 'file:///' protokolü üzerindeki donma inadını 
                // asenkron (async/await) bir şok dalgasıyla zorla ayağa kaldırıyoruz aga!
                if (window.wiccaAudioCtx.state === 'suspended') {
                    await window.wiccaAudioCtx.resume();
                }

                if (!window.isWiccaAudioPlaying) {
                    // 🔊 SESİ AÇMA OPERASYONU: Sinüs dalgası hoparlöre fırlatılıyor!
                    window.wiccaOscillator = window.wiccaAudioCtx.createOscillator();
                    window.wiccaGainNode = window.wiccaAudioCtx.createGain();

                    // Sirkadiyen odaya göre kutsal Metatron frekansını tayin ediyoruz aga:
                    let currentRoomSafe = typeof sunRoom64 !== 'undefined' ? sunRoom64 : 48;
                    let targetFrequency = 112.3; // Gece/Lilith modu için asil alt rezonans (Delta/Theta)

                    if (currentRoomSafe >= 16 && currentRoomSafe < 32) {
                        targetFrequency = 224.6; // Gündüz/Yang modu için yüksek frekans dalgası
                    }

                    window.wiccaOscillator.type = 'sine'; // Senin o meşhur, çarpışmayan pürüzsüz sinüs dalgan aga!
                    window.wiccaOscillator.frequency.setValueAtTime(targetFrequency, window.wiccaAudioCtx.currentTime);

                    // Kulakları yormayacak ipeksi bir siberpunk uğultu hacmi (%6 CPU/GPU dostu):
                    window.wiccaGainNode.gain.setValueAtTime(0.05, window.wiccaAudioCtx.currentTime);

                    // Çarkları birbirine kelepçeleyip fırlatıyoruz:
                    window.wiccaOscillator.connect(window.wiccaGainNode);
                    window.wiccaGainNode.connect(window.wiccaAudioCtx.destination);

                    window.wiccaOscillator.start(0);
                    window.isWiccaAudioPlaying = true;
                    settingsBtn.classList.add('active-glow-mode');
                    console.log(`Wicca OS: Frekans kalkanı aktif -> ${targetFrequency} Hz Sinüs Eğrisi.`);
                } else {
                    // 🔇 SESİ KAPATMA OPERASYONU: Şalteri indiriyoruz aga!
                    if (window.wiccaOscillator) {
                        try {
                            window.wiccaOscillator.stop(0);
                            window.wiccaOscillator.disconnect();
                        } catch(e) {}
                        window.wiccaOscillator = null;
                    }
                    window.isWiccaAudioPlaying = false;
                    settingsBtn.classList.remove('active-glow-mode');
                    console.log("Wicca OS: Frekans kalkanı deaktif, sükunet modu.");
                }
            } catch (audioErr) {
                console.log(`Ses Motoru Kalkanı Hatayı Eritti: ${audioErr.message}`);
            }
        });
    }
});

// 🧭 WICCA OS: GERÇEK ZAMANLI MOBİL PUSULA SENSÖR SÜRÜCÜSÜ (MÜHÜRLÜ)
// =========================================================================
let currentCompassHeading = 0;
window.wiccaCompassOffset = 0; // 🎯 Kalibrasyon için sanal ofset kilidi aga!

function activateWiccaPhysicalCompass() {
    if (window.DeviceOrientationEvent) {
        // iOS (Safari) için kritik güvenlik ve izin kapısı kilidi
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        window.removeEventListener('deviceorientation', handleCompassMove, true);
                        window.addEventListener('deviceorientation', handleCompassMove, true);
                        console.log("Wicca OS: iOS Manyetometre İzni Alındı [SYNCED]");
                    }
                })
                .catch(console.error);
        } else {
            // Android ve diğer tarayıcılar direkt sıfır lag bağlanır
            window.removeEventListener('deviceorientation', handleCompassMove, true);
            window.addEventListener('deviceorientation', handleCompassMove, true);
            console.log("Wicca OS: Android Manyetometre Bağlantısı Aktif [ZERO-LAG]");
        }
    } else {
        console.log("Aga bu cihazda manyetometre (pusula sensörü) bulunamadı.");
    }
}

// Telefon havada döndükçe salisesinde tetiklenen o tek parça, temiz hesaplama çarkı aga:
function handleCompassMove(event) {
    let heading = 0;
    
    // iOS için saf Kuzey açısı (webkitCompassHeading) yoksa Android alpha bükümü:
    if (event.webkitCompassHeading) {
        heading = event.webkitCompassHeading;
    } else if (event.alpha !== null) {
        heading = 360 - event.alpha;
    } else {
        return;
    }

    // 🎯 KALİBRASYON BÜKÜMÜ: Gelen ham açıdan basılan ofseti çıkartarak pusulayı anında sıfırlıyoruz!
    let finalHeading = (heading - window.wiccaCompassOffset + 360) % 360;
    currentCompassHeading = Math.round(finalHeading);

    // 8 Kapının içinde yaşadığı o ana .cosmic-compass div'ini jilet gibi dünyada sabit tutuyoruz aga:
    const cosmicCompassDiv = document.querySelector('.cosmic-compass');
    if (cosmicCompassDiv) {
        cosmicCompassDiv.style.transform = `rotate(${-currentCompassHeading}deg)`;
        cosmicCompassDiv.style.transition = "transform 0.1s linear"; // Lag sıfırlayıcı ipeksi akış
    }
}
