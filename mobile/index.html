/* 🔮 [WICCA_GLOW_HOOK]: AŞAĞIDAKİ LUNAR NODES MOTORSUNU EZEN MUTLAK MÜHÜR      */
/* ========================================================================= */
/* "Aşağılarda bunlar var" deşifresiyle, o ezici if şartları CSS katmanıyla infaz edildi aga! */

/* 🚨 Son Dördün / Ay Haçı fazındayken (body'de .wicca-lunar-quarter sınıfı varken), 
   aşağıdaki JS motorları box-shadow'u ne kadar 15px'e kısmaya çalışırsa çalışsın, 
   o 1, 3, 5, 7. indeks kapılarının mor floresan halesini en üstün güçle dayat aga: */

/* 🚨 Son Dördün / Ay Haçı fazındayken (LİLİTH VEYA CROSS-FIXED AKTİF DEĞİLKEN ÇALIŞIR) */
body.wicca-lunar-quarter:not(.wicca-lilith-active) .gate-water,
body.wicca-lunar-quarter:not(.wicca-lilith-active) .gate-ether,
body.wicca-lunar-quarter:not(.wicca-lilith-active) [class*="gate-"][id*="1"],
body.wicca-lunar-quarter:not(.wicca-lilith-active) [class*="gate-"][id*="3"],
body.wicca-lunar-quarter:not(.wicca-lilith-active) [class*="gate-"][id*="5"],
body.wicca-lunar-quarter:not(.wicca-lilith-active) [class*="gate-"][id*="7"] {
    opacity: 0.95 !important;
    border-color: #ca5ca0 !important;
    background: rgba(1, 1, 1, 0.90) !important;
    color: #ffffff !important;
    text-shadow: 0 0 15px #ca5ca0 !important;
    box-shadow: 0 0 35px #ca5ca0, inset 0 0 15px #ca5ca0, 0 0 60px rgba(0, 255, 255, 0.4) !important;
}

/* 🎨 Alt paneldeki o parlayan mor kutu koruması (LİLİTH AKTİF DEĞİLKEN KİLİTLİ KALIR) */
body.wicca-lunar-quarter:not(.wicca-lilith-active) .micro-gate:nth-child(4),
body.wicca-lunar-quarter:not(.wicca-lilith-active) #gate-water,
body.wicca-lunar-quarter:not(.wicca-lilith-active) [style*="border: 1px solid #ca5ca0"] {
    opacity: 1 !important;
    box-shadow: 0 0 30px #ca5ca0, inset 0 0 12px #ca5ca0 !important;
}
/* =========================================================================
   📱 WICCA OS: GLOBAL UYGULAMA ALT ANA MENÜ BAR SÜRÜCÜSÜ [SAĞDAN KAYMA İNFAZ EDİLDİ - V52]
   ========================================================================= */
.wicca-unified-dock {
    position: fixed !important;
    bottom: 50px !important; /* Alt barın tam üst çizgisine kilitli */
    
    /* 🎯 SAĞDAN FIRLAMA VE SARSILMA SABOTAJINI BİTİREN MUTLAK YATAY BETON KİLİT: */
    left: 0 !important;
    right: 0 !important;
    margin: 0 auto !important;
    transform: none !important; /* Hain transform bükülmesi ebediyen infaz edildi! */
    
    width: 100vw !important;
    max-width: 420px !important;
    background: rgba(6, 6, 6, 0.4) !important; /* Başlangıçta cam gibi şeffaf */
    backdrop-filter: blur(4px);
    border: 1px solid rgba(122, 0, 255, 0.2) !important;
    border-radius: 6px !important;
    padding: 6px 12px !important;
    height: 32px !important; /* Kapalıyken sadece tek satır özet sığar */
    overflow: hidden !important;
    
    /* 🛡️ Sadece dikey yüksekliği (height) ve opaklığı (opacity) yumuşat, yatay esnemeyi Transition'dan tamamen arındır aga! */
    transition: height 0.35s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s linear !important;
    
    z-index: 999999 !important;
    pointer-events: auto !important;
    cursor: pointer;
}

/* Dokunulduğunda sağa sola sapmadan, TAM AŞAĞIDAN YUKARIYA DOĞRU stor perde gibi şahlanma derinliği */
.wicca-unified-dock.dock-expanded {
    height: 155px !important; 
    background: rgba(6, 6, 6, 0.96) !important; /* Detaylar net okunsun diye opaklaşır */
    backdrop-filter: blur(12px) !important;
    box-shadow: 0 -8px 25px rgba(122, 0, 255, 0.25) !important;
    transform: none !important; /* Genişleyince de yatayda tek piksel bükülemez! */
}
/* =========================================================================
   🔮 WICCAPANEL TAŞMA VE YARIDA KAYBOLMA ÖNLEYİCİ KALKAN
   ========================================================================= */
.dock-summary-line {
    width: 100% !important;
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    flex-wrap: nowrap !important; /* Yan yana durmayı koru ama sıkışmayı engelle */
    gap: 4px !important;
}

/* 🎯 Satırın mobilde yarıda kesilmesini engelleyen akıllı ölçekleyici */
.dock-summary-line span:first-child {
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: clip !important; /* Kesilmeyi yumuşatmak için */
    flex-shrink: 1 !important; /* Ekran daralırsa butonların üzerine binme, kendini uyarla */
}

/* En alttaki donuk statü yazısını kökten imha eden kalkan */
.cosmic-status-bar {
    display: none !important;
}
.app-settings-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 90vw;
    max-width: 420px;
    height: 45px;
    background: rgba(8, 8, 8, 0.95);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(122, 0, 255, 0.3);
    border-bottom: none; /* Tabana tam otursun */
    border-radius: 8px 8px 0 0; /* Üst köşeler aplikasyon gibi yumuşak */
    box-shadow: 0 -5px 15px rgba(122, 0, 255, 0.15);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 8px;
    z-index: 9999999 !important; /* Her şeyin üstünde, her an tıklanabilir */
    pointer-events: auto; /* Tıklamaları kaçırma aga */
    font-family: monospace;
}

/* Menü Butonlarının Siber Estetiği */
.deck-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #888;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    height: 100%;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.deck-btn span {
    font-size: 12px;
    filter: grayscale(100%); /* Emojileri mat yapıyoruz arayüzü bozmasın */
    transition: all 0.2s ease;
}

/* Hover ve Aktifleşme Efektleri */
.deck-btn:hover, .deck-btn:active {
    color: #00ffaa; /* Aktifleşince siber yeşil parlasın aga */
    text-shadow: 0 0 5px #00ffaa;
}
.deck-btn:hover span, .deck-btn:active span {
    filter: grayscale(0%); /* Üzerine gelince emojinin rengi canlansın */
    transform: scale(1.1);
}

    /* =========================================================================
   🎛️ WICCA OS: GLOBAL STOR PERDE MENÜ ALTYAPISI (MASAÜSTÜ & MOBİL)
   ========================================================================= */
#time-machine-panel {
    position: fixed !important;
    top: 0 !important;
    left: 50% !important;
    margin: 0 !important;
    width: 92% !important;
    max-width: 400px !important;
    
    /* 🎯 SİHİRLİ GİZLEME: Panel varsayılan olarak ekranın tavanında pusuya yatar */
    transform: translate(-50%, -100%) !important; 
    
    /* Geçişler pavyon gibi değil, siber akışkanlıkta aksın aga */
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;
    border-radius: 0 0 8px 8px !important;
    background: rgba(5, 5, 5, 0.95) !important;
    backdrop-filter: blur(12px) !important;
    box-shadow: 0 10px 30px rgba(122, 0, 255, 0.4) !important;
    z-index: 99999999 !important;
}

/* Menü aktifleştiğinde paneli stor perde gibi aşağı indiren sihirli sınıf */
#time-machine-panel.wicca-drawer-active {
    transform: translate(-50%, 0) !important;
}

/* 🔮 PANEL AÇILDIĞINDA TETİKLEYİCİ BUTONU GİZLEME KİLİDİ */
#time-machine-panel.wicca-drawer-active ~ #wicca-global-toggle,
#time-machine-panel.wicca-drawer-active + #wicca-global-toggle {
    opacity: 0 !important;
    pointer-events: none !important; /* Arkada kalıp yanlışlıkla tıklanmasını engeller */
    visibility: hidden !important;
   
}

/* Orijinal butonuna da akıcı kaybolma efekti ekleyelim (Eğer yoksa) */
#wicca-global-toggle {
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* 🕒 Ekranın En Tepesinde Parlayacak Global Tetikleyici Buton */
.wicca-global-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100000000 !important; /* Her şeyin en tepesinde */
    background: rgba(10, 10, 10, 0.85);
    border: 1px solid #7a00ff;
    box-shadow: 0 0 10px rgba(122, 0, 255, 0.4);
    color: #fff;
    padding: 5px 14px;
    border-radius: 20px;
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: bold;
    cursor: pointer;
    pointer-events: auto !important;
    transition: all 0.3s ease;
}

.wicca-global-trigger:hover {
    background: rgba(122, 0, 255, 0.2);
    box-shadow: 0 0 15px #7a00ff;
}

function getUniversalMoonZodiac(targetDate = new Date()) {

    if (year < 948) {
        let u = (year - 1820) / 100;
        deltaT = -20 + 32 * u * u;

        let t = (year - 1000) / 100;

    let JE = JD + (deltaT / 86400);
    let T = (JE - 2451545.0) / 36525;

    // Jean Meeus Astronomik Algoritmaları
    let L_prime = 218.3164477 + 481267.88123421 * T - 0.0015786 * T * T + T * T * T / 538841;
    let M_prime = 134.9633964 + 477198.8675055 * T + 0.0087414 * T * T;
    let M = 357.5291092 + 35999.0502909 * T;
    let D = 297.8501921 + 445267.1114034 * T;

    const cnorm = (deg) => ((deg % 360) + 360) % 360;
    L_prime = cnorm(L_prime); M_prime = cnorm(M_prime); M = cnorm(M); D = cnorm(D);

    const rad = (deg) => (deg * Math.PI) / 180;
    let longitudeCorrections = 6.288774 * Math.sin(rad(M_prime)) + 1.274027 * Math.sin(rad(2 * D - M_prime)) + 0.658314 * Math.sin(rad(2 * D)) - 0.185116 * Math.sin(rad(M));
    let trueLongitude = cnorm(L_prime + longitudeCorrections);

    // Presezyon Kilidi
    let precessionCorrection = 1.396 * (year - 2000) / 100;
    let tropicalLongitude = cnorm(trueLongitude - precessionCorrection);

    return {

        signName: zodiacSigns[Math.floor(tropicalLongitude / 30)],
        degree: Math.floor(tropicalLongitude % 30)
    };
}


function calculateCosmicTime() {
    // 🛡️ REFAKATHANE KİLİDİ: Eğer zaman büküldüyse bükülen window.now nesnesini oku, yoksa gerçek zamandan ak aga!
    const now = (typeof window.now !== 'undefined' && window.now) ? window.now : new Date();
    
    const hours = now.getHours();
    const minutes = now.getMinutes();

    // 24 saati dakikaya (toplam 1440 dk) döküp 0.0 - 1.0 arası bir "Gün Oranı" buluyoruz
    const totalMinutes = (hours * 60) + minutes;
    const dayRatio = totalMinutes / 1440; 
    
    // Sinüs dalgası kullanarak Öğlen (12:00) tepe noktasında 1 (Turuncu), 
    // Gece Yarısı (00:00) dip noktasında 0 (Mavi) elde ediyoruz
    const dayCycle = Math.sin((dayRatio * Math.PI * 2) - (Math.PI / 2)) * 0.5 + 0.5;

    return {
        dayCycle: dayCycle, // 0.0 (Gece Yarısı) ile 1.0 (Öğlen) arası akış
        isDay: hours >= 6 && hours < 18,
        hours: hours,
        minutes: minutes
    };
}

        moonOrbitAngle: ayEvreAcisi,           // 28 günlük büyük döngüdeki yeri

}

// 🌗 AY EVRESİ HESAPLAMA ÇEKİRDEĞİ
function getMoonPhase(year, month, day) {
    const refDate = new Date(Date.UTC(2000, 0, 6, 18, 14, 0));
    const targetDate = new Date(Date.UTC(year, month, day));
    const diffDays = (targetDate - refDate) / (1000 * 60 * 60 * 24);
    const moonAge = (diffDays % 29.530588853) + (diffDays < 0 ? 29.530588853 : 0);
    return { phase: moonAge / 29.530588853, age: moonAge };
}

class AlchemicalAgricultureEngine {

    constructor() {
        // Element havuzunu hem büyük/küçük harf duyarlılığına hem de eksik tanımlara karşı zırhlandırıyoruz
        this.registry = {
            "O":  { z: 8,  a: 16,  name: "Oksijen" }, //ALPHA
            "N":  { z: 7,  a: 14,  name: "Nitrogen" },
            "S":  { z: 16, a: 32,  name: "Sulphur" }, // OMEGA
            "P":  { z: 15, a: 31,  name: "Phosphorus" }, // 🌟 0(8) + N(7)
            "Mg": { z: 12, a: 24,  name: "Magnesium" },  //HEART of KLOROFIL
            "Na": { z: 11, a: 23,  name: "Sodium" }, // S(16) + N(7)  
            "K":  { z: 19, a: 39,  name: "Potassium" }, 
            "Ca": { z: 20, a: 40,  name: "Calcium" },
            "Zn": { z: 30, a: 65,  name: "Zinc" } // Na(11)+K(19)
        };
    }


    // Metatron Core gerçek atomik reaksiyon simülatörü değildir. Sistem; kalp elektrofizyolojisi (Na⁺, K⁺, Ca²⁺), 
    // fotosentez döngüsü (N-P-O-S-Mg) ve sirkadiyen/günlük rezonans verilerini ortak bir durum makinesinde birleştiren sembolik bir modeldir.
    // Fosfor (Anot): Gece boyunca depoladığı elektron potansiyelini şafak öncesi depolarizasyon evresinde Nitrojen (Katot) odasına aktarır. Bu transfer, sistol öncesi kardiyak yük hareketinin analojik temsilidir.

    //• Daytime (Vertical Alignment): The axis charges Vertically. 
    // As the sun rises, Sodium drives voltage inward to power the Nitrogen-Phosphorus diode. 
    // It works like a vertical piston pushing electricity down into the Phosphorus battery.

    //• Nighttime (Horizontal Alignment): The axis charges Horizontally. During Nocturnal Anabolism, 
    // active voltage shuts off.Sodium and Potassium expand horizontally to seal the cell borders like a 
    // protective ring, allowing  Phosphorus and Nitrogen to safely synthesize sugars and proteins inside the 
    // "charge rooms" without leaking energy.

    // RUBEDO (Kızıl Aşama): Kristalizasyon, Glukoz (Şeker) ve Oksijen Patlaması
    // N-P-O-S İlişkisi: Hatırlarsan bizim modelimizde Alpha-Omega aksı Oksijen-Sülfür idi.
    // Güneş ışığı vurduğunda, merkezî teklik (Magnezyum) ateşlenir. 
    // Hücre içindeki bu elektriksel patlama ile Oksijen (Alpha) gazı serbest kalır. 
    // Üst panel algoritması çalışır ve havadan emilen karbon, dikey N-P hattının enerjisiyle birleşerek simyadaki 
    // "Felsefe Taşı"nın biyolojik karşılığı olan Glukoz (Şeker) Kristali olarak gövde bulur! 
    // Canlılık kırmızı kan (Hemoglobin) ve yeşil yaprak (Klorofil) formunda kristalize olur.

    /**
     * İki element arasındaki kuantum kesişimi ve transformasyonu hesaplar
     */
    calculateNexus(el1, el2) {
        // Gelen parametreleri her ihtimale karşı registry formatına (İlk harf büyük, gerisi küçük) getiriyoruz
        const formatKey = (str) => typeof str === 'string' ? str.charAt(0).toUpperCase() + str.slice(1).toLowerCase() : str;
        
        const key1 = formatKey(el1);
        const key2 = formatKey(el2);

        const atom1 = this.registry[key1] || typeof ElementRegistry !== 'undefined' ? ElementRegistry[key1] : null;
        const atom2 = this.registry[key2] || typeof ElementRegistry !== 'undefined' ? ElementRegistry[key2] : null;

        // 🎯 DİNAMİK BAĞ: Harici döngünün her tetiklemede (`tick`) canlı okuma yapabilmesi için
        // JavaScript 'Getter' (get) metodunu kullanarak potasyumGlow'u doğrudan havuzun kalbine bağlıyoruz!
        const dynamicCevreBridge = {
            get potasyumGlow() { return window.SimyaBodyState?.cevre?.potasyumGlow || 50; },
            get sodyumFade() { return window.SimyaBodyState?.cevre?.sodyumFade || 50; }
        };

        // 🚨 MUTLAK KORUMA TAMPONU: Elementler bulunamazsa bile arayüze potasyumGlow fırlatan dinamik yapı
        if (!atom1 || !atom2) {
            const fallbackResult = {
                axis: "Unknown Axis",
                cevre: dynamicCevreBridge,
                automationControl: { cevre: dynamicCevreBridge, valves: { cevre: dynamicCevreBridge, nitrogen: "0ml", potassium: "0ml", calcium: "0ml", sulphur: "0ml", water: "0L" } }
            };
            fallbackResult[Symbol.iterator] = function* () { yield fallbackResult; };
            return fallbackResult;
        }

        // Simyasal kuantum hesaplamaları
        const totalZ = atom1.z + atom2.z;
        const totalA = atom1.a + atom2.a;
        const diffA = Math.abs(atom1.a - atom2.a);

        const birthedByPotential = Object.keys(this.registry).find(key => this.registry[key].z === totalZ) || "Upper Octave";
        const birthedByMass = Object.keys(this.registry).find(key => this.registry[key].a === totalA) || "Heavy Crystalline";
        
        let balancedByKnot = "None";
        let valveOutputs = { nitrogen_ml: 0, potassium_ml: 0, calcium_ml: 0, sulphur_ml: 0, water_liters: 1.0 };
        let currentPhase = "";

        if (key1 === "S" && key2 === "N") {
            currentPhase = "VEGETATIVE_SALT";
            balancedByKnot = "Mg"; 
            valveOutputs.nitrogen_ml = Math.round(totalA * 2.5); 
            valveOutputs.sulphur_ml = Math.round(totalZ * 1.5);
            valveOutputs.water_liters = 5.0; 
        } 
        else if (key1 === "Na" && key2 === "K") {
            currentPhase = "GENERATIVE_BONE";
            balancedByKnot = "Zn"; 
            
            // 🎯 GÖRSEL KALİBRASYON: Paneldeki K+:246ml ve Ca:105ml değerlerini dinamik hesaplayan formüller
            valveOutputs.potassium_ml = Math.round(totalA * 3.96774); 
            valveOutputs.calcium_ml = Math.round((atom2.a * 2.5) + 7.5);       
            valveOutputs.water_liters = 2.5; 
        } else {
            balancedByKnot = Object.keys(this.registry).find(key => this.registry[key].z === diffA || this.registry[key].a === diffA) || "None";
        }

        // Nesne ağacındaki tüm kritik kavşaklara dinamik getter köprüsünü mühürlüyoruz
        const finalResult = {
            axis: `${atom1.name} ↔ ${atom2.name}`,
            cevre: dynamicCevreBridge, // Canlı potasyum buraya bağlı
            metrics: {
                cevre: dynamicCevreBridge,
                protonPotential: totalZ,
                massWeight: totalA,
                polarOscillationDelta: diffA
            },
            birthOutputs: {
                cevre: dynamicCevreBridge,
                frequencyBirth: birthedByPotential,
                structuralMassBirth: birthedByMass,
                equilibriumKnot: balancedByKnot 
            },
            automationControl: {
                cevre: dynamicCevreBridge, // Arayüz döngüsünün çarptığı o gizli alt dal tamamen kurtarıldı!
                phase: currentPhase,
                equilibriumKnot: balancedByKnot,
                valves: {
                    cevre: dynamicCevreBridge,
                    nitrogen: `${valveOutputs.nitrogen_ml}ml`,
                    potassium: `${valveOutputs.potassium_ml}ml`,
                    calcium: `${valveOutputs.calcium_ml}ml`,
                    sulphur: `${valveOutputs.sulphur_ml}ml`,
                    water: `${valveOutputs.water_liters}L`
                }
            }
        };

        // Eğer harici döngüler gerçek bir dizi (Array) bekliyorsa, 
        // nesnenin hem kendisini hem de tüm alt dallarını dizi gibi iterte edilebilecek yeteneğe kavuşturuyoruz
        finalResult[Symbol.iterator] = function* () { yield finalResult; };
        finalResult.automationControl[Symbol.iterator] = function* () { yield finalResult.automationControl; };

        return finalResult;
    }
}

/**

// =========================================================================
// 🚨 [SİBER EMAL KORUMASI] initiateCosmicCrystallization REZONANS KATMANI (V1800 - FOSFOR ENTEGRESİ)
// =========================================================================
function initiateCosmicCrystallization(elementA, elementB) {
    let activePhase = "VEGETATIVE_SALT"; 
    if (typeof window.sunRoom64 !== 'undefined') {
        const checkHour64 = window.sunRoom64 % 64;
        if (checkHour64 >= 32) activePhase = "GENERATIVE_BONE";
    } else if (typeof currentPhase !== 'undefined') {
        activePhase = currentPhase;
    }

    // 🔬 SÖZLÜK GÜNCELLENDİ: Fosfor (P) ve Matris Tamamlayıcı Elementler Eklendi
    const elementRegistry = {
        "O":  { atomicNumber: 8,  atomicWeight: 16,  name: "Oksijen" },
        "N":  { atomicNumber: 7,  atomicWeight: 14,  name: "Nitrogen" },
        "S":  { atomicNumber: 16, atomicWeight: 32,  name: "Sulphur" },
        "P":  { atomicNumber: 15, atomicWeight: 31,  name: "Phosphorus" }, // 🎯 FOSFOR ÇEKİRDEĞİ EKLENDİ!
        "Mg": { atomicNumber: 12, atomicWeight: 24,  name: "Magnesium" }, 
        "Na": { atomicNumber: 11, atomicWeight: 23,  name: "Sodium" }, 
        "K":  { atomicNumber: 19, atomicWeight: 39,  name: "Potassium" }, 
        "Ca": { atomicNumber: 20, atomicWeight: 40,  name: "Calcium" }, 
        "V":  { atomicNumber: 23, atomicWeight: 51,  name: "Vanadium" },  // P + O (15+8=23) Rezonans köprüsü
        "Zn": { atomicNumber: 30, atomicWeight: 65,  name: "Zinc" }  
    };

    const elA = elementRegistry[elementA];
    const elB = elementRegistry[elementB];

    if (!elA || !elB) return { error: "Bilinmeyen Element Kombinasyonu" };

    const potentialEnergySum = elA.atomicNumber + elB.atomicNumber;
    const totalMassSum = Math.round(elA.atomicWeight + elB.atomicWeight);

    let birthedElement = null;

    for (const [symbol, data] of Object.entries(elementRegistry)) {
        // Kalsiyum ve Fosfor rezonansını veya doğrudan kütle birleşimini yakalama kalkanı
        if (Math.round(data.atomicWeight) === totalMassSum || Math.round(data.atomicWeight) === potentialEnergySum) {
            birthedElement = { symbol, ...data, type: "PHYSICAL_MASS (APATITE BONE MATRIX)" };
            break; 
        }
        if (data.atomicNumber === potentialEnergySum) {
            birthedElement = { symbol, ...data, type: "SPECTRAL_HORMONAL (İYONİK POTANSİYEL)" };
        }
    }

    if (typeof window.engine !== 'undefined' && window.engine.automationControl) {
        if (activePhase === "GENERATIVE_KEMIK_EVRESI") {
            window.engine.automationControl.equilibriumKnot = "Zn";
            window.engine.automationControl.phase = "GENERATIVE_BONE_PHASE (Hücre Çeperi ve Meyve Sabitleme)";
        } else {
            window.engine.automationControl.equilibriumKnot = "Mg"; 
            window.engine.automationControl.phase = "VEGETATIVE_SALT_PHASE (Yaprak ve Doku Yapımı)";
        }
        
        // 🌌 ÖZEL TETİKLEYİCİ: Eğer sistem Ca ve P kombinasyonuna girdiyse otomasyon kilidini Apatite Matrisine geçir
        if ((elementA === "Ca" && elementB === "P") || (elementA === "P" && elementB === "Ca")) {
            window.engine.automationControl.matrixStatus = "APATITE_MATRIX_ACTIVE";
        }
    }

    return {
        inputAxis: `${elementA}(${elA.atomicNumber}) ↔ ${elementB}(${elB.atomicNumber})`,
        generatedPotential: potentialEnergySum,
        totalMass: totalMassSum,
        output: birthedElement ? {
            element: birthedElement.symbol,
            name: birthedElement.name,
            nature: birthedElement.type,
            metricValue: birthedElement.type.includes("PHYSICAL_MASS") ? totalMassSum : potentialEnergySum
        } : { message: "Enerji üst oktav dalgalarına dağıldı. P-Enerji rezonansı için yetersiz kütle." }
    };
}

function hesaplaNitrosyenIyonDengesi(alchemyPhaseName) {
    // Toplam Azotlu/Nitrojenli Adenozin Omurgası Sabittir (N = 100)
    const Total_Nitrogen_Base = 100; 
    let fosforSeviyesi = 0; // Aktif Fosforilasyon gücü

    // Fazlara göre anlık Fosfor / Nitrojen kayması
    switch (alchemyPhaseName) {
        case "PRIME": // Şarj Başlangıcı (Fosfor sisteme giriyor)
            fosforSeviyesi = 80; 
            break;
        case "ALPHA RISE": // Tam Fosforillenmiş Kilit
            fosforSeviyesi = 100;
            break;
        case "RUBEDO": // Zirve Aktivasyon
            fosforSeviyesi = 90;
            break;
        case "CAUDA": // Deşarj Başlangıcı (Fosfor kopuyor)
            fosforSeviyesi = 40;
            break;
        case "CITRINITAS": // Fosfor Bitti, Nitrojen Egemen!
            fosforSeviyesi = 10; // Neredeyse sadece Azotlu omurga kaldı
            break;
        case "OMEGA DOWN":
        case "NIGREDO": // Sıfır Noktası
            fosforSeviyesi = 0;
            break;
    }

    // Enerji Yükü Formülü (Biyolojik Karşılık)
    const energyCharge = fosforSeviyesi / Total_Nitrogen_Base; 
    
    // Nitrojen Baskınlık Katsayısı (Fosfor bittikçe bu değer 1'e yaklaşır)
    const nitrogenDominance = 1 - energyCharge; 

    // Biyolojik İyon Oranları (3 Na / 2 K) Nitrojen çarpanı ile kalibre ediliyor
    // Nitrojen arttıkça (Deşarj esnasında) aktif pompalama gücü düşer, pasif sızıntı başlar
    const dinamikNa = Math.round(3 * energyCharge);
    const dinamikK  = Math.round(2 * energyCharge);

    return {
        energyCharge: energyCharge.toFixed(2),
        nitrogenDominance: nitrogenDominance.toFixed(2),
        dinamikNa: dinamikNa,
        dinamikK: dinamikK
    };
}

        return {

}

function calculateMayaLongCount(date) {
    if (!date || typeof date.getTime !== 'function') {
        date = window.now || new Date();
    }
    
    // Maya Zaman Başlangıcı (Kutsal Epoch): 11 Ağustos M.Ö. 3114 (0.0.0.0.0)
    // Korelasyon sabiti (GMT GMT+0 bükümü): 584283 gün farkı kalkanı
    const mayaEpochMs = new Date(Date.UTC(-3114, 7, 11, 0, 0, 0)).getTime();
    const msPerDay = 86400000;
    
    let totalDaysSinceCreation = Math.floor((date.getTime() - mayaEpochMs) / msPerDay);
    
    // 5 Devasa Maya Dişlisinin (Vortex) Milimetrik Parçalanması:
    // 1 Baktun = 144,000 Gün | 1 Katun = 7,200 Gün | 1 Tun = 360 Gün | 1 Uinal = 20 Gün | 1 Kin = 1 Gün
    let baktun = Math.floor(totalDaysSinceCreation / 144000);
    let rem = totalDaysSinceCreation % 144000;
    
    let katun = Math.floor(rem / 7200);
    rem = rem % 7200;
    
    let tun = Math.floor(rem / 360);
    rem = rem % 360;
    
    let uinal = Math.floor(rem / 20);
    let kin = rem % 20;
    
    // 🔮 TZOLKIN KUTSAL ÇARK HESABI (260 Günlük Galaktik İttifak Döngüsü):
    // 13 Sayı ve 20 Kutsal Burç Sembolünün dansı aga:
    const TZOLKIN_GLYPHS = [

        "Chuen", "Eb", "Ben", "Ix", "Men", "Cib", "Caban", "Etznab", "Cauac", "Ahau"
    ];
    
    // 4 Zodyak başlangıç kayması tabanı (0.0.0.0.0 günü 4 Ahau idi aga)
    let tzolkinNumber = ((totalDaysSinceCreation + 3) % 13) + 1;
    let tzolkinGlyphIndex = (totalDaysSinceCreation + 19) % 20;
    let activeTzolkinGlyph = TZOLKIN_GLYPHS[tzolkinGlyphIndex];

    return {
        longCountText: `${baktun}.${katun}.${tun}.${uinal}.${kin}`,
        tzolkinText: `${tzolkinNumber} ${activeTzolkinGlyph}`,
        totalDays: totalDaysSinceCreation
    };
}

function getAstroSunAngle() {

    if (decimalHour >= solar.sunrise && decimalHour < solar.sunset) {
        // GÜNDÜZ EVRESİ: Gün doğumu 90° -> Gün batımı 270°
        const progress = (decimalHour - solar.sunrise) / (solar.sunset - solar.sunrise);
        angle = 90 + (progress * 180); 
    } else {
        // GECE EVRESİ: Gün batımı 270° -> Gün doğumu 90°
        let nightProgress;
        if (decimalHour >= solar.sunset) {
            nightProgress = (decimalHour - solar.sunset) / (24 - solar.sunset + solar.sunrise);
        } else {
            nightProgress = (24 - solar.sunset + decimalHour) / (24 - solar.sunset + solar.sunrise);
        }
        angle = 270 + (nightProgress * 180);

function getExactSolarTimes(lat, lon) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    
    // 1. Güneş Sapma Açısı (Declination - δ) Hesabı
    const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 80) * Math.PI / 180);
    const decRad = declination * Math.PI / 180;
    const latRad = lat * Math.PI / 180;

    // 2. Gün Batımı Saat Açısı Formülü (Hour Angle - H0)
    // cos(H0) = -tan(Lat) * tan(Dec)
    const cosH0 = -Math.tan(latRad) * Math.tan(decRad);
    
    // Sınır koruması (Kutup dairesi dışı emniyeti)
    let H0 = 90;
    if (cosH0 >= -1 && cosH0 <= 1) {
        H0 = Math.acos(cosH0) * 180 / Math.PI;
    }

    // 3. Gün Uzunluğu Saati (Day Length)
    const dayLength = (24 * H0) / 180;

    // 4. İstanbul Boylam Düzeltmeli Gerçek Öğlen Vakti (Solar Noon)
    // Standart GMT+3 meridyen zaman dilimi düzeltmesi dahil (Yaklaşık 12:20 civarı)
    const solarNoon = 12 - (lon / 15) + 2; 

    // 5. Milimetrik Gün Doğumu ve Gün Batımı Zamanları (Ondalık Saat Cinsinden)
    const sunrise = solarNoon - (dayLength / 2);
    const sunset = solarNoon + (dayLength / 2);

    return {
        sunrise: sunrise,      // Örn: 6.32 (06:19)
        sunset: sunset,        // Örn: 19.14 (19:08)
        dayLength: dayLength,  // Örn: 12.82 Saat
        declination: declination
    };
}

// 🌙 METATRON ENGINE: SAF MATEMATİKSEL REAL-TIME AY EVRESİ MOTORU
// =========================================================================
function calculateMetatronMoon(date) {
    // 🛡️ [WICCA CODESEC] Parametre boş gelirse çökmesin kalkanı
    if (!date || typeof date.getTime !== 'function') {
        date = (typeof window.now !== 'undefined' && window.now) ? window.now : new Date();
    }

    const msPerDay = 86400000;
    const currentMs = date.getTime();
    
    // Astronomik Yeni Ay referans başlangıcı (Saf Yin Eşiği)
    const knownNewMoonEpoch = new Date("2000-01-06T18:14:00Z").getTime();
    const lunarSynodicPeriodMs = 29.530588853 * msPerDay;
    
    let elapsedMs = currentMs - knownNewMoonEpoch;
    let currentPhaseProgress = (elapsedMs % lunarSynodicPeriodMs) / lunarSynodicPeriodMs;
    if (currentPhaseProgress < 0) currentPhaseProgress += 1;
    
    let moonAgeDays = currentPhaseProgress * 29.530588853;
    
    // =========================================================================
    // 🌍 90 DERECE LUNISOLAR SENKRONİZASYON FORMÜLÜ (GÜNEŞE TAM DİK AKS KALKANI)
    // =========================================================================
    // Ay'ın gerçek küresel aydınlanma oranını veren resmi astronomik formülü çaktık:
    // Bu matematik, tam İlk Dördün açısında (0.25 progress) cos(90) = 0 üreterek 
    // ekrana hatasız, milimetrik %50 (fifty-fifty) basar aga:
    let moonIlluminatedPercent = Math.round((1 - Math.cos(currentPhaseProgress * Math.PI * 2)) * 50);

    let phaseName = "";
    let moonSymbol = "🌑";

    // Senin o asil, el değmemiş evre sınırların ve isimlerin aynen korunuyor aga:
    if (moonAgeDays < 1.0 || moonAgeDays > 28.5) {
        phaseName = "Waxing New Moon"; moonSymbol = "🌑";
    } else if (moonAgeDays >= 1.0 && moonAgeDays < 6.89) {
        phaseName = "Waxing Crescent (Hilal)"; moonSymbol = "🌙";
    } else if (moonAgeDays >= 6.89 && moonAgeDays < 8.39) {
        phaseName = "First Quarter (İlk Dördün)"; moonSymbol = "🌓";
    } else if (moonAgeDays >= 8.39 && moonAgeDays < 13.76) {
        phaseName = "Waxing Gibbous (Büyüyen)"; moonSymbol = "🌔";
    } else if (moonAgeDays >= 13.76 && moonAgeDays < 15.76) {
        phaseName = "Full Moon (Dolunay — Yang Zirvesi)"; moonSymbol = "🌕";
    } else if (moonAgeDays >= 15.76 && moonAgeDays < 21.14) {
        phaseName = "Waning Gibbous (Küçülen)"; moonSymbol = "🌖";
    } else if (moonAgeDays >= 21.14 && moonAgeDays < 22.64) {
        phaseName = "Last Quarter (Son Dördün)"; moonSymbol = "🌗";
    } else {
        phaseName = "Waning Crescent (Eski Hilal)"; moonSymbol = "🌘";
    }

    return {
        percent: moonIlluminatedPercent, // Artık gerçek gökyüzüyle tam senkron akacak yüzde verisi
        name: phaseName,
        icon: moonSymbol,
        age: moonAgeDays.toFixed(1),
        seleneProgress: currentPhaseProgress // Üst panele ikon seçen o akışkan katsayı
    };
}

// 🪐 KUTSAL AKS MOTORU: NORTH & SOUTH NODE (RAHU & KETU) DOĞRULAYICI
// =========================================================================
function calculateCosmicNodes(date) {
    const currentMs = date.getTime();
    
    // Astronomik referans noktası: 1 Ocak 2000'de North Node tam 149.38° (Aslan) boylamındaydı.
    const refMs = new Date("2000-01-01T00:00:00Z").getTime();
    const elapsedDays = (currentMs - refMs) / (1000 * 60 * 60 * 24);
    
    // Ay düğümleri gökyüzünde sürekli GERİYE (Retrograde) doğru yürür aga.
    // Tam bir turu (360 dereceyi) 6793.5 günde (18.6 yılda) tamamlarlar:
    let northNodeDegrees = (149.38 - (elapsedDays * (360 / 6793.5))) % 360;
    if (northNodeDegrees < 0) northNodeDegrees += 360;
    
    // South Node her zaman North Node'un tam 180 derece karşı (opposite) kutbundadır!
    let southNodeDegrees = (northNodeDegrees + 180) % 360;
    
    // 64 odalık sirkadiyen kadrandaki yansıma odalarını türetiyoruz aga:
    let northNodeRoom = Math.floor((northNodeDegrees / 360) * 64);
    let southNodeRoom = Math.floor((southNodeDegrees / 360) * 64);
    
    return {
        northRoom: northNodeRoom,
        southRoom: southNodeRoom,
        northDeg: northNodeDegrees.toFixed(1),
        southDeg: southNodeDegrees.toFixed(1)
    };
}

function calculateMetatronMoon(date) {
    // 🛡️ [WICCA CODESEC] Parametre boş gelirse çökmesin kalkanı
    if (!date || typeof date.getTime !== 'function') {
        date = (typeof window.now !== 'undefined' && window.now) ? window.now : new Date();
    }

    const msPerDay = 86400000;
    const currentMs = date.getTime();
    
    // Astronomik Yeni Ay referans başlangıcı (Saf Yin Eşiği)
    const knownNewMoonEpoch = new Date("2000-01-06T18:14:00Z").getTime();
    const lunarSynodicPeriodMs = 29.530588853 * msPerDay;
    
    let elapsedMs = currentMs - knownNewMoonEpoch;
    let currentPhaseProgress = (elapsedMs % lunarSynodicPeriodMs) / lunarSynodicPeriodMs;
    if (currentPhaseProgress < 0) currentPhaseProgress += 1;
    
    let moonAgeDays = currentPhaseProgress * 29.530588853;
    let moonIlluminatedPercent = (currentPhaseProgress < 0.5) ? Math.round(currentPhaseProgress * 2 * 100) : Math.round((1 - currentPhaseProgress) * 2 * 100);

    // 🌟 13 AY TAKVİMİ MATEMATİĞİ (ELECTRIC MOON) - 1947 KORUMASI ENJEKTE EDİLDİ AGA
    const currentYear = date.getFullYear();
    const yearStartIndex = new Date(currentYear, 6, 26).getTime(); 
    
    // Milisaniye farkını gün bazında tam sayıya (trunc) çeviriyoruz ki eksi yıllarda Math.floor sapıtmasın
    let daysSinceGalacticYear = Math.trunc((currentMs - yearStartIndex) / msPerDay);

        // Eğer Temmuz 26'dan önce bir tarihteysek (Örn: Eylül değil de Ocak/Şubat gibi) bir önceki galaktik yılı baz al
        const prevYearStartIndex = new Date(currentYear - 1, 6, 26).getTime();
        daysSinceGalacticYear = Math.trunc((currentMs - prevYearStartIndex) / msPerDay);
    }

    const LUNAR_13_MOONS = [
        "MAGNETIC", "LUNAR", "ELECTRIC", "SELF-EXISTING",
        "OVERTONE", "RHYTHMIC", "RESONANT", "GALACTIC",

    let currentMoonIndex = Math.floor(daysSinceGalacticYear / 28) % 13;

    // Sabit yerel saat okumasını çöpe fırlatıyoruz!

    // Zaman FUTURE/PAST butonlarıyla büküldüğünde odanın da senkronize akmasını sağlıyoruz aga:
    const dayMs = currentMs % msPerDay;
    const localDayRatio = (dayMs >= 0) ? (dayMs / msPerDay) : (1 + (dayMs / msPerDay));
    
    // 64 odalık skalanın anlık oda değerini ve milimetrik küsurat payını türetiyoruz:
    let currentRoom64 = (localDayRatio * 64) % 64;

    // Eğer global bir `sunRoom64` değişkeni projenin butonları tarafından haricen güncelleniyorsa

    let seleneHexIndex = Math.floor(currentRoom64) % 64;

    return {

// =========================================================================
// 🎛️ 790Y KELDANİ ÇARKI & 13 AY DÖNGÜSÜ ZAMAN BÜKÜM MOTORU [CHALDEAN_GEAR]
// =========================================================================
function calculateChaldeanMatrix(targetDate) {
    // Keldani Çarkı başlangıç (Epoch) referansı: 26 Temmuz 2026 (Yeni Yıl / Manyetik Sıçrama)
    const chaldeanEpoch = new Date("2026-07-26T00:00:00");
    
    let diffTime = targetDate.getTime() - chaldeanEpoch.getTime();
    let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    
    // Zaman makinesi negatif taşma (Past) kalkanı:
    if (diffDays < 0) {
        diffDays = (365 * 1000 + diffDays) % (365 * 1000); 
    }
    
    // 🌌 [WICCA_TUNB_GEAR]: Gün ilerlemesini tam 365 günlük güneş yılı moduna alıyoruz aga!
    let yearDayIndex = diffDays % 365; // 0 ile 364 arası bir değer döner
    
    let currentChaldeanDay = (yearDayIndex % 28) + 1;
    let currentChaldeanMonthIndex = Math.floor(yearDayIndex / 28) + 1;
    
    const CHALDEAN_MOONS = [
        "MAGNETIC MOON", "LUNAR MOON", "ELECTRIC MOON", "SELF-EXISTING MOON",
        "OVERTONE MOON", "RHYTHMIC MOON", "RESONANT MOON", "GALACTIC MOON",
        "SOLAR MOON", "PLANETARY MOON", "SPECTRAL MOON", "CRYSTAL MOON", "COSMIC MOON"
    ];
    
    let moonName = CHALDEAN_MOONS[currentChaldeanMonthIndex - 1] || "TIMELESS MOON";
    
    // ☯ [GREEN DAY KALKANI]: Yılın tam 365. günü (İndex 364) zaman durur, sarkaç sıfırlanır!
    if (yearDayIndex === 364) {
        moonName = "GREEN DAY [ZAMAN DIŞI GÜN]";
        currentChaldeanDay = "☯";
        currentChaldeanMonthIndex = 13; // 13. Ayın son mühür eşiği
    }
    
    return {
        monthNum: currentChaldeanMonthIndex,
        moonName: moonName,
        dayNum: currentChaldeanDay
    };
}

// 🪐 METATRON ENGINE: 8000 YILLIK SAF MATEMATİKSEL PLANET İŞLEMCİSİ
// =========================================================================
function calculateMetatronPlanets(date) {
    const msPerDay = 86400000;
    const currentMs = date.getTime();
    
    // J2000.0 Astronomik Hizalama Çağı (1 Ocak 2000 Başlangıç Noktası)
    const epochJ2000 = new Date("2000-01-01T12:00:00Z").getTime();
    const elapsedDays = (currentMs - epochJ2000) / msPerDay;

    // 🧬 Gezegenlerin Hassas Yörünge Periyotları (Dünya Gün Değeri) ve Başlangıç Dereceleri
    const PLANET_CYCLES = {
        "SATÜRN":  { period: 10759.22, startDeg: 49.94,  color: "#1a1a1a", icon: "♄" }, // Siyah/Koyu Gri
        "JÜPİTER": { period: 4332.59,  startDeg: 34.35,  color: "#7a00ff", icon: "♃" }, // Mor
        "MARS":    { period: 686.98,   startDeg: 355.45, color: "#ff0000", icon: "♂" }, // Kırmızı Mars!
        "VENÜS":   { period: 224.70,   startDeg: 181.98, color: "#00ffaa", icon: "♀" }, // Yeşil Venüs!
        "MERKÜR":  { period: 87.97,    startDeg: 252.25, color: "#ffaa00", icon: "☿" }  // Sarı
    };

    const ZODIAC_SIGNS = [
        { name: "ARIES", sym: "♈" }, { name: "TAURUS", sym: "♉" }, { name: "GEMINI", sym: "♊" },
        { name: "CANCER", sym: "♋" }, { name: "LEO", sym: "♌" }, { name: "VIRGO", sym: "♍" },
        { name: "LIBRA", sym: "♎" }, { name: "SCORPIO", sym: "♏" }, { name: "SAGITTARIUS", sym: "♐" },
        { name: "CAPRICORN", sym: "♑" }, { name: "AQUARIUS", sym: "♒" }, { name: "PISCES", sym: "♓" }
    ];

    let computedPlanets = {};

    for (let pName in PLANET_CYCLES) {
        let p = PLANET_CYCLES[pName];
        
        // Gezegenin 8000 yıllık lineer uzay-zaman büküm açısı hesaplanıyor aga:
        let totalShiftDeg = (elapsedDays * (360 / p.period));
        let finalDeg = (p.startDeg + totalShiftDeg) % 360;
        if (finalDeg < 0) finalDeg += 360;

        let signIdx = Math.floor(finalDeg / 30) % 12;
        let bakiyeDeg = Math.floor(finalDeg % 30);
        
        // Sinodik retro büküm filtresi (Yıllık Dünya-Gezegen yaklaşma anomalisi)
        const dayOfYear = (date.getTime() - new Date(date.getFullYear(), 0, 1).getTime()) / msPerDay;
        let isRetro = false;
        if (pName === "MARS" && (dayOfYear % 780 >= 350 && dayOfYear % 780 <= 430)) isRetro = true;
        if (pName === "VENÜS" && (dayOfYear % 584 >= 540 || dayOfYear % 584 <= 40)) isRetro = true;
        if (pName === "SATÜRN" && (dayOfYear % 378 >= 130 && dayOfYear % 378 <= 270)) isRetro = true;

        computedPlanets[pName] = {
            sign: ZODIAC_SIGNS[signIdx].name,
            symbol: ZODIAC_SIGNS[signIdx].sym,
            deg: bakiyeDeg,
            color: p.color,
            icon: p.icon,
            retro: isRetro ? "[Rx]" : "[DIR]"
        };
    }

    return computedPlanets;
}

    // Selene ile asla çakışmaması için 180 derece ters fazda akar
    const lilithWave = -1 * Math.sin(time); 
    
    // Değerleri ekrandaki barlara basmak için 0 ile 100 arasına ölçekleyelim aga
    const selenePercent = Math.round(((seleneWave + 1) / 2) * 100);
    const lilithPercent = Math.round(((lilithWave + 1) / 2) * 100);
    
    // Teorinin matematiksel ifadesi: Kuantum Faz Farkı

// 🧠 WICCA OS: METATRON PARASEMPATİK LUNAR NODES SÜRÜCÜ ALGORİTMASI
// =========================================================================

function updateMetatronLunarNodes() {
    const time = Date.now() * 0.001; // Kuantum sarkaç hızı
    
    // Selene ve Lilith ters sinüs dalgaları (Fiziki Akış)
    const seleneWave = Math.sin(time);
    const lilithWave = -1 * Math.sin(time);

    // 🪐 TRUE LUNAR NODES (Kuzey ve Güney Ay Düğümleri Hesaplaması)
    // Metatron'un siyah ve beyaz daire aksını besleyecek kuantum potansiyeli
    const northNodeRahu = (seleneWave + 1) / 2;    // Beyaz Daire Potansiyeli [0 - 1]
    const southNodeKetu = (lilithWave + 1) / 2;    // Siyah Daire Potansiyeli [0 - 1]

    // 🎯 METATRON MERKEZ DAİRE AKSININ CSS/DOM IŞIMASINI TETİKLEME
    // Kodundaki renkli dairelerin element ID'lerine göre parlamasını sağlıyoruz aga
    const whiteNodeCircle = document.getElementById("metatron-circle-white");
    const blackNodeCircle = document.getElementById("metatron-circle-black");

    if (whiteNodeCircle && blackNodeCircle) {
        // Beyaz düğüm Selene ile parlar (Kuzey Düğümü Işıması)
        whiteNodeCircle.style.filter = `drop-shadow(0 0 ${10 + northNodeRahu * 15}px rgba(255,255,255,${0.3 + northNodeRahu * 0.7}))`;
        whiteNodeCircle.style.opacity = 0.4 + northNodeRahu * 0.6;

        // Siyah düğüm Lilith'in karanlık odağıyla parlar (Güney Düğümü Siber-Mor/Neon Işıması)
        blackNodeCircle.style.filter = `drop-shadow(0 0 ${10 + southNodeKetu * 15}px rgba(122,0,255,${0.3 + southNodeKetu * 0.7}))`;
        blackNodeCircle.style.opacity = 0.4 + southNodeKetu * 0.6;
    }

    // 🔮 LILITH & LUNAR NODES ÖZET PANEL GÜNCELLEMESİ (#lilith-cosmic-dock)
    const lilithTitle = document.getElementById("lilith-title");
    const lilithDesc = document.getElementById("lilith-desc");
    const lilithFormula = document.getElementById("lilith-formula");

    if (lilithTitle && lilithDesc && lilithFormula) {
        lilithTitle.innerHTML = `🌌 METATRON PARASYMPATHETIC AXIS: NODE_LOCK`;
        lilithTitle.style.color = "#a855f7"; // Kuantum siber mor

        lilithDesc.innerHTML = `Kuzey Düğümü (Rahu/Beyaz): %${Math.round(northNodeRahu*100)} | Güney Düğümü (Ketu/Siyah): %${Math.round(southNodeKetu*100)}`;
        
        // Gerçek ay düğümleri formülünün arayüze çakılması
        lilithFormula.innerHTML = `[NODE_AXIS] = METATRON_VERTICAL_LAG | RAHU ☊ KETU ☋ ASYNCHRONOUS_TRUE_NODES`;
        lilithFormula.style.color = "#00ffaa"; // Siber yeşil
    }

    // DIAGNOSTICS TERMİNALİNE (DIAGS) LOG SIZDIRMA
    // Alttaki terminal açıksa canlı düğüm logları Matrix akışında aksın aga
    const terminalBody = document.getElementById("terminal-body");
    if (terminalBody && Math.random() < 0.1) { // Terminali kitlememek için periyodik log atar
        const logLine = document.createElement("div");
        logLine.className = "log-line";
        logLine.style.color = "#00ffaa";
        logLine.innerHTML = `[SYS_NODE_LAG] -> TRUE_NODES_CHAKRA_EQUALIZER: RAHU_VAL ${northNodeRahu.toFixed(4)} | KETU_VAL ${southNodeKetu.toFixed(4)}`;
        terminalBody.appendChild(logLine);
        if (terminalBody.childNodes.length > 8) terminalBody.removeChild(terminalBody.firstChild);
        terminalBody.scrollTop = terminalBody.scrollHeight;
    }
}

const Maya13MoonPhase = (targetDate = new Date()) => {
    let year = targetDate.getFullYear();
    
    // O yılın Maya Yıl Başlangıcı (26 Temmuz)
    let mayaNewYear = new Date(year, 6, 26); // JavaScript'te aylar 0'dan başlar (6 = Temmuz)
    
    // Eğer hedef tarih 26 Temmuz'dan önceyse, bir önceki yılın döngüsündeyizdir aga
    if (targetDate < mayaNewYear) {
        year--;
        mayaNewYear = new Date(year, 6, 26);
    }

    // 26 Temmuz'dan bu yana kaç milisaniye geçmiş?
    let diffMilli = targetDate.getTime() - mayaNewYear.getTime();
    let diffDays = Math.floor(diffMilli / (1000 * 60 * 60 * 24));

    let mayaPhaseStr = "";

    // 🎯 Zamanın Dışındaki Gün Kontrolü (25 Temmuz - Day Out of Time)
    if (diffDays === 364) {
        mayaPhaseStr = "DAY OUT OF TIME 🌀 (Zamanın Dışındaki Gün)";
    } else {
        // Her ay tam 28 gün sürer aga!
        let moonIndex = Math.floor(diffDays / 28);
        let moonDay = (diffDays % 28) + 1;
        
        // Sınır koruması
        moonIndex = Math.max(0, Math.min(12, moonIndex));
        
        mayaPhaseStr = `${MAYA_MOONS[moonIndex]} [Day: ${moonDay}/28]`;
    }

    // 🚀 GLOBAL HAFIZAYA VE PANEL VERİLERİNE AKTARIM:
    window.wiccaMayaPhase = mayaPhaseStr;
    console.log("🪐 Maya Eksen Ayarı:", mayaPhaseStr);
};

// Açılışta ve zaman büküldüğünde hemen güncellensin aga
document.addEventListener("DOMContentLoaded", () => {
    Maya13MoonPhase(window.wiccaCurrentAxisDate || new Date());
});

// ♈ WICCA SAF DİNAMİK ZODIAC MOTORU (SIFIR HİLE - %100 DOĞAL MATEMATİK)
// =========================================================================
const boylamiBurcaCevirAga = (deg) => {
    const ZODIAC_SIGNS = [
        { name: "Koç", symbol: "♈" },     { name: "Boğa", symbol: "♉" }, 
        { name: "İkizler", symbol: "♊" }, { name: "Yengeç", symbol: "♋" },
        { name: "Aslan", symbol: "♌" },    { name: "Başak", symbol: "♍" }, // 150° - 180°
        { name: "Terazi", symbol: "♎" },   { name: "Akrep", symbol: "♏" },
        { name: "Yay", symbol: "♐" },     { name: "Oğlak", symbol: "♑" }, // 270° - 300°
        { name: "Kova", symbol: "♒" },     { name: "Balık", symbol: "♓" }
    ];

    // Derece ne gelirse gelsin 0-360 arasına kusursuz çiviler, eksi değerleri korur aga:
    let normalized = (deg % 360 + 360) % 360;
    
    // Saf dürüst matematik: 30 dereceye bölerek hangi burç indeksinde olduğunu kendi bulur!
    let signIndex = Math.floor(normalized / 30);
    
    let signDeg = Math.floor(normalized % 30);
    let signMin = Math.floor((normalized % 1) * 60);

    const sign = ZODIAC_SIGNS[signIndex] || ZODIAC_SIGNS[0];
    return `${sign.symbol} ${signDeg}°${signMin < 10 ? '0' : ''}${signMin}' ${sign.name}`;
};

const hesaplaGezegenAcilari = (sunLong, lilithLong) => {
    // İki gezegen arasındaki mutlak derece farkını buluyoruz aga
    let diff = Math.abs(sunLong - lilithLong);
    if (diff > 180) diff = 360 - diff; // Çember koruması

    let aciDurumu = "";

    // Astro-Seek Kalibresi Standart Orblar (Kabaca):
    if (diff >= 85 && diff <= 95) {
        // 🎯 BAŞAK 27° ile OĞLAK 0° BURAYA VURUR AGA! (~92 Derece)
        aciDurumu = "SQUARE (90° Kare Açılama) 📐";
    } else if (diff >= 175 && diff <= 185) {
        aciDurumu = "OPPOSITE (180° Karşıt Açılama) ⇌";
    } else if (diff >= 0 && diff <= 5) {
        aciDurumu = "CONJUNCTION (0° Kavuşum) ⚛️";
    } else {
        aciDurumu = "DİNAMİK AKIŞ";
    }

    // 🚀 Ön yüze basmak veya kararlılığı korumak için global hafızaya mühürle
    window.wiccaSunLilithAspect = aciDurumu;
    //console.log(`🛰️ Açı Kalibrasyonu: Güneş-Lilith Farkı: ${diff.toFixed(1)}° | Durum: ${aciDurumu}`);
};

const hesaplaWiccaAyDugumleri = (targetDate = new Date()) => {
    // 🧭 1. Bilinen Kararlı Bir North Node Referansı (Astronomik Epok)
    // 1 Ocak 2026'da North Node yaklaşık 140 derece civarındaydı.
    // Düğümler yılda yaklaşık 19.34 derece RETRO (ters) hareket eder.
    const KOK_EPOK = new Date("2026-01-01T00:00:00Z").getTime();
    const GÜNLÜK_RETRO_HAREKET = 19.34136 / 365.25; // Gün başına geri gitme derecesi

    let diffDays = (targetDate.getTime() - KOK_EPOK) / (1000 * 60 * 60 * 24);
    
    // North Node Derecesi (Geriye doğru aktığı için eksi yapıyoruz aga)
    let northDegree = (140.0 - (diffDays * GÜNLÜK_RETRO_HAREKET)) % 360;
    if (northDegree < 0) northDegree += 360;

    // South Node her zaman tam 180 derece karşısındadır!
    let southDegree = (northDegree + 180) % 360;

    // 🎯 2. Element Kapıları ve 64'lük Oda Karşılıkları
    // 360 derece üzerinden odaları buluyoruz:
    let northRoom = Math.floor(northDegree / 5.625);
    let southRoom = Math.floor(southDegree / 5.625);

    // 💎 Senin İstediğin Nokta Atışı Element Mühürlemesi:
    // North Node -> METAL (Genellikle 51-55 odaları arası metal kapısı tetiklenir)
    // South Node -> WATER (Genellikle 41-50 odaları arası su kapısı tetiklenir)
    
    let northElementStr = `☰ METAL (${northDegree.toFixed(0)}°) [Room: ${northRoom}]`;
    let southElementStr = `☰ WATER (${southDegree.toFixed(0)}°) [Room: ${southRoom}]`;

    // 🚀 GLOBAL HAFIZAYA VE PANEL VERİLERİNE AKTARIM:
    window.wiccaNorthNode = northElementStr;
    window.wiccaSouthNode = southElementStr;
    window.northNodeRoom = northRoom;
    window.southNodeRoom = southRoom;

    // ⚡ TUTULMA (ECLIPSE) KONTROL KALKANI:
    // Eğer Güneş veya Ay, bu düğüm odalarından birine tam olarak basarsa TUTULMA ışığı yanar aga!
    let isGunesNorthTutulma = (window.sunRoom64 === northRoom);
    let isAySouthTutulma = (parseInt(window.wiccaLunarAge) >= 14 && parseInt(window.wiccaLunarAge) <= 15 && window.safeActiveRoom === southRoom);

    if (isGunesNorthTutulma) {
        console.log("☀️🚨 KOZMİK ALARM: Hibrid/Güneş Tutulması Tetiklendi!");
    }
    
    console.log(`🛰️ Düğüm Aksı: NORTH: ${northElementStr} ⇌ SOUTH: ${southElementStr}`);
};

// Açılışta ve zaman büküldüğünde bu motoru da ateşle aga
document.addEventListener("DOMContentLoaded", () => {
    hesaplaWiccaAyDugumleri(window.wiccaCurrentAxisDate || new Date());
});

// 🎛️ GLOBAL SFX STATE SHIELD (FONKSİYONLARIN DIŞINDA DURMALI AGA!)
// =========================================================================
window.wiccaAudioCtx = window.wiccaAudioCtx || null;
window.wiccaOscillator = window.wiccaOscillator || null;
window.wiccaGainNode = window.wiccaGainNode || null;
window.isWiccaAudioPlaying = window.isWiccaAudioPlaying || false;


// 🚀 2. [AÇILIŞ TETİKLEYİCİSİ]: Tarayıcı DOM'u indirdiği an (downloaded) ilk iş statüye bakılır
document.addEventListener("DOMContentLoaded", () => {
    let openingRoom = 0;
    
    // safeActiveRoom için ReferenceError korumalı kalkan:
    if (typeof window.safeActiveRoom !== 'undefined') {
        openingRoom = window.safeActiveRoom;
    } else if (typeof safeActiveRoom !== 'undefined') {
        openingRoom = safeActiveRoom;
    }

    // İlk iş statüyü mühürle ki render motoru Mona'yı üste fırlatmasın
    wiccaStatuyuMuhurle(openingRoom);

    // Saat modunu mor neonla ateşle
    if (typeof window.setWiccaMode === 'function') {
        window.setWiccaMode('SAAT'); 
    }


 // =========================================================================
    // ⚙️ WICCA OS: AUDIO WEB-SYNTH FREKANS SÜRÜCÜSÜ (SANDBOX BYPASS - RE-FIXTURE)
    // =========================================================================
    const settingsBtn = document.getElementById('settings-btn') || document.querySelector('.deck-btn-settings');
    
    if (settingsBtn) {
        settingsBtn.addEventListener('click', async (e) => {
            e.stopPropagation(); // Kuantum çakışma önleyici kalkan

            try {
                // 🗃️ Yerel dosya (file:///) kilitlerini kırmak için AudioContext'i her durumda zorla ayağa kaldırıyoruz:
                if (!window.wiccaAudioCtx) {
                    window.wiccaAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                // 🚨 GÜVENLİK DUVARI EZİCİ: Tarayıcının 'file:///' protokolü üzerindeki donma inadını 
                // asenkron (async/await) bir şok dalgasıyla zorla ayağa kaldırıyoruz aga!
                if (window.wiccaAudioCtx.state === 'suspended') {
                    await window.wiccaAudioCtx.resume();
                }

                if (!window.isWiccaAudioPlaying) {
                    // 🔊 SESİ AÇMA OPERASYONU: Sinüs dalgası hoparlöre fırlatılıyor!
                    window.wiccaOscillator = window.wiccaAudioCtx.createOscillator();
                    window.wiccaGainNode = window.wiccaAudioCtx.createGain();

                    // Sirkadiyen odaya göre kutsal Metatron frekansını tayin ediyoruz aga:
                    let currentRoomSafe = typeof sunRoom64 !== 'undefined' ? sunRoom64 : 48;
                    let targetFrequency = 112.3; // Gece/Lilith modu için asil alt rezonans (Delta/Theta)

                    if (currentRoomSafe >= 16 && currentRoomSafe < 32) {
                        targetFrequency = 224.6; // Gündüz/Yang modu için yüksek frekans dalgası
                    }

                    window.wiccaOscillator.type = 'sine'; // Senin o meşhur, çarpışmayan pürüzsüz sinüs dalgan aga!
                    window.wiccaOscillator.frequency.setValueAtTime(targetFrequency, window.wiccaAudioCtx.currentTime);

                    // Kulakları yormayacak ipeksi bir siberpunk uğultu hacmi (%6 CPU/GPU dostu):
                    window.wiccaGainNode.gain.setValueAtTime(0.05, window.wiccaAudioCtx.currentTime);

                    // Çarkları birbirine kelepçeleyip fırlatıyoruz:
                    window.wiccaOscillator.connect(window.wiccaGainNode);
                    window.wiccaGainNode.connect(window.wiccaAudioCtx.destination);

                    window.wiccaOscillator.start(0);
                    window.isWiccaAudioPlaying = true;
                    settingsBtn.classList.add('active-glow-mode');
                    console.log(`Wicca OS: Frekans kalkanı aktif -> ${targetFrequency} Hz Sinüs Eğrisi.`);
                } else {
                    // 🔇 SESİ KAPATMA OPERASYONU: Şalteri indiriyoruz aga!
                    if (window.wiccaOscillator) {
                        try {
                            window.wiccaOscillator.stop(0);
                            window.wiccaOscillator.disconnect();
                        } catch(e) {}
                        window.wiccaOscillator = null;
                    }
                    window.isWiccaAudioPlaying = false;
                    settingsBtn.classList.remove('active-glow-mode');
                    console.log("Wicca OS: Frekans kalkanı deaktif, sükunet modu.");
                }
            } catch (audioErr) {
                console.log(`Ses Motoru Kalkanı Hatayı Eritti: ${audioErr.message}`);
            }
        });

// =========================================================================
let currentCompassHeading = 0;
window.wiccaCompassOffset = 0; // 🎯 Kalibrasyon için sanal ofset kilidi aga!

function activateWiccaPhysicalCompass() {
    if (window.DeviceOrientationEvent) {
        // iOS (Safari) için kritik güvenlik ve izin kapısı kilidi
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        window.removeEventListener('deviceorientation', handleCompassMove, true);
                        window.addEventListener('deviceorientation', handleCompassMove, true);
                        console.log("Wicca OS: iOS Manyetometre İzni Alındı [SYNCED]");
                    }
                })
                .catch(console.error);
        } else {
            // Android ve diğer tarayıcılar direkt sıfır lag bağlanır
            window.removeEventListener('deviceorientation', handleCompassMove, true);
            window.addEventListener('deviceorientation', handleCompassMove, true);
            console.log("Wicca OS: Android Manyetometre Bağlantısı Aktif [ZERO-LAG]");
        }
    } else {
        console.log("Aga bu cihazda manyetometre (pusula sensörü) bulunamadı.");
    }
}

// Telefon havada döndükçe salisesinde tetiklenen o tek parça, temiz hesaplama çarkı aga:
function handleCompassMove(event) {
    let heading = 0;
    
    // iOS için saf Kuzey açısı (webkitCompassHeading) yoksa Android alpha bükümü:
    if (event.webkitCompassHeading) {
        heading = event.webkitCompassHeading;
    } else if (event.alpha !== null) {
        heading = 360 - event.alpha;
    } else {
        return;
    }

    // 🎯 KALİBRASYON BÜKÜMÜ: Gelen ham açıdan basılan ofseti çıkartarak pusulayı anında sıfırlıyoruz!
    let finalHeading = (heading - window.wiccaCompassOffset + 360) % 360;
    currentCompassHeading = Math.round(finalHeading);

    // 8 Kapının içinde yaşadığı o ana .cosmic-compass div'ini jilet gibi dünyada sabit tutuyoruz aga:
    const cosmicCompassDiv = document.querySelector('.cosmic-compass');
    if (cosmicCompassDiv) {
        cosmicCompassDiv.style.transform = `rotate(${-currentCompassHeading}deg)`;
        cosmicCompassDiv.style.transition = "transform 0.1s linear"; // Lag sıfırlayıcı ipeksi akış
    }
}

// 🪐 WICCA OS: KELDANİ GEZEGEN ENJEKTÖR MOTORU [CHALDEAN_MATRIX_INJECTOR]
// =========================================================================
// 7 kadim gezegen simgesi ve derecesi bagua hücrelerine sıfır lagla çakılır aga!

function injectChaldeanPlanetsToFrames(currentTransitData) {
    // 1. KELDANİ SAF ASTRONOMİK SİMGELER MATRİSİ:
    const planetSymbols = {
        saturn: "♄", jupiter: "♃", mars: "♂", sun: "☉", 
        venus: "♀", mercury: "☿", moon: "☽", trueNode: "☊"
    };

    // 2. EKRANDAKİ TÜM TRANSİT YUVALARINI HER TIKTA TEMİZLE VE NADASA AL (LAG BARİYERİ):
    document.querySelectorAll('.planet-ghost-slot, .pillar-planet-slot, .gate-planet-slot').forEach(slot => {
        if (slot) {
            slot.innerHTML = "";
            slot.style.opacity = "0.3";
        }
    });

    // 3. TRANSİT VERİLERİNİ TARAYIP SAF VOLTAJLA HÜCRELERE GÖMEN MOTOR AGA:
    for (let planet in planetSymbols) {
        if (!currentTransitData || !currentTransitData[planet]) continue;
        
        let pData = currentTransitData[planet]; // { sign: 'AQU', degree: 3 } gibi akan veri
        let symbol = planetSymbols[planet];
        
        // Simgeleri ve dereceleri yan yana birer siber marker olarak hazırlıyoruz aga:
        let injectionHTML = `<span class="injected-planet-marker" style="color: #ffffff; text-shadow: 0 0 5px #ffffff; font-size: 11px; margin-left: 4px;">${symbol}${pData.degree}°</span>`;

        // 📐 GEZEGEN HANGİ KÖŞEYE VEYA İÇ KAPIT A BASTI? (BURÇ ETİKET KONTROLLERİ):
        let targetSign = pData.sign.toUpperCase();

        // Dış Çeper Galaktik Çerçeve Hücreleri:
        if (targetSign === "TAU") appendPlanetToSlot('frame-spring-root', injectionHTML);
        if (targetSign === "LEO") appendPlanetToSlot('frame-summer-peak', injectionHTML);
        if (targetSign === "AQU") appendPlanetToSlot('frame-winter-base', injectionHTML);
        if (targetSign === "SCO") appendPlanetToSlot('frame-autumn-gate', injectionHTML);
        
        // İç Katman Dikey ve Yatay Mevsim Haç Kapıları (Duru Hücreler):
        if (targetSign === "CAP") appendPlanetToSlot('pillar-winter-north', injectionHTML);
        if (targetSign === "CAN") appendPlanetToSlot('pillar-summer-south', injectionHTML);
        if (targetSign === "ARI") appendPlanetToSlot('pillar-spring-march', injectionHTML);
        if (targetSign === "LIB") appendPlanetToSlot('pillar-autumn-september', injectionHTML);
    }
}

function appendPlanetToSlot(targetId, htmlContent) {
    const parentFrame = document.getElementById(targetId);
    if (!parentFrame) return;

    // İçerideki o boş hayalet yuvayı bulup simgeyi ve dereceyi şak diye basıyoruz aga:
    const slot = parentFrame.querySelector('.planet-ghost-slot') || 
                 parentFrame.querySelector('.pillar-planet-slot') || 
                 parentFrame.querySelector('.gate-planet-slot');
                 
    if (slot) {
        slot.innerHTML += htmlContent;
        slot.style.opacity = "1.0";
    }
}

window.setWiccaMode = function(mode) {
    // 🎯 HATA ENGELLEME: Eğer arayüzden 'SAAT' gelirse onu otomatik 'ODA' moduna 
    // veya tam tersine eşitleyerek arka plandaki string çakışmasını infaz ediyoruz aga!
    let targetMode = mode.toUpperCase();
    if (targetMode === 'SAAT') targetMode = 'ODA';
    
    window.wiccaTimeMode = targetMode; 
    
    // Tüm butonların siberpunk ışıklarını söndürüp pasife çekme mantığı
    // HTML'deki id'lerin 'mode-btn-oda' veya 'mode-btn-saat' ihtimallerini tek parça tarıyoruz:
    const modes = ['SAAT', 'ODA', 'GÜN', 'HAFTA', 'AY', 'VENUS8', 'SATURN79', 'KELDANI790'];
    modes.forEach(m => {
        const btn = document.getElementById(`mode-btn-${m.toLowerCase()}`);
        if (btn) {
            btn.style.background = '#0a0a0a'; 
            btn.style.color = '#444'; 
            btn.style.border = '1px solid #222'; 
            btn.style.boxShadow = 'none';
        }
    });
    
    // Aktif edilen zaman vitesinin butonunu mor neon ışıkla patlatıyoruz aga!
    // Hem 'saat' hem 'oda' ID ihtimallerini eş zamanlı yakalıyoruz:
    let activeId = mode.toLowerCase();
    let activeBtn = document.getElementById(`mode-btn-${activeId}`);
    
    // Eğer 'oda' id'li buton bulunamazsa 'saat' id'li butona ışık ver:
    if (!activeBtn && activeId === 'oda') activeBtn = document.getElementById('mode-btn-saat');
    if (!activeBtn && activeId === 'saat') activeBtn = document.getElementById('mode-btn-oda');

    if (activeBtn) {
        activeBtn.style.background = 'rgba(122, 0, 255, 0.15)'; 
        activeBtn.style.color = '#fff'; 
        activeBtn.style.border = '1px solid #7a00ff'; 
        activeBtn.style.boxShadow = '0 0 10px rgba(122, 0, 255, 0.35)';
    }
    console.log(`Wicca OS Zaman Vitesi Değiştirildi: [${targetMode}]`);
};

window.bendWiccaTime = function(direction) {
    
    // 🎯 [MUTLAK SIFIR NOKTASI - NOW ÇAPASI]
    if (direction === 'NOW') {
        window.isTimeBended = false; 
        window.wiccaTimeOffsetMinutes = 0; 
        window.timeOffset = 0; 
        window.now = new Date(); 
        window.wiccaCurrentAxisDate = window.now;
        
        // NOW tuşuna basıldığında Lilith kilidini kaldırıyoruz ki tekrar canlı akışa uysun
        window.lockedSeleneIndex = undefined; 
        
        let currentRoomSafe = typeof sunRoom64 !== 'undefined' ? sunRoom64 : 0;
        window.currentCalculatedRoom = currentRoomSafe;
        window.wiccaSabbatIndex = Math.floor(currentRoomSafe / 8) % 8;

        if (typeof updateWiccaDock === 'function') { updateWiccaDock(); }
        console.log("⚡ Kuantum Çapası Tetiklendi: Gerçek Canlı Zamana Dönüldü!");
        return; 
    }

    window.isTimeBended = true; 
    
    // 🛡️ [LİLİTH KİLİT MEKANİZMASI]: Zaman ilk kez büküldüğü an o anki seleneIndex'i hafızaya sabitliyoruz
    if (typeof window.lockedSeleneIndex === 'undefined' && typeof seleneIndex !== 'undefined') {
        window.lockedSeleneIndex = seleneIndex;
    }

    if (typeof window.currentCalculatedRoom === 'undefined' || window.currentCalculatedRoom === null) {
        window.currentCalculatedRoom = typeof sunRoom64 !== 'undefined' ? sunRoom64 : 0;
    }
    
    let currentRoom = window.currentCalculatedRoom;
    let forcedRoom = currentRoom;

    let mode = window.wiccaTimeMode ? window.wiccaTimeMode.toUpperCase() : 'ODA';
    if (mode === 'SAAT') mode = 'ODA';

    if (typeof window.timeOffset === 'undefined') { window.timeOffset = 0; }

    if (mode === 'ODA') {
        let kalan = currentRoom % 8;

        if (direction === 'FUTURE') {
            forcedRoom = currentRoom + (kalan === 0 ? 8 : (8 - kalan)); 
            window.timeOffset = window.timeOffset + (3 * 3600 * 1000); 
        } 
        else if (direction === 'PAST') {
            forcedRoom = currentRoom - (kalan === 0 ? 8 : kalan);
            window.timeOffset = window.timeOffset - (3 * 3600 * 1000); 
        }
        
        forcedRoom = (forcedRoom + 64) % 64;
    } else {
        let delta = (mode === 'GÜN') ? 2 : (mode === 'HAFTA' ? 3 : 4);
        let milisaniyeGunCarpani = 24 * 60 * 60 * 1000;
        
        if (direction === 'FUTURE') {
            window.timeOffset = window.timeOffset + (delta * milisaniyeGunCarpani);
        } else if (direction === 'PAST') {
            window.timeOffset = window.timeOffset - (delta * milisaniyeGunCarpani);
        }

        let idx = (Math.floor(currentRoom / 8) + (direction === 'FUTURE' ? delta : -delta + 8)) % 8;
        forcedRoom = idx * 8;
    }

    window.currentCalculatedRoom = forcedRoom;
    if (typeof sunRoom64 !== 'undefined') { sunRoom64 = forcedRoom; }
    if (typeof currentRoomSafe !== 'undefined') { currentRoomSafe = forcedRoom; }
    window.wiccaSabbatIndex = Math.floor(forcedRoom / 8) % 8;

    const baseDate = new Date();
    window.now = new Date(baseDate.getTime() + window.timeOffset);
    window.wiccaCurrentAxisDate = window.now;
    window.wiccaTimeOffsetMinutes = Math.floor(window.timeOffset / (60 * 1000));

    if (typeof updateWiccaDock === 'function') { updateWiccaDock(); }
};

// 🔮 DOKUNUNCA YUKARI ESNEYEN ŞEFFAF TÜL PANEL MOTORU (MÜHÜRLÜ ENJEKSİYON)
// =========================================================================
document.addEventListener("DOMContentLoaded", () => {
    const lilithDock = document.getElementById('lilith-cosmic-dock');
    const lilithTitle = document.getElementById('lilith-title');

    if (lilithDock) {
        // Lilith dock panelinin sağ üst köşesine kibar bir mobil genişleme ibaresi ekle aga
        if (lilithTitle && !document.getElementById('dock-arrow')) {
            lilithTitle.innerHTML += `<span id="dock-arrow" style="font-size: 8px; color: #444; transition: all 0.3s ease; font-weight: bold; letter-spacing: 0.5px;">▲ EXPAND</span>`;
        }

        const arrow = document.getElementById('dock-arrow');

        // Panele dokunulduğunda yukarı stor gibi uzat veya geri katla
        lilithDock.addEventListener('click', (e) => {
            e.stopPropagation(); // Diğer click eventlerini kilitlemesin aga
            lilithDock.classList.toggle('dock-expanded');

            if (lilithDock.classList.contains('dock-expanded')) {
                if (arrow) {
                    arrow.innerText = "▼ CLOSE";
                    arrow.style.color = "#ff5e00"; // Kapatırken PAST turuncusu
                }
            } else {
                if (arrow) {
                    arrow.innerText = "▲ EXPAND";
                    arrow.style.color = "#444";
                }
            }
        });

        // UX Rahatlığı: Boş bir yere dokunulursa tül panel otomatik aşağı kapansın
        document.addEventListener('click', (e) => {
            if (!lilithDock.contains(e.target)) {
                lilithDock.classList.remove('dock-expanded');
                if (arrow) {
                    arrow.innerText = "▲ EXPAND";
                    arrow.style.color = "#444";
                }
            }
        });
    }
});
