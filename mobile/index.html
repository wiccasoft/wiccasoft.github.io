/* 🧭 8'Lİ ÇEMBER ÇERÇEVE ALTYAPISI (DURAĞAN LOŞ GRİ MOD) */

/* 🧭 8'Lİ SİBER-PUSULA ANA TEMELİ (PASİF GRİ MOD) */
.element-corner {
    position: absolute;
    font-family: 'Segoe UI', monospace;
    font-size: 0.8rem;
    letter-spacing: 2px;
    font-weight: bold;
    width: 65px; /* Sabit kare genişlik */
    height: 35px; /* Sabit yükseklik */
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(8, 8, 8, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    color: #444444;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0.2;
    z-index: 10;
}

/* ➕ CARDINAL HAÇ SABİT KİLİTLERİ */
.fire-gate  { top: 90px; left: 50%; transform: translateX(-50%); border-top: 1px solid rgba(255,255,255,0.15); }
.water-gate { bottom: 120px; left: 50%; transform: translateX(-50%); border-bottom: 1px solid rgba(255,255,255,0.15); }
.air-gate   { top: 50%; right: 20px; transform: translateY(-50%); border-right: 1px solid rgba(255,255,255,0.15); }
.earth-gate { top: 50%; left: 20px; transform: translateY(-50%); border-left: 1px solid rgba(255,255,255,0.15); }

/* ✖️ FIXED HAÇ ÇAPRAZ KİLİTLERİ */
.light-gate { top: 22%; right: 12%; } 
.ether-gate { bottom: 24%; right: 12%; } 
.metal-gate { bottom: 24%; left: 12%; } 
.ice-gate   { top: 22%; left: 12%; } 

/* 💥 ELEKTRİKSEL AKTİF ÇERÇEVE PARLAMASI */
.element-corner.active-glow {
    opacity: 0.95 !important;
    border-color: currentColor !important;
    box-shadow: 0 0 12px currentColor;
}
.element-corner .iching-binary {
    font-size: 0.55rem;
    opacity: 0.5;
    margin-left: 4px;
}

/* 🌌 MİSTİK ALT VERİ BARININ SİBERPUNK STİLİ */
.cosmic-status-bar {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Segoe UI', monospace;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    width: 85%;
    padding: 6px 12px;
    background: rgba(10, 10, 10, 0.6);
    border: 1px solid rgba(168, 85, 247, 0.15);
    border-radius: 4px;
    color: #888888;
    z-index: 15;
    text-transform: uppercase;
}
/* 💥 TEK SIFIRLANMIŞ PULSE: Sadece ritim anında (150ms) neon parlar ve hemen kapanır */
.pulse-hit {
    opacity: 1.0 !important;
    filter: drop-shadow(0 0 15px currentColor) brightness(1.4) !important;
}

/* Vuruş anında haç merkezlemelerinin ve ölçeklerin (scale) pürüzsüz esnemesi */
.fire-gate.pulse-hit, .water-gate.pulse-hit { transform: translateX(-50%) scale(1.04); }
.air-gate.pulse-hit, .earth-gate.pulse-hit { transform: translateY(-50%) scale(1.04); }


/* ✖️ FIXED CROSS ÇAPRAZ KAPILARIN MILIMETRİK HİZALAMALARI */

.metal-gate { bottom: 20%; left: 15%; color: #ff0055; border-bottom: 1px solid #ff0055; border-left: 1px solid #ff0055; } /* 🌋 Sol Alt */

function calculateCosmicTime() {
    const now = new Date();
    //const now = new Date(); now.setHours(20, 50, 0); 
    //const now = (typeof window.now !== 'undefined' && window.now) ? window.now : new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();

    
    
    // 24 saati dakikaya (toplam 1440 dk) döküp 0.0 - 1.0 arası bir "Gün Oranı" buluyoruz
    const totalMinutes = (hours * 60) + minutes;
    const dayRatio = totalMinutes / 1440; 
    
    // Sinüs dalgası kullanarak Öğlen (12:00) tepe noktasında 1 (Turuncu), 
    // Gece Yarısı (00:00) dip noktasında 0 (Mavi) elde ediyoruz
    const dayCycle = Math.sin((dayRatio * Math.PI * 2) - (Math.PI / 2)) * 0.5 + 0.5;

    return {
        dayCycle: dayCycle, // 0.0 (Gece Yarısı) ile 1.0 (Öğlen) arası akış
        isDay: hours >= 6 && hours < 18,
        hours: hours,
        minutes: minutes
    };
}

function getDynamicSunSign() {

    const day = now.getDate();

    // Astrolojik burç tarih sınırları (2026 ve genel hassasiyet için)
    if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "ARIES (KOÇ)";
    if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "TAURUS (BOĞA)";
    if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return "GEMINI (İKİZLER)";
    if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return "CANCER (YENGEÇ)";

    if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "VIRGO (BAŞAK)"; // 🌌 ŞU AN AKTİF OLAN
    if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return "LIBRA (TERAZİ)";
    if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return "SCORPIO (AKREP)";
    if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return "SAGITTARIUS (YAY)";

function getAstroSunAngle() {
    const now = new Date();
    const decimalHour = now.getHours() + (now.getMinutes() / 60);
    const solar = getExactSolarTimes(currentLat, currentLon);
    let angle;

    if (decimalHour >= solar.sunrise && decimalHour < solar.sunset) {
        // GÜNDÜZ EVRESİ: Gün doğumu 90° -> Gün batımı 270°
        const progress = (decimalHour - solar.sunrise) / (solar.sunset - solar.sunrise);
        angle = 90 + (progress * 180); 
    } else {
        // GECE EVRESİ: Gün batımı 270° -> Gün doğumu 90°
        let nightProgress;
        if (decimalHour >= solar.sunset) {
            nightProgress = (decimalHour - solar.sunset) / (24 - solar.sunset + solar.sunrise);
        } else {
            nightProgress = (24 - solar.sunset + decimalHour) / (24 - solar.sunset + solar.sunrise);
        }
        angle = 270 + (nightProgress * 180);
        if (angle >= 360) angle -= 360;
    }

    // Siyah barın sağ ucuna siber veri panelini basıyoruz
    let astroPanel = document.getElementById('astro-live-panel-v2');
    if (!astroPanel) {
        astroPanel = document.createElement('div');
        astroPanel.id = 'astro-live-panel-v2';
        astroPanel.style.position = 'absolute';
        astroPanel.style.bottom = '12px'; 
        astroPanel.style.right = '25px';
        astroPanel.style.fontFamily = 'monospace';
        astroPanel.style.fontSize = '10px';
        astroPanel.style.color = '#777777';
        astroPanel.style.zIndex = '10000';
        astroPanel.style.pointerEvents = 'none';
        document.body.appendChild(astroPanel);
    }
    astroPanel.innerHTML = `DL: ${solar.dayLength.toFixed(1)}h | SD: ${solar.declination.toFixed(2)}°`;

    return angle;
}

function getExactSolarTimes(lat, lon) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 80) * Math.PI / 180);
    
    return {
        declination: declination
    };
}

function getExactSolarTimes(lat, lon) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    
    // 1. Güneş Sapma Açısı (Declination - δ) Hesabı
    const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 80) * Math.PI / 180);
    const decRad = declination * Math.PI / 180;
    const latRad = lat * Math.PI / 180;

    // 2. Gün Batımı Saat Açısı Formülü (Hour Angle - H0)
    // cos(H0) = -tan(Lat) * tan(Dec)
    const cosH0 = -Math.tan(latRad) * Math.tan(decRad);
    
    // Sınır koruması (Kutup dairesi dışı emniyeti)
    let H0 = 90;
    if (cosH0 >= -1 && cosH0 <= 1) {
        H0 = Math.acos(cosH0) * 180 / Math.PI;
    }

    // 3. Gün Uzunluğu Saati (Day Length)
    const dayLength = (24 * H0) / 180;

    // 4. İstanbul Boylam Düzeltmeli Gerçek Öğlen Vakti (Solar Noon)
    // Standart GMT+3 meridyen zaman dilimi düzeltmesi dahil (Yaklaşık 12:20 civarı)
    const solarNoon = 12 - (lon / 15) + 2; 

    // 5. Milimetrik Gün Doğumu ve Gün Batımı Zamanları (Ondalık Saat Cinsinden)
    const sunrise = solarNoon - (dayLength / 2);
    const sunset = solarNoon + (dayLength / 2);

    return {
        sunrise: sunrise,      // Örn: 6.32 (06:19)
        sunset: sunset,        // Örn: 19.14 (19:08)
        dayLength: dayLength,  // Örn: 12.82 Saat
        declination: declination
    };
}

            let glitchFrequency = (2.5 - (seleneForce * 1.5)) * seasonalMultiplier; 
            
            // Ay'ın aydınlanması arttıkça neon dairelerin çizgileri kalınlaşır ve parlar aga:
            let dynamicBorderWidth = 2 + (seleneForce * 3); 
            
            gate.style.filter = `drop-shadow(0 0 ${dynamicGlow}px ${sunCircadianColor}) brightness(${1.0 + seleneForce * 0.4})`;
            gate.style.borderWidth = `${dynamicBorderWidth}px`;
            gate.style.animation = `pulse ${glitchFrequency}s infinite ease-in-out`;
            gate.style.transition = "all 0.5s ease-in-out";
        }
    });

    // 🌀 Merkezdeki 3D Iframe Katmanının Rezonans Hızını ve Ölçeğini Aksa Mühürlüyoruz:
    const metatronIframe = document.querySelector('.metatron-iframe') || document.getElementById('threejs-layer');

        let rotationSpeed = 30 - (seleneForce * 24); // 4sn ile 30sn arası otomatik büküm
        metatronIframe.style.setProperty('--metatron-rot-speed', `${rotationSpeed}s`);
        metatronIframe.style.transform = `scale(${1.0 + (seleneForce * 0.15)}) rotate(${seleneForce * 5}deg)`;
    }
}

// =========================================================================
// 🪐 METATRON ENGINE: 8000 YILLIK SAF MATEMATİKSEL PLANET İŞLEMCİSİ
// =========================================================================
function calculateMetatronPlanets(date) {
    const msPerDay = 86400000;
    const currentMs = date.getTime();
    
    // J2000.0 Astronomik Hizalama Çağı (1 Ocak 2000 Başlangıç Noktası)
    const epochJ2000 = new Date("2000-01-01T12:00:00Z").getTime();
    const elapsedDays = (currentMs - epochJ2000) / msPerDay;

    // 🧬 Gezegenlerin Hassas Yörünge Periyotları (Dünya Gün Değeri) ve Başlangıç Dereceleri
    const PLANET_CYCLES = {
        "SATÜRN":  { period: 10759.22, startDeg: 49.94,  color: "#1a1a1a", icon: "♄" }, // Siyah/Koyu Gri
        "JÜPİTER": { period: 4332.59,  startDeg: 34.35,  color: "#7a00ff", icon: "♃" }, // Mor
        "MARS":    { period: 686.98,   startDeg: 355.45, color: "#ff0000", icon: "♂" }, // Kırmızı Mars!
        "VENÜS":   { period: 224.70,   startDeg: 181.98, color: "#00ffaa", icon: "♀" }, // Yeşil Venüs!
        "MERKÜR":  { period: 87.97,    startDeg: 252.25, color: "#ffaa00", icon: "☿" }  // Sarı
    };

    const ZODIAC_SIGNS = [
        { name: "ARIES", sym: "♈" }, { name: "TAURUS", sym: "♉" }, { name: "GEMINI", sym: "♊" },
        { name: "CANCER", sym: "♋" }, { name: "LEO", sym: "♌" }, { name: "VIRGO", sym: "♍" },
        { name: "LIBRA", sym: "♎" }, { name: "SCORPIO", sym: "♏" }, { name: "SAGITTARIUS", sym: "♐" },
        { name: "CAPRICORN", sym: "♑" }, { name: "AQUARIUS", sym: "♒" }, { name: "PISCES", sym: "♓" }
    ];

    let computedPlanets = {};

    for (let pName in PLANET_CYCLES) {
        let p = PLANET_CYCLES[pName];
        
        // Gezegenin 8000 yıllık lineer uzay-zaman büküm açısı hesaplanıyor aga:
        let totalShiftDeg = (elapsedDays * (360 / p.period));
        let finalDeg = (p.startDeg + totalShiftDeg) % 360;
        if (finalDeg < 0) finalDeg += 360;

        let signIdx = Math.floor(finalDeg / 30) % 12;
        let bakiyeDeg = Math.floor(finalDeg % 30);
        
        // Sinodik retro büküm filtresi (Yıllık Dünya-Gezegen yaklaşma anomalisi)
        const dayOfYear = (date.getTime() - new Date(date.getFullYear(), 0, 1).getTime()) / msPerDay;
        let isRetro = false;
        if (pName === "MARS" && (dayOfYear % 780 >= 350 && dayOfYear % 780 <= 430)) isRetro = true;
        if (pName === "VENÜS" && (dayOfYear % 584 >= 540 || dayOfYear % 584 <= 40)) isRetro = true;
        if (pName === "SATÜRN" && (dayOfYear % 378 >= 130 && dayOfYear % 378 <= 270)) isRetro = true;

        computedPlanets[pName] = {
            sign: ZODIAC_SIGNS[signIdx].name,
            symbol: ZODIAC_SIGNS[signIdx].sym,
            deg: bakiyeDeg,
            color: p.color,
            icon: p.icon,
            retro: isRetro ? "[Rx]" : "[DIR]"
        };
    }

    return computedPlanets;
}


 window.wiccaTimeOffsetMinutes = 0; 

 // =========================================================================
// Günün 24 saatini (1440 dakika) 16 ana Hermetik sirkadiyen kapıya bölüyoruz aga!
// Her klik, simülasyon saatini doğrudan bu ana kadran koordinatlarına fırlatır:
// =========================================================================
// 🎛️ WICCA OS: 8'İN KATLARINA (%8 KOZMİK EKSEN) YUVARLAYICI ATLAYICI MOTORU
// =========================================================================

// 🛡️ Global Değişken Kalkanları
if (typeof window.wiccaTimeOffsetMinutes === 'undefined') { window.wiccaTimeOffsetMinutes = 0; }
if (typeof window.wiccaActiveMode === 'undefined') { window.wiccaActiveMode = 'AY'; } 

function bendWiccaTime(modeDirection) {
    // Dinamik oda süresini okumaya çalış, yoksa güvenli modda 21.9 kabul et
    const roomDuration = (typeof roomDurationMinutes !== 'undefined') ? roomDurationMinutes : 21.9;
    let currentRoom = (typeof window.currentCalculatedRoom !== 'undefined') ? window.currentCalculatedRoom : 0;

    // =========================================================================
    // 🎛️ AKTİF MODA GÖRE ZAMAN EKSENİNİ DOĞRUSAL BÜKME MOTORU
    // =========================================================================
    
    if (window.wiccaActiveMode === 'AY') {
        // 🌙 AY GÜNÜ MODU: Tam 30 sirkadiyen günlük (43200 dakika) temiz kuantum sıçraması
        if (modeDirection === 'FUTURE') {
            window.wiccaTimeOffsetMinutes += (30 * 24 * 60); // 30 Gün ileri fırlat
        } else if (modeDirection === 'PAST') {
            window.wiccaTimeOffsetMinutes -= (30 * 24 * 60); // 30 Gün geri sar
        }
    } // 🛡️ İŞTE UNUTULAN KRİTİK SÜSLÜ PARANTEZ BURASIYDI AGA!
    
    else if (window.wiccaActiveMode === 'GÜN') {
        // 📅 GÜN MODU: Tam 1 sirkadiyen günlük (1440 dakika) doğrusal eksen bükümü
        if (modeDirection === 'FUTURE') {
            window.wiccaTimeOffsetMinutes += (24 * 60); // 1 Gün ileri
        } else if (modeDirection === 'PAST') {
            window.wiccaTimeOffsetMinutes -= (24 * 60); // 1 Gün geri
        }
    } 
    
    else if (window.wiccaActiveMode === 'SAAT') {
        // ⏰ SAAT (ODA) MODU: Aktif gün içinde 8'er odalık tam vites sıçramaları
        if (modeDirection === 'FUTURE') {
            let next8Multiple = Math.floor(currentRoom / 8) * 8 + 8;
            if (next8Multiple > 64) next8Multiple = 0;
            let roomsToJump = next8Multiple - currentRoom;
            if (roomsToJump <= 0) roomsToJump += 64;
            window.wiccaTimeOffsetMinutes += (roomDuration * roomsToJump);
        } else if (modeDirection === 'PAST') {
            let prev8Multiple = (currentRoom % 8 === 0) ? currentRoom - 8 : Math.floor(currentRoom / 8) * 8;
            if (prev8Multiple < 0) prev8Multiple = 64;
            let roomsToJump = currentRoom - prev8Multiple;
            if (roomsToJump <= 0) roomsToJump += 64;
            window.wiccaTimeOffsetMinutes -= (roomDuration * roomsToJump);
        }
    }

    // Nihai bükülmüş zaman damgasını üret ve ana motora kilitli window.now nesnesine fırlat
    const originalDate = new Date();
    window.now = new Date(originalDate.getTime() + (window.wiccaTimeOffsetMinutes * 60 * 1000));

    // Siber status çubuğunu anlık durumla parlat
    const statusBar = document.getElementById('cosmic-status');
    if (statusBar) {
        statusBar.innerHTML = `WICCA WARP: [MOD: ${window.wiccaActiveMode}] | OFFSET: ${window.wiccaTimeOffsetMinutes} DK`;
    }

    if (typeof updateCosmicClock === 'function') { updateCosmicClock(); } 
    if (typeof triggerCircadianPulse === 'function') { triggerCircadianPulse(); }
} // 🛡️ SİLİNEN ANA FONKSİYON KAPANIŞ PARANTEZİ DE YERİNE KOYULDU!

// 🎛️ Mod Değiştirici Yardımcı Fonksiyon
function setWiccaMode(selectedMode) {
    window.wiccaActiveMode = selectedMode;
    
    // HTML'deki tüm mod butonlarını ID'leri üzerinden tarayıp söndürüyoruz
    const modes = ['saat', 'gün', 'ay'];
    modes.forEach(m => {
        const btn = document.getElementById('mode-btn-' + m);
        if (btn) {
            btn.style.background = '#111';
            btn.style.borderColor = '#333';
            btn.style.color = '#555';
            btn.style.boxShadow = 'none';
        }
    });
    
    // Aktif olanı neon mor ile parlat
    const activeBtn = document.getElementById('mode-btn-' + selectedMode.toLowerCase());
    if (activeBtn) {
        activeBtn.style.background = 'rgba(122, 0, 255, 0.15)';
        activeBtn.style.borderColor = '#7a00ff';
        activeBtn.style.color = '#fff';
        activeBtn.style.boxShadow = '0 0 10px #7a00ff';
    }
}
