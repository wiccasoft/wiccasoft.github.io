    <script>


function updateHTMLGates() {
    const timeData = calculateCosmicTime();
    const fireGate = document.querySelector('.fire-gate');
    const waterGate = document.querySelector('.water-gate');
    
    if (fireGate && waterGate) {
        // Öğlen yaklaştıkça Ateş parlar, Gece yaklaştıkça Su parlar
        fireGate.style.opacity = 0.2 + (timeData.dayCycle * 0.8);
        waterGate.style.opacity = 0.2 + ((1 - timeData.dayCycle) * 0.8);
    }
}
// Bu fonksiyonu 74 BPM vuruşu tetiklendikçe çağırabiliriz!



function calculateCosmicTime() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();
    
    // 24 saati dakikaya (toplam 1440 dk) döküp 0.0 - 1.0 arası bir "Gün Oranı" buluyoruz
    const totalMinutes = (hours * 60) + minutes;
    const dayRatio = totalMinutes / 1440; 
    
    // Sinüs dalgası kullanarak Öğlen (12:00) tepe noktasında 1 (Turuncu), 
    // Gece Yarısı (00:00) dip noktasında 0 (Mavi) elde ediyoruz
    const dayCycle = Math.sin((dayRatio * Math.PI * 2) - (Math.PI / 2)) * 0.5 + 0.5;

    return {
        dayCycle: dayCycle, // 0.0 (Gece Yarısı) ile 1.0 (Öğlen) arası akış
        isDay: hours >= 6 && hours < 18,
        hours: hours,
        minutes: minutes
    };
}

// 24 Saati 28 Günlük Ay Döngüsüne Bağlayan Senkronizasyon Fonksiyonu
function calculateLunarSync() {
    const simdi = new Date();
    
    // 1. Mikro Zaman (24 Saatlik Manyetik Açı)
    const saat = simdi.getHours();
    const dakika = simdi.getMinutes();
    // Gün içindeki manyetik dönüş açısı (0° - 360°)
    const gunIciManyetikAci = ((saat * 60 + dakika) / 1440) * 360;

    // 2. Makro Zaman (28 Günlük Ay Evresi Açısı)
    // Yukarıda yazdığımız Ay evresi yüzdesini (0 ile 1 arası) alıyoruz
    const moonPhaseObj = getMoonPhase(simdi.getFullYear(), simdi.getMonth(), simdi.getDate());
    const ayEvreAcisi = moonPhaseObj.phase * 360; // 0° - 360° arası Ay konumu

    return {
        earthMagneticAngle: gunIciManyetikAci, // Gün içindeki 24 saatlik dönüş
        moonOrbitAngle: ayEvreAcisi,           // 28 günlük büyük döngüdeki yeri
        currentPhase: moonPhaseObj
    };
}

function getHemisphere() {
    // Cihazın mevcut zaman dilimini alır (Örn: "Pacific/Auckland" veya "Europe/Istanbul")
    const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    
    // Güney Yarımküre'de sık kullanılan bazı ana bölge isimleri
    const southernKeywords = [
        'Australia', 'Sydney', 'Melbourne', 'Auckland', 'Wellington', 
        'Pacific', 'Santiagos', 'Buenos_Aires', 'Sao_Paulo', 'Johannesburg'
    ];
    
    // Zaman dilimi adında bu kelimelerden biri geçiyorsa Güney Yarımküre'dedir
    const isSouthern = southernKeywords.some(keyword => timeZone.includes(keyword));
    
    return isSouthern ? 'SOUTHERN' : 'NORTHERN';
}


// 🌗 AY EVRESİ HESAPLAMA ÇEKİRDEĞİ
function getMoonPhase(year, month, day) {
    const refDate = new Date(Date.UTC(2000, 0, 6, 18, 14, 0));
    const targetDate = new Date(Date.UTC(year, month, day));
    const diffDays = (targetDate - refDate) / (1000 * 60 * 60 * 24);
    const moonAge = (diffDays % 29.530588853) + (diffDays < 0 ? 29.530588853 : 0);
    return { phase: moonAge / 29.530588853, age: moonAge };
}

// 💓 74 BPM TAŞIYICI MOTOR DÖNGÜSÜ
const bpm = 74;
const pulseInterval = 60000 / bpm; // ~810.81ms (0.8 saniyelik insan kalbi frekansı)

setInterval(() => {
    // 1. Gün ve Saat Oranlarını Hesapla
    const timeData = calculateCosmicTime();
    
    const fireGate = document.querySelector('.fire-gate');
    const waterGate = document.querySelector('.water-gate');
    const airGate = document.querySelector('.air-gate');
    const earthGate = document.querySelector('.earth-gate');


// 💓 TERTEMİZ, AKICI KOZMİK MOTOR DÖNGÜSÜ (setInterval içine yapıştırın)
if (fireGate && waterGate && airGate && earthGate) {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();

    // 1. TÜM KAPILARI BAŞLANGIÇTA SÖNDÜR (Uykudaki elementler loş kalır)
    const gates = [airGate, fireGate, earthGate, waterGate];
    gates.forEach(gate => {
        gate.style.opacity = 0.05;
        gate.style.color = ''; // Orijinal CSS rengine döner
        gate.style.filter = 'none';
    });

    // 2. GÜNEŞ'İN 24 SAATLİK PÜRÜZSÜZ DÖNÜŞÜ (Saat Yönünde Akış)
    // 1440 dakikalık günü 0° - 360° arası akıcı bir açıya çeviriyoruz
    const totalMinutes = (hours * 60) + minutes;
    const sunAngle = (totalMinutes / 1440) * 360; // Gün içindeki tam pozisyon açısı


  let sunGate;
    if (sunAngle >= 45 && sunAngle < 135) { 
        sunGate = airGate; 
    } else if (sunAngle >= 135 && sunAngle < 225) { 
        sunGate = fireGate; 
    } else if (sunAngle >= 225 && sunAngle < 315) { 
        sunGate = earthGate; 
    } else { 
        sunGate = waterGate; 
    }

    // Güneş'in bastığı kapıyı uykudan uyandır ve Güneş Turuncusu yap
    sunGate.style.opacity = 0.6;
    sunGate.style.color = '#ff5e00';

    // 3. AY'IN 28 GÜNLÜK BAĞIMSIZ HAREKETİ VE DİNAMİK METİN KİLİDİ
    const moonData = getMoonPhase(now.getFullYear(), now.getMonth(), now.getDate());
    let moonGate;
    let moonTrigram = "☵";
    let moonColor = "#007fff";

        moonTrigram = "☷"; 
        moonColor = "#a855f7"; // Siber Mor

        // 🌕 DOLUNAY: Ateş kapısına gider, Qian Trigramı olur
        moonGate = fireGate;
        moonTrigram = "☰"; 
        moonColor = "#ffffff"; // Siber Beyaz
        moonStatusText = "ATEŞ [DOLUNAY]";
    } else if (moonData.phase >= 0.125 && moonData.phase < 0.375) {
        // 🌓 İLK DÖRDÜN: Hava kapısı
        moonGate = airGate;
        moonTrigram = "☲";
        moonColor = "#00ffff"; // Siyan
        moonStatusText = "HAVA [BÜYÜYEN AY]";
    } else {
        // 🌗 SON DÖRDÜN: Toprak kapısı
        moonGate = earthGate;
        moonTrigram = "☴";
        moonColor = "#ff00ff"; // Macenta
        moonStatusText = "TOPRAK [KÜÇÜLEN AY]";
    }

    // Ay'ın olduğu kapıyı parlat, I Ching sembolünü ve kapı metnini dinamik güncelle!
    moonGate.style.opacity = 0.7;
    moonGate.style.color = moonColor;
    
    // Kapının içindeki metni ve trigramı canlı değiştiriyoruz (Hata payı sıfır)
    const trigramSpan = moonGate.querySelector('.trigram');
    if (trigramSpan) trigramSpan.textContent = moonTrigram;
    
    // Statik yazıyı kaldırıp o anki göksel durumu basıyoruz
    // Bu satır "SU [AY DOLUNAY]" yazısını bugün otomatik olarak "SU [YENİ AY]" yapar!
    const originalText = moonGate.childNodes[2]; 
    if (originalText) {
        // Kapının ismini dinamik olarak evreye kilitler
        if(moonGate === waterGate) waterGate.innerHTML = `<span class="trigram">${moonTrigram}</span> ${moonStatusText} <span class="iching-binary">: | :</span>`;
        if(moonGate === fireGate) fireGate.innerHTML = `<span class="trigram">${moonTrigram}</span> ${moonStatusText} <span class="iching-binary">|:|</span>`;
        if(moonGate === airGate) airGate.innerHTML = `<span class="trigram">${moonTrigram}</span> ${moonStatusText} <span class="iching-binary">||:</span>`;
        if(moonGate === earthGate) earthGate.innerHTML = `<span class="trigram">${moonTrigram}</span> ${moonStatusText} <span class="iching-binary">:::</span>`;
    }

   // 4. ADIM: AKTİF KUTUPLARI SEÇ VE DİNAMİK BURÇ ETİKETLERİNİ ÇAK
    const activeGates = [...new Set([sunGate, moonGate])];
    const currentSunSign = getDynamicSunSign(); // Gerçek zamanlı burç (Başak vb.)

    activeGates.forEach(gate => {
        gate.classList.add('pulse-hit');
        gate.style.opacity = "0.85";
        
        if (gate === sunGate) {
            gate.style.color = '#ff5e00'; // Güneş Turuncusu
            
            // Sabit element isminin yanına o anki gerçek Güneş zodyak burcunu basar!
            const trigramSymbol = gate.className.includes('fire') ? '☲' : (gate.className.includes('air') ? '||:' : ':::');
            gate.innerHTML = `<span class="trigram">${trigramSymbol}</span> ATEŞ [${currentSunSign}]`;
        }
        
        if (gate === moonGate) {
            gate.style.color = '#a855f7'; // Ay Moru
            // Ay zaten kendi fazına göre "SU [YENİ AY]" olarak ismini aşağıda koruyor
        }
    });

}
    // Konsolda senkronizasyon takibi için (Geliştirme aşamasında açabilirsiniz)
    // console.log(`[74 BPM Pulse] Day Cycle Ratio: ${timeData.dayCycle.toFixed(4)}`);



}, pulseInterval);


function getDynamicSabbat(sunSign) {
    // Tarayıcı zaman diliminden Güney Yarımküre kontrolü
    const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const southernKeywords = ['Australia', 'Sydney', 'Auckland', 'Wellington', 'Pacific', 'Sao_Paulo', 'Johannesburg'];
    const isSouthern = southernKeywords.some(keyword => timeZone.includes(keyword));

    // Kuzey Yarımküre için Sabbat haritası
    const northernSabbatMap = {
        "VIRGO (BAŞAK)": "MABON (SONBAHAR EKİNOKSU)",
        "SCORPIO (AKREP)": "SAMHAIN (ATEŞ FESTİVALİ)",
        "AQUARIUS (KOVA)": "IMBOLC (ATEŞ FESTİVALİ)",
        "TAURUS (BOĞA)": "BELTANE (ATEŞ FESTİVALİ)",
        "LEO (ASLAN)": "LUGHNASADH (HASAT FESTİVALİ)",
        "ARIES (KOÇ)": "OSTARA (BAHAR EKİNOKSU)",
        "CANCER (YENGEÇ)": "LITHA (YAZ GÜNDÖNÜMÜ)",
        "CAPRICORN (OĞLAK)": "YULE (KIŞ GÜNDÖNÜMÜ)"
    };

    // Güney Yarımküre için tam tersi (Aynalanmış) Sabbat haritası
    const southernSabbatMap = {
        "VIRGO (BAŞAK)": "OSTARA (BAHAR EKİNOKSU)", // Wellington şu an bunu yaşıyor!
        "SCORPIO (AKREP)": "BELTANE (ATEŞ FESTİVALİ)",
        "AQUARIUS (KOVA)": "LUGHNASADH (HASAT FESTİVALİ)",
        "TAURUS (BOĞA)": "SAMHAIN (ATEŞ FESTİVALİ)",
        "LEO (ASLAN)": "IMBOLC (ATEŞ FESTİVALİ)",
        "ARIES (KOÇ)": "MABON (SONBAHAR EKİNOKSU)",
        "CANCER (YENGEÇ)": "YULE (KIŞ GÜNDÖNÜMÜ)",
        "CAPRICORN (OĞLAK)": "LITHA (YAZ GÜNDÖNÜMÜ)"
    };

    const currentMap = isSouthern ? southernSabbatMap : northernSabbatMap;
    return currentMap[sunSign] || "KOZMİK GEÇİŞ";
}

function getDynamicSunSign() {
    const now = new Date();
    const month = now.getMonth() + 1; // JS'de aylar 0-11 arasıdır
    const day = now.getDate();

    // Astrolojik burç tarih sınırları (2026 ve genel hassasiyet için)
    if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "ARIES (KOÇ)";
    if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "TAURUS (BOĞA)";
    if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return "GEMINI (İKİZLER)";
    if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return "CANCER (YENGEÇ)";
    if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "LEO (ASLAN)";
    if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "VIRGO (BAŞAK)"; // 🌌 ŞU AN AKTİF OLAN
    if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return "LIBRA (TERAZİ)";
    if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return "SCORPIO (AKREP)";
    if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return "SAGITTARIUS (YAY)";
    if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return "CAPRICORN (OĞLAK)";
    if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "AQUARIUS (KOVA)";
    return "PISCES (BALIK)";
}
