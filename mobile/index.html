<script>
if (typeof window.wiccaTimeOffsetMinutes === 'undefined') { window.wiccaTimeOffsetMinutes = 0; }
function bendWiccaTime(mode) {
    if (mode === 'FUTURE') { window.wiccaTimeOffsetMinutes += 120; }
    else if (mode === 'PAST') { window.wiccaTimeOffsetMinutes -= 120; }
    window.now = new Date(new Date().getTime() + (window.wiccaTimeOffsetMinutes * 60 * 1000));

    <script>
// GERÇEK SAATİ BOZMADAN SADECE SİRKADİYEN MOTORU BÜKEN SÜRÜCÜ:
let wiccaTimeOffsetMinutes = 0;

function bendWiccaTime(mode) {
    // 1 sirkadiyen oda periyodu yaklaşık 21.9 dakikadır
    const roomUnit = (typeof roomDurationMinutes !== 'undefined') ? roomDurationMinutes : 21.9;
    
    if (mode === 'NEXT') {
        wiccaTimeOffsetMinutes += roomUnit;
    } else if (mode === 'PREV') {
        wiccaTimeOffsetMinutes -= roomUnit;
    } else if (mode === 'FUTURE') {
        wiccaTimeOffsetMinutes += (roomUnit * 4);
    } else if (mode === 'PAST') {
        wiccaTimeOffsetMinutes -= (roomUnit * 4);
    }

    // Bilgisayarın ana saatini kirletmeden simüle edilmiş bir zaman nesnesi üretiyoruz
    const baseDate = new Date();
    const futureOrPastDate = new Date(baseDate.getTime() + (wiccaTimeOffsetMinutes * 60 * 1000));
    
    // index.html içindeki o saniyede 74 kere atan saati simülasyona kilitliyoruz aga
    if (typeof now !== 'undefined') {
        now = futureOrPastDate;
    } else {

function getExactSolarTimes(lat, lon) {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
    
    // 1. Güneş Sapma Açısı (Declination - δ) Hesabı
    const declination = 23.45 * Math.sin((360 / 365) * (dayOfYear - 80) * Math.PI / 180);
    const decRad = declination * Math.PI / 180;
    const latRad = lat * Math.PI / 180;

    // 2. Gün Batımı Saat Açısı Formülü (Hour Angle - H0)
    // cos(H0) = -tan(Lat) * tan(Dec)
    const cosH0 = -Math.tan(latRad) * Math.tan(decRad);
    
    // Sınır koruması (Kutup dairesi dışı emniyeti)
    let H0 = 90;
    if (cosH0 >= -1 && cosH0 <= 1) {
        H0 = Math.acos(cosH0) * 180 / Math.PI;
    }

    // 3. Gün Uzunluğu Saati (Day Length)
    const dayLength = (24 * H0) / 180;

    // 4. İstanbul Boylam Düzeltmeli Gerçek Öğlen Vakti (Solar Noon)
    // Standart GMT+3 meridyen zaman dilimi düzeltmesi dahil (Yaklaşık 12:20 civarı)
    const solarNoon = 12 - (lon / 15) + 2; 

    // 5. Milimetrik Gün Doğumu ve Gün Batımı Zamanları (Ondalık Saat Cinsinden)
    const sunrise = solarNoon - (dayLength / 2);
    const sunset = solarNoon + (dayLength / 2);

    return {
        sunrise: sunrise,      // Örn: 6.32 (06:19)
        sunset: sunset,        // Örn: 19.14 (19:08)
        dayLength: dayLength,  // Örn: 12.82 Saat
        declination: declination
    };
}

                beyazOrbMesh.material.color.set(sunColor); // Sirkadiyen renge bürünür (Altın/Turuncu)
                beyazOrbMesh.material.opacity = 1.0;
                
                siyahOrbMesh.material.color.set('#050505'); // Mutlak ham madde karanlığı
                siyahOrbMesh.material.opacity = 0.2;
            } else {
                // 🌌 GECE PARALELLİĞİ: Beyaz orb solar, siyah orb siber auraya bürünür
                beyazOrbMesh.material.color.set('#333333');
                beyazOrbMesh.material.opacity = 0.1;
                
                siyahOrbMesh.material.color.set(moonColor); // Derin Ay moruna/laciverte bürünür
                siyahOrbMesh.material.opacity = 0.8;
            }
        }
    }
});

    </script>




<script>
// ZAMANI BÜKÜP HESAP MAKİNESİ AKSINA KİLİTLEYEN SÜRÜCÜ MOTORU
//let wiccaTimeOffsetMinutes = 0;

function bendWiccaTime(mode) {
    // 1 Oda periyodu yaklaşık 22 dakikadır
    const roomDuration = (typeof roomDurationMinutes !== 'undefined') ? roomDurationMinutes : 21.9;
    
    if (mode === 'NEXT') {
        wiccaTimeOffsetMinutes += roomDuration;
    } else if (mode === 'PREV') {
        wiccaTimeOffsetMinutes -= roomDuration;
    } else if (mode === 'FUTURE') {
        wiccaTimeOffsetMinutes += (roomDuration * 4); // 4 Oda ileri sar (Hızlı Geçiş)
    } else if (mode === 'PAST') {
        wiccaTimeOffsetMinutes -= (roomDuration * 4); // 4 Oda geri sar
    }

    // Gerçek saati bozmadan simülasyon zamanı üreten siber çekirdek
    const originalDate = new Date();
    const simulatedDate = new Date(originalDate.getTime() + (wiccaTimeOffsetMinutes * 60 * 1000));
    
    // index.html içindeki ana zaman nesnesini büküyoruz
    if (typeof now !== 'undefined') {
        now = simulatedDate;
    } else {
        // Eğer global nesne direkt 'now' değilse simülasyonu ana döngüye yedir
        window.now = simulatedDate;
    }

    // Siber status bardan zorunlu yenileme tetiklemesi fırlatıyoruz
    if (typeof updateCosmicClock === 'function') {
        updateCosmicClock();
    } else if (typeof triggerCircadianPulse === 'function') {
        triggerCircadianPulse();
    }
}
</script>
