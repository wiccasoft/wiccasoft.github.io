<!-- index.html -->
<button onclick="nativeDosyaSeciciAc()">📄 Dosya Seç</button>
<iframe id="pdfViewer"></iframe>

<script>
    // Native tarafı tetikleyen fonksiyon
    function nativeDosyaSeciciAc() {
        if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage('TRIGGER_NATIVE_FILE_PICKER');
        }
    }
    // Seçilen dosyayı iframe içinde göster
    window.onNativeFileSelected = function(dataUrl) {
        document.getElementById('pdfViewer').src = dataUrl;
    };
</script>
