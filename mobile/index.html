<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wicca Voyager Dashboard</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --bg-main: #121212; --bg-card: #1E1E1E; --accent: #007AFF; --text: #FFFFFF; --text-muted: #8E8E93; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg-main); color: var(--text); padding: 15px; }
        h2 { color: var(--accent); border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 0; }
        .card { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .path-bar { background: #262626; padding: 10px; border-radius: 8px; font-size: 13px; color: #30d158; word-break: break-all; margin-bottom: 15px; font-family: monospace; }
        .item { padding: 15px; border-bottom: 1px solid #2d2d2d; display: flex; align-items: center; cursor: pointer; }
        .item:active { background: #2a2a2a; }
        .icon { margin-right: 12px; }
        
        /* 🧭 PUSULA GÖRSEL TASARIMI */
        .compass-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        .compass-disc { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent); position: relative; transition: transform 0.1s linear; background: #262626; }
        .compass-pointer { position: absolute; top: 0; left: 50%; width: 4px; height: 60px; background: #ff3b30; transform: translateX(-50%); border-radius: 2px; }
        .compass-n { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-weight: bold; color: #ff3b30; font-size: 14px; }
        
        /* 🎵 MEDYA OYNATICI */
        audio { width: 100%; margin-top: 10px; border-radius: 8px; }
        #pdfFrame { width: 100%; height: 400px; border: none; margin-top: 15px; display: none; background: #fff; border-radius: 12px; }
        .back-btn { background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 🧭 MODÜL 1: DONANIM PUSULA (COMPASS) -->
    <div class="card compass-container">
        <h2>🧭 Wicca Canlı Pusula</h2>
        <div class="compass-disc" id="compassDisc">
            <div class="compass-n">N</div>
            <div class="compass-pointer"></div>
        </div>
        <p id="compassHeading" style="margin-top: 10px; font-weight: bold; font-family: monospace;">Açı: 0°</p>
    </div>

    <!-- 🎵 MODÜL 2: MEDYA OYNATICI (STREAMING) -->
    <div class="card" id="mediaCard" style="display: none;">
        <h2>🎵 Wicca Medya Oynatıcı</h2>
        <p id="playingFileName" style="font-size: 14px; color: var(--text-muted); word-break: break-all;"></p>
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- 📁 MODÜL 3: C SÜRÜCÜSÜ GEZGİNİ -->
    <div class="card">
        <h2>📁 C Sürücüsü Gezgini</h2>
        <button class="back-btn" onclick="ustKlasoreGit()">⬆ Üst Klasör</button>
        <div id="currentPath" class="path-bar">Dizin taranıyor...</div>
        <div id="fileList" style="background: var(--bg-main); border-radius: 8px; overflow: hidden;"></div>
        <iframe id="pdfFrame"></iframe>
    </div>

    <script>
 let mevcutKlasörYolu = "";

// 🧭 NATIVE TELSİZDEN GELEN DERECEYİ YAKALAYAN TEK VE GERÇEK FONKSİYON
window.onNativeCompassRead = function(heading) {
    if (heading !== null && heading !== undefined) {
        let degrees = Math.round(heading);
        // Telefon diskini jilet gibi döndür
        document.getElementById('compassDisc').style.transform = `rotate(${-degrees}deg)`;
        document.getElementById('compassHeading').innerText = `Yön: ${degrees}° Kuzey`;
    }
};

// 📁 DOSYA GEZGİNİ VE YEREL STREAM MANTIĞI
window.onload = function() {
    setTimeout(() => { klasorOku(""); }, 500);
};

function klasorOku(yol) {
    if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage("READ_DIR|" + yol);
    }
}

function ustKlasoreGit() {
    if (!mevcutKlasörYolu || mevcutKlasörYolu === "/storage/emulated/0") return;
    let parcalar = mevcutKlasörYolu.split('/');
    parcalar.pop();
    klasorOku(parcalar.join('/'));
}

window.onNativeDirectoryRead = function(dosyalar, okunanYol) {
    mevcutKlasörYolu = okunanYol;
    document.getElementById('currentPath').innerText = okunanYol;
    const listeDiv = document.getElementById('fileList');
    listeDiv.innerHTML = '';

    dosyalar.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        
        if (item.isDirectory) {
            itemDiv.innerHTML = `<span class="icon" style="color:#ffcc00">folder</span><strong>${item.name}</strong>`;
            itemDiv.onclick = () => klasorOku(item.path);
        } else {
            let isMp3 = item.name.toLowerCase().endsWith('.mp3');
            let isPdf = item.name.toLowerCase().endsWith('.pdf');
            let icon = isMp3 ? 'audiotrack' : (isPdf ? 'picture_as_pdf' : 'insert_drive_file');
            let iconColor = isMp3 ? '#30d158' : (isPdf ? '#ff3b30' : '#007AFF');

            itemDiv.innerHTML = `<span class="material-icons icon" style="color:${iconColor}">${icon}</span>${item.name}`;
            
            if (isPdf || isMp3) {
                itemDiv.onclick = () => {
                    if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage("READ_FILE|" + item.path + "|");
                    }
                };
            }
        }
        listeDiv.appendChild(itemDiv);
    });
};

window.onNativeFileSelected = function(dataUrl) {
    if (dataUrl.includes("audio/") || dataUrl.includes("data:application/octet-stream")) {
        const player = document.getElementById('audioPlayer');
        document.getElementById('mediaCard').style.display = 'block';
        document.getElementById('pdfFrame').style.display = 'none';
        player.src = dataUrl.replace("application/octet-stream", "audio/mp3"); 
        player.play();
    } else {
        document.getElementById('mediaCard').style.display = 'none';
        const frame = document.getElementById('pdfFrame');
        frame.src = dataUrl;
        frame.style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }
};
    </script>
</body>
</html>
