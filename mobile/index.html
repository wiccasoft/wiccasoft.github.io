<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wicca Dosya Gezgini</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: #121212; color: #fff; }
        h2 { color: #007AFF; border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 0; }
        .path-bar { background: #262626; padding: 10px; border-radius: 8px; font-size: 13px; color: #30d158; word-break: break-all; margin-bottom: 15px; font-family: monospace; }
        .list-container { background: #1E1E1E; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .item { padding: 15px; border-bottom: 1px solid #2d2d2d; display: flex; align-items: center; cursor: pointer; font-size: 15px; }
        .item:last-child { border-bottom: none; }
        .item:active { background: #2a2a2a; }
        .icon { margin-right: 12px; font-size: 18px; }
        .folder { color: #ffcc00; }
        .file { color: #007AFF; }
        #pdfFrame { width: 100%; height: 500px; border: none; margin-top: 15px; display: none; background: #fff; border-radius: 12px; }
        .back-btn { background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>📁 Wicca C Sürücüsü Gezgini</h2>
    <button class="back-btn" onclick="ustKlasoreGit()">⬆ Üst Klasör</button>
    <div id="currentPath" class="path-bar">Dizin taranıyor...</div>
    
    <!-- Klasörler ve Dosyalar Burada Listelenecek -->
    <div id="fileList" class="list-container">Dahili hafıza taranıyor...</div>

    <!-- Seçilen PDF Dosyasını Okuma Alanı -->
    <iframe id="pdfFrame"></iframe>

    <script>
        let mevcutKlasörYolu = "";

        // WebView açıldığı an arka plandaki App.tsx telsizine ilk tarama emrini gönderiyoruz
        window.onload = function() {
            setTimeout(() => { klasorOku(""); }, 500);
        };

        function klasorOku(yol) {
            if (window.ReactNativeWebView) {
                // App.tsx içindeki handleMessage bloğuna sinyal gönderir
                window.ReactNativeWebView.postMessage("READ_DIR|" + yol);
            }
        }

        function ustKlasoreGit() {
            if (!mevcutKlasörYolu || mevcutKlasörYolu === "/storage/emulated/0") {
                alert("Zaten ana dizindesiniz!");
                return;
            }
            let parcalar = mevcutKlasörYolu.split('/');
            parcalar.pop();
            let ustYol = parcalar.join('/');
            klasorOku(ustYol);
        }

        // 📡 React Native katmanından (App.tsx) gelen gerçek klasör listesini yakalayan fonksiyon
        window.onNativeDirectoryRead = function(dosyalar, okunanYol) {
            mevcutKlasörYolu = okunanYol;
            document.getElementById('currentPath').innerText = okunanYol;
            
            const listeDiv = document.getElementById('fileList');
            listeDiv.innerHTML = ''; // Eski verileri temizle

            if (dosyalar.length === 0) {
                listeDiv.innerHTML = '<div class="item">Bu klasör boş.</div>';
                return;
            }

            dosyalar.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                
                if (item.isDirectory) {
                    itemDiv.innerHTML = `<span class="icon folder">📁</span> <strong>${item.name}</strong>`;
                    itemDiv.onclick = () => klasorOku(item.path); // Klasöre basınca içine sız
                } else {
                    itemDiv.innerHTML = `<span class="icon file">📄</span> ${item.name}`;
                    // Eğer dosya bir PDF ise tıklanınca doğrudan okutma emri gönder
                    if (item.name.toLowerCase().endsWith('.pdf')) {
                        itemDiv.onclick = () => {
                            if (window.ReactNativeWebView) {
                                window.ReactNativeWebView.postMessage("READ_FILE|" + item.path);
                            }
                        };
                    }
                }
                listeDiv.appendChild(itemDiv);
            });
        };

        // 📡 App.tsx'ten gelen çözülmüş PDF verisini ekrana jilet gibi basan fonksiyon
        window.onNativeFileSelected = function(dataUrl) {
            const frame = document.getElementById('pdfFrame');
            frame.src = dataUrl;
            frame.style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        };
    </script>
</body>
