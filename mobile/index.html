<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wicca Voyager Terminal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --bg-main: #121212; --bg-card: #1E1E1E; --accent: #007AFF; --text: #FFFFFF; --text-muted: #8E8E93; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg-main); color: var(--text); padding: 15px; }
        h2 { color: var(--accent); border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 0; display: flex; align-items: center; justify-content: space-between; }
        .card { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .path-bar { background: #262626; padding: 10px; border-radius: 8px; font-size: 13px; color: #30d158; word-break: break-all; margin-bottom: 15px; font-family: monospace; }
        .item { padding: 15px; border-bottom: 1px solid #2d2d2d; display: flex; align-items: center; cursor: pointer; }
        .item:active { background: #2a2a2a; }
        .icon { margin-right: 12px; }
        audio { width: 100%; margin-top: 10px; border-radius: 8px; }
        #pdfFrame { width: 100%; height: 500px; border: none; margin-top: 15px; display: none; background: #fff; border-radius: 12px; }
        .back-btn { background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; cursor: pointer; }
        
        /* 🧭 PUSULA STİLLERİ */
        .compass-container { display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
        .compass { width: 120px; height: 120px; border: 4px solid var(--accent); border-radius: 50%; position: relative; background: #1a1a1a; box-shadow: 0 0 15px rgba(0,122,255,0.2); }
        .compass-disc { width: 100%; height: 100%; border-radius: 50%; position: absolute; transition: transform 0.1s ease-out; }
        .needle { width: 4px; height: 50px; background: #ff3b30; position: absolute; top: 10px; left: 58px; transform-origin: bottom center; z-index: 2; }
        .needle-south { width: 4px; height: 50px; background: #fff; position: absolute; bottom: 10px; left: 58px; transform-origin: top center; z-index: 1; }
        .direction-text { font-size: 18px; font-weight: bold; margin-top: 10px; font-family: monospace; color: #30d158; }
    </style>
</head>
<body>

    <!-- 🧭 MODÜL 0: PUSULA (COMPASS) -->
    <div class="card">
        <h2>🧭 Wicca Pusula</h2>
        <div class="compass-container">
            <div class="compass">
                <div class="needle"></div>
                <div class="needle-south"></div>
                <div class="compass-disc" id="compassDisc"></div>
            </div>
            <div class="direction-text" id="directionVal">0° N</div>
        </div>
    </div>

    <!-- 🎵 MODÜL 1: MEDYA OYNATICI (MP3 STREAM) -->
    <div class="card" id="mediaCard" style="display: none;">
        <h2>🎵 Wicca Medya Oynatıcı</h2>
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- 📁 MODÜL 2: C SÜRÜCÜSÜ GEZGİNİ -->
    <div class="card">
        <h2>📁 C Sürücüsü Gezgini</h2>
        <button class="back-btn" onclick="ustKlasoreGit()">⬆ Üst Klasör</button>
        <div id="currentPath" class="path-bar">Dizin taranıyor...</div>
        <div id="fileList" style="background: var(--bg-main); border-radius: 8px; overflow: hidden;"></div>
        <iframe id="pdfFrame"></iframe>
    </div>

    <script>
        let mevcutKlasörYolu = "/storage/emulated/0";

        window.onload = function() {
            setTimeout(() => { klasorOku(mevcutKlasörYolu); }, 500);
            initCompass();
        };

        function klasorOku(yol) {
            mevcutKlasörYolu = yol;
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage("READ_DIR|" + yol);
            }
        }

        function ustKlasoreGit() {
            if (!mevcutKlasörYolu || mevcutKlasörYolu === "/storage/emulated/0") return;
            let parcalar = mevcutKlasörYolu.split('/');
            parcalar.pop();
            klasorOku(parcalar.join('/'));
        }

        window.onNativeDirectoryRead = function(dosyalar, okunanYol) {
            mevcutKlasörYolu = okunanYol;
            document.getElementById('currentPath').innerText = okunanYol;
            const listeDiv = document.getElementById('fileList');
            listeDiv.innerHTML = '';

            if(!dosyalar || dosyalar.length === 0) {
                listeDiv.innerHTML = '<div class="item" style="color:var(--text-muted)">Klasör boş veya erişim izni yok.</div>';
                return;
            }

            dosyalar.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                
                if (item.isDirectory) {
                    itemDiv.innerHTML = `<span class="material-icons icon" style="color:#ffcc00">folder</span><strong>${item.name}</strong>`;
                    itemDiv.onclick = () => klasorOku(item.path);
                } else {
                    let isMp3 = item.name.toLowerCase().endsWith('.mp3');
                    let isPdf = item.name.toLowerCase().endsWith('.pdf');
                    let icon = isMp3 ? 'audiotrack' : (isPdf ? 'picture_as_pdf' : 'insert_drive_file');
                    let iconColor = isMp3 ? '#30d158' : (isPdf ? '#ff3b30' : '#007AFF');

                    itemDiv.innerHTML = `<span class="material-icons icon" style="color:${iconColor}">${icon}</span>${item.name}`;
                    
                    if (isPdf || isMp3) {
                        itemDiv.onclick = () => {
                            if (window.ReactNativeWebView) {
                                window.ReactNativeWebView.postMessage("READ_FILE|" + item.path);
                            }
                        };
                    }
                }
                listeDiv.appendChild(itemDiv);
            });
        };

        window.onNativeFileSelected = function(dataUrl) {
            if (dataUrl.includes("audio/") || dataUrl.includes("data:application/octet-stream")) {
                const player = document.getElementById('audioPlayer');
                document.getElementById('mediaCard').style.display = 'block';
                document.getElementById('pdfFrame').style.display = 'none';
                player.src = dataUrl; 
                player.play();
            } else {
                document.getElementById('mediaCard').style.display = 'none';
                const frame = document.getElementById('pdfFrame');
                frame.src = dataUrl;
                frame.style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
            }
        };

        // 🧭 KÜTÜPHANESİZ HTML5 PUSULA MOTORU
        function initCompass() {
            const disc = document.getElementById('compassDisc');
            const text = document.getElementById('directionVal');
            
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);

            function handleOrientation(event) {
                let heading = event.webkitCompassHeading || event.alpha;
                if (heading === null || heading === undefined) return;
                
                // Android yön kaymasını düzeltmek için ters açı hesaplama
                let headingDegrees = Math.round(360 - heading);
                if(headingDegrees >= 360) headingDegrees -= 360;

                disc.style.transform = `rotate(${headingDegrees}deg)`;
                
                let dir = "N";
                if (heading > 22.5 && heading <= 67.5) dir = "NE";
                else if (heading > 67.5 && heading <= 112.5) dir = "E";
                else if (heading > 112.5 && heading <= 157.5) dir = "SE";
                else if (heading > 157.5 && heading <= 202.5) dir = "S";
                else if (heading > 202.5 && heading <= 247.5) dir = "SW";
                else if (heading > 247.5 && heading <= 292.5) dir = "W";
                else if (heading > 292.5 && heading <= 337.5) dir = "NW";

                text.innerText = `${Math.round(heading)}° ${dir}`;
            }
        }
    </script>
</body>
</html>
