<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png" type="image/png">
    <title>Wiccasoft | Metatron Core Browser</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background-color: #050505; color: #ffffff; display: flex; flex-direction: column; }

        /* 👑 HEADER */
        header { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: space-between; align-items: center; padding: 0 40px; z-index: 10; border-bottom: 1px solid rgba(168, 85, 247, 0.1); }
        .brand-logo { height: 35px; width: auto; }
        nav { display: flex; gap: 25px; }
        nav a { color: #cccccc; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s; }
        nav a:hover { color: #a855f7; }

        /* 🏗️ ANA VİEWPORT */
        .main-viewport { position: absolute; top: 70px; bottom: 50px; left: 0; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; background-color: #050505; }

        /* 🖼️ ORIGINAL SALVADOR: Filtreler çöpe gitti, orijinal renkler geri geldi! */
        .salvador-image { position: absolute; height: 150%; width: auto; top: -50%; object-fit: contain; z-index: 1; }

        /* 🛸 METATRON 3D ÇEKİRDEK: Boyutu tekrar büyüttük, butonların arkasından kurtardık! */
        .metatron-three-iframe-holder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 100vw; height: 100vh; z-index: 2; pointer-events: none; display: flex; justify-content: center; align-items: center; }
        .metatron-iframe { width: 100%; height: 100%; border: none; }

        /* 🌌 SİBERPUNK MASK TABAKASI: Yazıların arkasını karartan o sihirli tül perde! */
        .cyber-dark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(5, 5, 5, 0.4) 20%, rgba(5, 5, 5, 0.85) 80%);
            z-index: 3; /* Resim ve motorun üstüne, yazının altına serdik! */
            pointer-events: none;
        }

        /* 👑 ÖN PLAN KATMANI */
        .hero-content-layer { position: relative; z-index: 4; text-align: center; max-width: 650px; padding: 20px; pointer-events: auto; }

        /* 🎯 BAŞLIK KİLİDİ: Kararmayı önlemek için saf opak renk ve net gölge verdik! */
        h1 { 
            font-size: 3.6rem; 
            font-weight: 900; 
            color: #ffffff; /* Siyahlığı bitiren saf beyaz taban */
            margin-bottom: 15px; 
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.6), 0 4px 10px rgba(0, 0, 0, 0.9); /* Mor parlamalı siber gölge */
        }
        h1 span { color: #a855f7; } /* Kelimenin bir kısmını mor parlatmak için */

        p { font-size: 1.15rem; color: #e2e8f0; margin-bottom: 35px; line-height: 1.6; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9); }

        /* 🕹️ BUTONLAR */
        .btn-container { display: flex; gap: 15px; justify-content: center; }
        .btn { padding: 12px 28px; font-size: 1rem; font-weight: 600; text-decoration: none; border-radius: 8px; transition: all 0.3s ease; }
        .btn-features { background-color: #2563eb; color: white; }
        .btn-features:hover { background-color: #1d4ed8; box-shadow: 0 0 15px rgba(37, 99, 235, 0.6); }
        .btn-download { background: transparent; color: white; border: 1px solid #ffffff; }
        .btn-download:hover { background-color: #ffffff; color: #000000; box-shadow: 0 0 15px rgba(255, 255, 255, 0.6); }

        /* 👣 FOOTER */
        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; background: rgba(5, 5, 5, 0.9); display: flex; justify-content: space-between; align-items: center; padding: 0 40px; font-size: 0.85rem; color: #666666; z-index: 10; border-top: 1px solid rgba(168, 85, 247, 0.05); }
        footer a { color: #888888; text-decoration: none; transition: color 0.3s; }
        footer a:hover { color: #ffffff; }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Wiccasoft Logo" class="brand-logo" />
        <nav>

            <a href="#">about</a>
            <a href="#">contact</a>
        </nav>
    </header>

    <main class="main-viewport">
        <!-- 1. Katman: Orijinal Salvador -->
        <img src="salvador_mundi.jpg" alt="Salvador Mundi Art" class="salvador-image" />
        
        <!-- 2. Katman: Haşmetli Metatron Girdabı -->
        <div class="metatron-three-iframe-holder">
            <iframe src="metatron.html" title="Wiccasoft Metatron Engine" class="metatron-iframe" scrolling="no" allowtransparency="true"></iframe>
        </div>

        <!-- 3. Katman: Yazıyı Okutan Gizli Siber Perde -->
        <div class="cyber-dark-overlay"></div>

        <!-- 4. Katman: Ön Plan Elemanları -->
        <div class="hero-content-layer">
            <h1>All in One <span>Browser</span></h1>
            <p>Browse the world at the speed of light with electron infrastructure</p>
            <div class="btn-container">
                <a href="#" class="btn btn-features">features</a>
                <a href="#" class="btn btn-download">download for desktop</a>
            </div>
        </div>
    </main>

    <footer>
        <div>&copy; 2026 Wiccasoft</div>
        <div>
            <a href="/privacy">Privacy Policy</a>
            <span style="margin: 0 10px;">|</span>
            <a href="#">Terms & Conditions</a>
        </div>
    </footer>

</body>
</html>
