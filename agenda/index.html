<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <!-- 📱 MOBİL UYUMLULUK KALKANI: Küçük kalma sorununu kökten çözer -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Vanilla Calendar</title>

        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="src/css/vanilla-calendar-min.css">
        <script src="src/js/vanilla-calendar-min.js"></script>
    </head>

    <body onload="fadeIn(this)" draggable="false">

<style>
body {
  overflow: hidden;
  margin: 0;
  padding: 0;
  background-color: #0D0D11; /* Siber arka plan */
}

.content {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* 🎯 TAKVİMİ EKRANA GÖRE BÜYÜTME VE YAYMA MOTORU */
.vanilla-calendar {
  width: 100% !important;   /* Genişliği mobile tam yayar */
  box-sizing: border-box;
  background: #16161F !important; /* Alt bar rengiyle uyumlu siber koyuluk */
  border: none !important;
}

/* Kütüphanenin gün hücrelerini mobil parmak basımına uygun büyütebilirsin aga */
.vanilla-calendar .vanilla-calendar-date {
  padding: 12px 0 !important; 
  font-size: 14px !important;
}

.bg {
  position: absolute;
  object-fit: cover;
  width: 100%;
  height: 100%;
  left: 0px;
  top: 0px;
  z-index: -1;
}
</style>

        <div class="content">
            <!-- Üstteki gökyüzü animasyonu veya siber alanı kapsar -->
            <iframe id="sky" src="sky.html" onload="resizeIframe(this)" style="display:none; width:100%; border: 0; overflow: hidden;"></iframe>
            
            <!-- Takvim Alanı -->
            <div id="myCalendar" class="vanilla-calendar" style="display:none; margin-top: auto;"></div>
        </div>

  <script>
window.onload = function() {
    // 🧠 MOBİL EKRAN ORANLAMA DİNAMİĞİ
    // Takvimi en alta yaslayıp kalan tüm üst alanı sky.html siber animasyonuna bırakıyoruz aga
    document.getElementById("sky").style.width = '100%';
    document.getElementById("sky").style.height = (window.innerHeight - 380) + 'px'; // 380px takvime ayrıldı
    
    document.getElementById("myCalendar").style.display = "block";
}

function resizeIframe(obj) {
    obj.style.display = "block";
    // Eğer sky tam ekran olacaksa alt satır kalabilir, yoksa yükseklik yukarıdaki window.onload'dan yönetiliyor
    obj.style.width = '100%';
}
            
window.onresize = function() {
    document.getElementById("sky").style.height = (window.innerHeight - 380) + 'px';
}

window.fadeIn = function(obj) {
    $(obj).toggleClass('bg');
    $(obj).fadeIn(666);
}

function calcTime(offset) {
    d = new Date();
    utc = d.getTime() + (d.getTimezoneOffset() * 60000);
    nd = new Date(utc + (3600000 * offset));
    return nd;
}

let pastDates = true, availableDates = false, availableWeekDays = false
            
let calendar = new VanillaCalendar({
    selector: "#myCalendar", 
    date: new Date(calcTime('+2')),
    todaysDate: new Date(calcTime('+2')),
    months: ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"],
    shortWeekday: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'],
    onSelect: (data, elem) => {
        console.log(data, elem)
    }
})
        </script>
    </body>
</html>
