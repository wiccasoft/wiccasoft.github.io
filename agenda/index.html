<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <!-- 📱 MOBİL UYUMLULUK KALKANI: Küçük kalma sorununu kökten çözer -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>AGENDA</title>

        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="src/css/vanilla-calendar-min.css">
        <script src="src/js/vanilla-calendar-min.js"></script>
    </head>

    <body onload="fadeIn(this)" draggable="false">

<style>
body {
  overflow: hidden;
  margin: 0;
  padding: 0;
  background-color: #0D0D11; /* Siber arka plan */
}

.content {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* 🎯 TAKVİMİN MOBİL GENİŞLEME MOTORU */
.vanilla-calendar {
  width: 100% !important;
  height: 420px !important; /* 👈 Takvimin dikey havuzunu 420px'e çıkardık aga */
  box-sizing: border-box;
  background: #16161F !important;
  border: none !important;
}

/* 🎯 OK/YÖN BUTONLARI (BAYRAKLAR) VE ÜST PANEL OPTİMİZASYONU */
.vanilla-calendar .vanilla-calendar-header {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 12px 16px !important;
  background-color: #0D0D11 !important;
}

/* Gizlenen veya küçük kalan ileri/geri butonlarını görünür ve siber mor yapıyoruz aga */
.vanilla-calendar .vanilla-calendar-btn {
  display: inline-block !important;
  color: #BB86FC !important; /* Ok renkleri mor */
  font-size: 20px !important;  /* Ok boyutları büyütüldü */
  font-weight: bold !important;
  cursor: pointer !important;
  padding: 8px !important;
  z-index: 10 !important;
}

/* 📅 AY VE YIL BAŞLIĞI FONTU (NOVEMBRO 2026) */
.vanilla-calendar .vanilla-calendar-header__label {
  font-size: 18px !important;  /* Başlık fontu büyütüldü */
  font-weight: 700 !important;
  color: #FFFFFF !important;  /* Tam beyaz parlaklık */
  letter-spacing: 1px !important;
}

/* 🗓️ HAFTANIN GÜNLERİ FONTU (DOM, SEG, TER...) */
.vanilla-calendar .vanilla-calendar-week-day {
  font-size: 14px !important;  /* Gün kısaltmaları büyütüldü */
  font-weight: bold !important;
  color: #BB86FC !important;  /* Siber temaya uygun mor font */
}

/* 🔢 AYIN GÜNLERİ (SAYILAR) FONTU */
.vanilla-calendar .vanilla-calendar-date {
  font-size: 16px !important;  /* Sayıların boyutu okunabilir yapıldı */
  font-weight: 500 !important;
  font-family: monospace !important; /* Siber konsol havası için mono font */
}

.bg {
  position: absolute;
  object-fit: cover;
  width: 100%;
  height: 100%;
  left: 0px;
  top: 0px;
  z-index: -1;
}
</style>

        <div class="content">
            <!-- Üstteki gökyüzü animasyonu veya siber alanı kapsar -->
            <iframe id="sky" src="sky.html" onload="resizeIframe(this)" style="display:none; width:100%; border: 0; overflow: hidden;"></iframe>
            
            <!-- Takvim Alanı -->
            <div id="myCalendar" class="vanilla-calendar" style="display:none; margin-top: auto;"></div>
        </div>

  <script>
window.onload = function() {
    document.getElementById("sky").style.width = '100%';
    // Ekran yüksekliğinden takvime ayırdığımız 420px alanı düşüyoruz aga
    document.getElementById("sky").style.height = (window.innerHeight - 420) + 'px'; 
    
    document.getElementById("myCalendar").style.display = "block";
}

window.onresize = function() {
    document.getElementById("sky").style.height = (window.innerHeight - 420) + 'px';
}

function resizeIframe(obj) {
    obj.style.display = "block";
    // Eğer sky tam ekran olacaksa alt satır kalabilir, yoksa yükseklik yukarıdaki window.onload'dan yönetiliyor
    obj.style.width = '100%';
}
            
window.onresize = function() {
    document.getElementById("sky").style.height = (window.innerHeight - 380) + 'px';
}

window.fadeIn = function(obj) {
    $(obj).toggleClass('bg');
    $(obj).fadeIn(666);
}

function calcTime(offset) {
    d = new Date();
    utc = d.getTime() + (d.getTimezoneOffset() * 60000);
    nd = new Date(utc + (3600000 * offset));
    return nd;
}

let pastDates = true, availableDates = false, availableWeekDays = false
            
let calendar = new VanillaCalendar({
    selector: "#myCalendar", 
    date: new Date(calcTime('+2')),
    todaysDate: new Date(calcTime('+2')),
    months: ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"],
    shortWeekday: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'],
    onSelect: (data, elem) => {
        console.log(data, elem)
    }
})
        </script>
    </body>
</html>
