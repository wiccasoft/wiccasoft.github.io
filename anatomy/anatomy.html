<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Siber-Biyolojik Kardiyak Elektrofizyoloji Simülatörü</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>

<script src="metatron.js"></script>
<script src="skeleton.js"></script>
<script src="telemetry.js"></script>

<script>


// ⏱️ Küresel zaman saati tanımı (anatomy.html)
window.metatronClock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    if (window.heartAnimationActive === true) {
        // Delta zaman bazlı 74 BPM hesaplaması
        const delta = window.metatronClock.getDelta();
        window.metatronPulseSpeed = 7.7492 * delta; // 74 BPM için (~1.23Hz * 2π)
        if (typeof window.MetatronEngine === "function") window.MetatronEngine();
    }

    // Render ve Telemetri Yayını
    if (window.renderer && window.scene && window.camera) {
        window.renderer.render(window.scene, window.camera);
        simulasyonParametreleriniTuret(); // Telemetriyi üst panele gönderir
    }
}

// 🧠 1. GLOBAL KİLİTLER VE SİNYAL ALTYAPISI
window.scene = window.scene || null;
window.camera = window.camera || null;
window.renderer = window.renderer || null;

window.currentMv = -90.0;
window.currentOdaRengi = "Kırmızı";
window.vagusBrakeActive = false;

// ⚡ NEURAL WORKER BLOB ENJEKTÖRÜ (74 BPM Güncellemesi)
const workerCode = `
setInterval(() => {
postMessage({
komut: "BİYOLOJİK_TELEMETRİ",
kalp: { mv: -90, renk: "Kırmızı", bpm: 74 }, // 72 değeri 74 olarak güncellendi
});
}, 1000);
`;

const blob = new Blob([workerCode], { type: 'application/javascript' });
const biyoWorker = new Worker(URL.createObjectURL(blob));

biyoWorker.onmessage = function(e) {
    if (e.data && e.data.komut === "BİYOLOJİK_TELEMETRİ") {
        // İleride worker'dan gelen verileri buradaki global hafızaya bağlayacağız tatlım
    }
};


// ⏱️ 1. Küresel zaman ve dinamik süre tanımları (anatomy.html)
window.metatronClock = new THREE.Clock();
window.HEART_CYCLE_MS = 800; // 🎯 İSTEDİĞİNİZ SÜRE (Burayı değiştirince her şey değişir!)

function animate() {
    requestAnimationFrame(animate);

    if (window.heartAnimationActive === true) {
        const delta = window.metatronClock.getDelta();
        
        // DİNAMİK BPM HESABI: 60000ms / 800ms = 75 BPM yapar.
        // Formül: (2 * Math.PI) / (Target_MS / 1000) -> Saniyedeki radyan hızı
        const targetSeconds = window.HEART_CYCLE_MS / 1000;
        const radiansPerSecond = (2 * Math.PI) / targetSeconds;
        
        // Hızı delta zamanı ile çarparak saniyeye sabitliyoruz
        window.metatronPulseSpeed = radiansPerSecond * delta; 
        
        if (typeof window.MetatronEngine === "function") window.MetatronEngine();
    }

    if (window.renderer && window.scene && window.camera) {
        window.renderer.render(window.scene, window.camera);
        simulasyonParametreleriniTuret(); 
    }
}

// 🧪 2. ALGORİTMİK METABOLİK VE ELEMENTER PARAMETRE TÜRETİCİ
function simulasyonParametreleriniTuret() {
    if (!window.METATRON_SPECTRUM_MODEL || !window.chambers) return;

    // 🎯 KUSURSUZ ENTEGRASYON: Sahnede o an en parlak / baskın olan odayı buluyoruz
    let dominantChamber = null;
    let maxWave = -1;

    

    window.METATRON_SPECTRUM_MODEL.forEach((ch) => {
        const mesh = window.chambers[ch.id];
        if (mesh && mesh.userData && mesh.userData.currentWave > maxWave) {
            maxWave = mesh.userData.currentWave;
            dominantChamber = ch;
        }
    });

    if (!dominantChamber) return;

    const waveValue = maxWave;
    const odaRengi = dominantChamber.colorName || "Kırmızı";

    // A. Kuantum Milivolt (EKG) -> Odalar parladıkça aksiyon potansiyeli fırlar
    let ekgMv = -90.0 + (waveValue * 120.0);

    // B. Algoritmik Kan Basıncı (mmHg) -> Kırmızı (Ateş) ve Yeşil (Toprak) odalarında basınç fırlar
    let basincMmHg = 80; 
    if (dominantChamber.id === 1) basincMmHg = Math.round(110 + (waveValue * 10)); // Ateş Akımı
    else if (dominantChamber.id === 8) basincMmHg = Math.round(100 + (waveValue * 20)); // Toprak Sıkıştırması
    else if (dominantChamber.id === 2) basincMmHg = Math.round(85 + (waveValue * 15)); // Hava Dolaşımı

    // C. Oksijen ve pH Yoğunluğu
    let oksijenSaturation = 98.0;
    let kanPh = 7.42;
    if (window.AKTIF_ZAMAN_MODU === "CRITICAL_SHOCK") {
        oksijenSaturation = 92.5 + Math.sin(performance.now() * 0.005) * 1.5;
        kanPh = 7.31; 
    }

    // D. Metabolik Şebeke Şalteri
    let metabolikDurum = "BAZAL REZONANS";
    if (dominantChamber.id === 8) {
        metabolikDurum = "LIVER: GLYCOGENOLYSIS / PANCREAS: GLUCOSE BUFFER";
    }



    // Kardiyorespiratuar Kuplaj (CRC) Algoritması
function calculateMetatronRespiration(heartRate) {
    const idealRatio = 4.0; // Akademik Altın Oran (4:1)
    
    // Anlık solunum hızını kalp ritmine göre hesapla
    let currentRespRate = heartRate / idealRatio; 
    
    // Sol panel ve Sağ panel senkronizasyonu için faz kilitleme (Phase-Locking)
    let dynamicLag = 200; // Baz gecikme (ms)
    let currentRatio = heartRate / 20; // Şu anki durum (3.7)
    
    if (currentRatio !== idealRatio) {
        // Eğer oran 4:1 değilse işlemci yükü ve lag artar!
        let deviation = Math.abs(idealRatio - currentRatio);
        dynamicLag += deviation * 150; // Sapma miktarına göre lag ekle
    }
    
    return {
        targetRespiratoryRate: currentRespRate, // Olması gereken: 18.5
        systemLag: dynamicLag,                  // Matematiksel sapma lagı
        couplingState: currentRatio === idealRatio ? "LOCKED (4:1)" : "ASYNC (3.7:1)"
    };
}


    const metatronMatrix = {
    chambers: {
        purple: { name: "Beyin Kökü", nerve: "CN X", status: "Input Port", voltage: "High" },
        blue: { name: "Parasempatik Fren", nerve: "Plexus Cardiacus", function: "Diastole", status: "Active" },
        red: { name: "Sempatik Gaz", nerve: "Truncus Sympathicus", function: "Systole", status: "Standby" },
        yellow: { name: "Solar Plexus", nerve: "Plexus Coeliacus", output: "ATP / Cellular Energy" },
        orange: { name: "Biyomanyetik Filtre", asset: "Splenic Arter / Fe2+", filtering: true },
        green: { name: "Merkezi Topraklama", asset: "LCA & Pancreas Zinc", groundingLag: "200ms" }
    },
    respiratoryAxial: {
        phrenicNerve: "C3-C5 Spine Connection",
        diaphragmStatus: "Synchronized with Yellow Chamber",
        pulmonaryPlexus: "Connected to Blue/Red Wings"
    }
};

    // 📡 Üst penceredeki (main.html) HUD kontrol paneline Sadece SAF / HAM verileri basıyoruz
    window.parent.postMessage({
        komut: "HUD_PANEL_GUNCELLE",
        ekg: `${ekgMv.toFixed(1)} mV`,
        oksijen: `%${oksijenSaturation.toFixed(1)} SpO2`,
        ph: `${kanPh.toFixed(2)} pH`,
        metabolizma: metabolikDurum,
        frekans: `${dominantChamber.q} Hz`,
        element_id: dominantChamber.id, // Baskın oda ID'sini direkt ham gönderiyoruz
        wave: waveValue
    }, "*");
}

// 🪐 3. KESİNTİSİZ ULTRA-HAFİF ANİMASYON DÖNGÜSÜ (RENDER MATRIX)
function animate() {
    requestAnimationFrame(animate);

    // Bizim o akışkan ve harika kuantum piston motorunu ateşler
    if (window.heartAnimationActive === true && typeof window.MetatronEngine === "function") {
        window.MetatronEngine();
    }

    // 🎯 HAFİZA KÖPRÜSÜ: skeleton.js içindeki sahne elemanlarını yakalayıp jilet gibi çizer
    const activeRenderer = window.renderer || (typeof renderer !== "undefined" ? renderer : null);
    const activeScene = window.scene || (typeof scene !== "undefined" ? scene : null);
    const activeCamera = window.camera || (typeof camera !== "undefined" ? camera : null);

    if (activeRenderer && activeScene && activeCamera) {
        activeRenderer.render(activeScene, activeCamera);
        simulasyonParametreleriniTuret(); // Her kareden sonra telemetriyi üst panele uçurur
    }

    // Çökme engelleyici yedek döngü bağı
    if (typeof window.updateMetatronLoop === "function") {
        window.updateMetatronLoop();
    }
}




// 🛠 4. MOTORU GÜVENLİ BAŞLATMA ŞALTERİ
window.addEventListener('DOMContentLoaded', () => {
    if (typeof initMetatronEngine === "function") {
        initMetatronEngine(); 
    }
    animate();
});
</script>
</body>
</html>
