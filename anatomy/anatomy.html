<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Siber-Biyolojik Kardiyak Elektrofizyoloji Simülatörü</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>

<script>
    // 🧠 1. BIOWORKER'I VE GLOBAL DEĞİŞKENLERİ BAŞLAT
    window.currentMv = -90.0;
    const biyoWorker = new Worker('biyolojik-motor.js');

    // 🪐 2. METATRON VE SAHNE EKOSİSTEMİNİ TEK TIKLA ATEŞLE
    initMetatronEngine();

    // 📡 3. ARKA PLAN İŞLEMCİSİNDEN GELEN ANALİZLERİ OKU
    biyoWorker.onmessage = function(e) {
        if (e.data.komut === "BİYOLOJİK_TELEMETRİ") {
            window.currentMv = e.data.kalp.mv;
            window.currentOdaRengi = e.data.kalp.renk;
            window.vagusBrakeActive = e.data.vagusEffort >= 0.8;
            // Gösterge paneli güncellemelerini de buraya yazabilirsiniz...
        }
    };

    // 🔄 4. O HAFİF VE PÜRÜZSÜZ ÇİZİM DÖNGÜSÜ
    function animate() {
        requestAnimationFrame(animate);

        // metatron.js içinden window nesnesine pasladığımız sahneleri çiziyoruz
        if (window.scene && window.camera && window.renderer) {
            
            // ... [mV verisine göre parçacık şelalenizin dalgalanma veya dikey çizgiye kilitlenme kodları] ...

            window.renderer.render(window.scene, window.camera);
        }
    }
    animate();


    // anatomy.html (veya bio-engine.js) içinde worker mesaj alıcısının sonuna ekleyin:
window.parent.postMessage({
    komut: "EKRAN_GUNCELLE",
    bpm: data.kalp.bpm,
    mv: data.kalp.mv,
    mod: data.sistemModu
}, "*");


</script>
</body>

</html>
