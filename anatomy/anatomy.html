<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Siber-Biyolojik Kardiyak Elektrofizyoloji Simülatörü</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="three.min.js?v=3"></script>
<script src="OrbitControls.js?v=3"></script>
<script src="metatron.js?v=3"></script>
<script src="skeleton.js?v=3"></script>

<script>
// 🧠 1. GLOBAL KİLİTLER VE SİNYAL ALTYAPISI
window.scene = window.scene || null;
window.camera = window.camera || null;
window.renderer = window.renderer || null;

window.currentMv = -90.0;
window.currentOdaRengi = "Kırmızı";
window.vagusBrakeActive = false;

// ⚡ NEURAL WORKER BLOB ENJEKTÖRÜ
const workerCode = `
    setInterval(() => {
        postMessage({
            komut: "BİYOLOJİK_TELEMETRİ",
            kalp: { mv: -90, renk: "Kırmızı", bpm: 72 },
            vagusEffort: 0.2,
            sistemModu: "Denge"
        });
    }, 1000);
`;
const blob = new Blob([workerCode], { type: 'application/javascript' });
const biyoWorker = new Worker(URL.createObjectURL(blob));

biyoWorker.onmessage = function(e) {
    if (e.data && e.data.komut === "BİYOLOJİK_TELEMETRİ") {
        // İleride worker verileri buraya bağlanacak şekerparem
    }
};

// 🧪 2. ALGORİTMİK METABOLİK VE ELEMENTER PARAMETRE TÜRETİCİ
function simulasyonParametreleriniTuret() {
    if (!window.METATRON_SPECTRUM_MODEL || !window.chambers) return;

    let dominantChamber = null;
    let maxWave = -1;

    window.METATRON_SPECTRUM_MODEL.forEach((ch) => {
        const mesh = window.chambers[ch.id];
        if (mesh && mesh.userData && mesh.userData.currentWave > maxWave) {
            maxWave = mesh.userData.currentWave;
            dominantChamber = ch;
        }
    });

    if (!dominantChamber) return;

    const waveValue = maxWave;
    let ekgMv = -90.0 + (waveValue * 120.0);
    let basincMmHg = 80; 
    
    if (dominantChamber.id === 1) basincMmHg = Math.round(110 + (waveValue * 10));
    else if (dominantChamber.id === 8) basincMmHg = Math.round(100 + (waveValue * 20));
    else if (dominantChamber.id === 2) basincMmHg = Math.round(85 + (waveValue * 15));

    let oksijenSaturation = 98.0;
    let kanPh = 7.42;
    if (window.AKTIF_ZAMAN_MODU === "CRITICAL_SHOCK") {
        oksijenSaturation = 92.5 + Math.sin(performance.now() * 0.005) * 1.5;
        kanPh = 7.31; 
    }

    let metabolikDurum = "BAZAL REZONANS";
    if (dominantChamber.id === 8) {
        metabolikDurum = "LIVER: GLYCOGENOLYSIS / PANCREAS: GLUCOSE BUFFER";
    }

    window.parent.postMessage({
        komut: "HUD_PANEL_GUNCELLE",
        ekg: `${ekgMv.toFixed(1)} mV`,
        tansiyon: `${basincMmHg} mmHg`,
        oksijen: `%${oksijenSaturation.toFixed(1)} SpO2`,
        ph: `${kanPh.toFixed(2)} pH`,
        metabolizma: metabolikDurum,
        frekans: `${dominantChamber.q} Hz`,
        element: dominantChamber.id === 1 ? "FIRE" : (dominantChamber.id === 8 ? "EARTH" : (dominantChamber.id === 7 ? "WATER" : "AIR")),
        wave: waveValue
    }, "*");
}

// 🪐 3. TEMİZLENMİŞ KESİNTİSİZ ANİMASYON DÖNGÜSÜ (RENDER MATRIX)
function animate() {
    requestAnimationFrame(animate);

    // 🎯 ÇAKIŞMA TAMAMEN BİTTİ: İki ayrı fonksiyonun birbirini ezmesi engellendi
    if (typeof window.updateMetatronLoop === "function") {
        window.updateMetatronLoop();
    }

    // Üst pencere telemetrisini her karede besle
    simulasyonParametreleriniTuret();
}

// 🛠 4. MOTORU GÜVENLİ BAŞLATMA ŞALTERİ
window.addEventListener('DOMContentLoaded', () => {
    if (typeof window.initSkelaton === "function") {
        window.initSkelaton();
    }
    if (typeof window.initMetatronEngine === "function") {
        window.initMetatronEngine();
    }
    animate();
});
</script>
</body>
</html>
