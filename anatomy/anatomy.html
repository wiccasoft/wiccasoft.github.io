<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Siber-Biyolojik Kardiyak Elektrofizyoloji Simülatörü</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="/anatomy/three.min.js"></script>
<script src="/anatomy/OrbitControls.js"></script>

<script src="/anatomy/metatron.js"></script>

<script src="/anatomy/skeleton.js"></script>


<script>
       // 🧠 1. GLOBAL DEĞİŞKENLER VE BİYO-WORKER (BLOB KİLİDİ - file:// UYUMLU)
window.currentMv = -90.0;
window.currentOdaRengi = "Kırmızı";
window.vagusBrakeActive = false;

// Worker kodunu doğrudan string olarak belleğe alıyoruz (Dosya okuma zorunluluğunu kaldırır)
const workerCode = `
    // Buraya neural-worker.js dosyanın içindeki tüm JavaScript kodlarını KOPYALAYIP YAPIŞTIR.
    // Örnek taslak (sen kendi kodunu koy):
    setInterval(() => {
        postMessage({
            komut: "BİYOLOJİK_TELEMETRİ",
            kalp: { mv: -90, renk: "Kırmızı", bpm: 72 },
            vagusEffort: 0.2,
            sistemModu: "Denge"
        });
    }, 1000);
`;

// Tarayıcıyı kandırıp harici dosya değilmiş gibi bellekten sanal URL üretiyoruz
const blob = new Blob([workerCode], { type: 'application/javascript' });
const biyoWorker = new Worker(URL.createObjectURL(blob));

        // 🧪 3. ALGORİTMİK METABOLİK VE KARDİYO PARAMETRE TÜRETİCİ (TRUVA ATININ BEYNİ)
        function simulasyonParametreleriniTuret() {
            // metatron.js içindeki o an dönen canlı oda verilerini okuyoruz
            if (window.mevcutOdaSirasi === undefined || !window.RENK_TAYFI_SPEKTRUMU) return;
            
            const metatronState = window.RENK_TAYFI_SPEKTRUMU[window.mevcutOdaSirasi];
            if (!metatronState) return;

            let ekgMv = window.currentMv; // Worker'dan gelen gerçek milivolt
            let odaRengi = window.currentOdaRengi;

            // A. Algoritmik Kan Basıncı (mmHg) Türetimi
            let basincMmHg = 80; // Taban diyastolik basınç
            if (odaRengi === "Yeşil") basincMmHg = 120; // Kasılma (Sistol) anı
            else if (odaRengi === "Sarı") basincMmHg = 100; // Depolarizasyon ivmesi

            // B. Algoritmik Oksijen (%SpO2) ve pH Türetimi
            let oksijenSaturation = 98.0;
            let kanPh = 7.42;

            if (window.AKTIF_ZAMAN_MODU === "CRITICAL_SHOCK") {
                // Savaş ya da kaç anında oksijen hızla tükenir, laktik asit yüzünden pH düşer (Asidoz)
                oksijenSaturation = 92.5 + Math.sin(performance.now() * 0.005) * 1.5;
                kanPh = 7.31; 
            }

            // C. Karaciğer ve Pankreas Metabolik Pathway Şalteri (YEŞİL ODA TOPRAKLAMASI)
            let metabolikDurum = "BAZAL DENGELENME";
            if (odaRengi === "Yeşil") {
                metabolikDurum = "LIVER: GLYCOGENOLYSIS / PANCREAS: GLUCOSE BUFFER";
            }

            // Üst pencereye (main.html / HUD panele) akademinin eriyeceği o 4 doğrusal datayı fırlatıyoruz
            window.parent.postMessage({
                komut: "HUD_PANEL_GUNCELLE",
                ekg: `${ekgMv.toFixed(1)} mV`,
                tansiyon: `${basincMmHg} mmHg`,
                oksijen: `%${oksijenSaturation.toFixed(1)} SpO2`,
                ph: `${kanPh.toFixed(2)} pH`,
                metabolizma: metabolikDurum,
                frekans: metatronState.frekans
            }, "*");
        }

        // 🪐 4. ULTRA-HAFİF ANİMASYON DÖNGÜSÜ
        function animate() {
            requestAnimationFrame(animate);


             if (window.heartAnimationActive === true && typeof window.MetatronEngine === "function") {
        window.MetatronEngine();
    }

      // 📺 Ekranı tazeleyen ve sahneyi çizen nihai emrin
    if (typeof renderer !== "undefined" && renderer && scene && camera) {
        renderer.render(scene, camera);
    }

            // A. Tüm ağır çizim, şelale ve parça hesaplamaları metatron.js içinde pürüzsüzce akar
            window.updateMetatronLoop = window.updateMetatronLoop || function() {
    // Motorlar tamamen yüklenene kadar bu boş kareyi döner, çökmeyi engeller.
};
            // B. Çizilen her kareden sonra, o tek kaynaktan (Metatron'dan) 4 canlı parametreyi algoritmik türet
            if (window.scene && window.camera && window.renderer) {
                simulasyonParametreleriniTuret();
            }
        }

        // 🛠 5. MOTORU TEK KEZ BAŞLAT
        window.addEventListener('DOMContentLoaded', () => {
            initMetatronEngine(); 
            animate();
        });
</script>
</body>
</html>
