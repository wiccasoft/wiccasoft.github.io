<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Siber-Biyolojik Kardiyak Elektrofizyoloji Simülatörü</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="./three.min.js"></script>
<script src="./OrbitControls.js"></script>
<script src="./metatron.js"></script>

<script>
    // 🧠 1. BIOWORKER'I VE GLOBAL DEĞİŞKENLERİ BAŞLAT
    window.currentMv = -90.0;
    const biyoWorker = new Worker('biyolojik-motor.js');

    // 🪐 2. METATRON VE SAHNE EKOSİSTEMİNİ TEK TIKLA ATEŞLE
    initMetatronEngine();


// 🧠 1. GLOBAL DEĞİŞKENLER VE BİYO-WORKER
        window.currentMv = -90.0;
        window.currentOdaRengi = "Kırmızı";
        window.vagusBrakeActive = false;
        const biyoWorker = new Worker('neural-worker.js');

        // 📡 2. VERİ HATTINI İÇERİYE ALARAK "data is not defined" HATASI ÇÖZÜLDÜ
        biyoWorker.onmessage = function(e) {
            if (e.data.komut === "BİYOLOJİK_TELEMETRİ") {
                const data = e.data;
                window.currentMv = data.kalp.mv;
                window.currentOdaRengi = data.kalp.renk;
                window.vagusBrakeActive = data.vagusEffort >= 0.8;

                // 📯 ÜST PENCEREYE MESAJ KÖPRÜSÜ
                window.parent.postMessage({
                    komut: "EKRAN_GUNCELLE",
                    bpm: data.kalp.bpm,
                    mv: data.kalp.mv,
                    mod: data.sistemModu
                }, "*");
            }
        };

        // 🔄 3. ÇİZİM DÖNGÜSÜ (Parçacık Manipülasyonu)
        function animate() {
            requestAnimationFrame(animate);
            if (window.scene && window.camera && window.renderer) {
                const dunyaOmurgaSelalesi = window.scene.getObjectByName("OMURGA_SELALESI");
                if (dunyaOmurgaSelalesi) {
                    const positions = dunyaOmurgaSelalesi.geometry.attributes.position.array;
                    const colors = dunyaOmurgaSelalesi.geometry.attributes.color.array;
                    const zaman = performance.now() * 0.001;

                    // ⚡ mV bazlı dinamik parçacık hareketi
                    let sacilimGucu = Math.max(0.1, (window.currentMv + 90) * 0.02);
                    for (let i = 0; i < positions.length; i += 3) {
                        let id = i / 3;
                        let sin = Math.sin(zaman * 6 + id * 0.1);
                        positions[i] += sin * 0.01 * sacilimGucu;
                        positions[i + 2] += Math.cos(zaman * 6 + id * 0.1) * 0.01 * sacilimGucu;
                        positions[i + 1] -= 0.005; 
                        if (positions[i + 1] < -1.0) positions[i + 1] = 1.0;
                        // Renk eşleştirmeleri...
                    }
                    dunyaOmurgaSelalesi.geometry.attributes.position.needsUpdate = true;
                    dunyaOmurgaSelalesi.geometry.attributes.color.needsUpdate = true;
                }
                window.renderer.render(window.scene, window.camera);
            }
        }

        // 🪐 4. MOTORU TEK KEZ BAŞLAT
        window.addEventListener('DOMContentLoaded', () => {
            initMetatronEngine(); 
            animate();
        });
    </script>
</body>
</html>
