    const tabSal = document.getElementById("tabSalvador");

    if (targetTab === 'salvador') {

//https://www.imaios.com/en/e-anatomy/anatomical-structures/cardiac-plexus-1557867012#
window.mainTargetFPS = 25;

function toggleMainPerformanceMode() {
    const btn = document.getElementById('perf-toggle-btn');
    const iframe = document.getElementById("anatomy-engine");
    if (!btn || !iframe || !iframe.contentWindow) return;

    if (window.mainTargetFPS === 60) {
        // ECO MOD SİNYALİ
        window.mainTargetFPS = 25;
        btn.innerText = "25 FPS (ECO)";
        btn.style.color = "#99ff33"; // Çevre dostu eko yeşili
        btn.style.borderColor = "#99ff33";
        btn.style.boxShadow = "0 0 8px rgba(153,255,51,0.3)";
        
        // Iframe içerisindeki telemetry.js ve metatron.js'i tetikle
        iframe.contentWindow.postMessage({ komut: "SET_TARGET_FPS", fps: 25 }, "*");
    } else {
        // TURBO MOD SİNYALİ
        window.mainTargetFPS = 60;
        btn.innerText = "60 FPS (TURBO)";
        btn.style.color = "#33ffff"; // Siber punk neon mavi
        btn.style.borderColor = "#33ffff";
        btn.style.boxShadow = "0 0 8px rgba(51,255,255,0.3)";
        
        // Iframe içerisindeki telemetry.js ve metatron.js'i tetikle
        iframe.contentWindow.postMessage({ komut: "SET_TARGET_FPS", fps: 60 }, "*");
    }
}

window.addEventListener("message", (event) => {
    if (!ALLOWED_ORIGIN_REGEX.test(event.origin) && event.origin !== "null") return;


    if (event.data && event.data.komut === "HUD_PANEL_GUNCELLE") {
        const telemetryBox = document.getElementById("telemetryScreen");

            // 1. ZAMAN VE SAF SAYISAL VERİ ANALİZİ
            const simdi = performance.now();
            const deltaTime = (simdi - window.lastFrameTime) / 1000; 
            window.lastFrameTime = simdi;

            // 🌀 1 mV = 40 Hz KUTSAL REZONANS MOTORU
            // anatomy.html'den gelen canlı wave dalgasını (0.0 ile 1.0 arası) baz alıyoruz
            const liveWave = parseFloat(event.data.wave) || 0.0;

            // 1. Kalp kasıldıkça voltaj jilet gibi tam +30.0 mV sınırına tavan yapar
            let currentEkgMv = liveWave * 30.0; 

            // 2. Senin o efsane dâhi formülün: Her 1 mV için frekansı 40 Hz kırbaçlıyoruz!
            // Voltaj 30 mV olduğunda frekans tam 1200.00 Hz (BXN) olarak mühürlenir.
            let currentMetatronHz = currentEkgMv * 40.0; 


            // HUD Ekranı için formatlama (Örn: EKG: 30.0 mV | FQ: 1200.00 Hz)
            let formatEkg = `${currentEkgMv.toFixed(1)} mV`;
            let formatHz = `${currentMetatronHz.toFixed(2)} Hz`;

            // 2. SAĞ TABLO KİLİTLİ DINAMİK VERİLER
            let dynamicBPM = 74.0 + (Math.sin(liveWave * Math.PI) * 1.5);
            let realMetatronFQ = 221.21 + (liveWave * 15.6);

            // 3. SOLUNUM MOTORU (4:1 Altın Oran Korumalı)
            window.metatronPhrenicClock += deltaTime * (1.0 + (liveWave - 0.5) * 0.15);
            const period = 3.8; 
            const phaseProgress = (window.metatronPhrenicClock % period);

            let breathHtml = "";
            let scaleFactor = 0.5;
        // 2. 🫀 ANLIK POMPALANAN (Piston Hareketi)
        // Sabit duran strokeVol yerine dalgayı çarparak kalbin içindeki kanın boşalma anını simüle ediyoruz.
        // Kalp kasıldığında (liveWave = 1) tam 70 mL damara fırlar, gevşediğinde 0'a doğru çekilir.
        let targetStrokeVol = parseFloat(window.LIVE_STROKE_VOLUME || 70.0);
        let anlikAtimMiktari = liveWave * targetStrokeVol


        // 3. ⏱️ 1 DAKİKADA 5 LİTREYE KOŞAN KÜRESEL SAYAÇ
        // Her milisaniyede akan kanı debiye (L/dk) göre üst üste biriktiriyoruz
        let cardOutput = parseFloat(window.LIVE_CARDIAC_OUTPUT || 5.0);
        window.KUMULATIF_KAN_HACMI += (cardOutput * 1000 / 60) * deltaTime; // mL cinsinden sürekli ekler

            // ÖRNEK ANALİZ: Zaman dilimi içindeki akış (Litre/saniye hesabı veya FPS ölçümü için)
            // İki güncelleme arası geçen süre (deltaTime) çok uzunsa kare atlaması (stuttering) tespiti yapabilirsiniz.
            const anlikAkisHizi = (cardOutput / 60) * deltaTime; // Bu frame'de akan tahmini litre
             // 4. 🔄 5 LİTREDE BİR TÜM VÜCUDU GEZME KİLİDİ
        // Kan miktarı 5000 mL (5 Litre) olduğunda tam 1 dakika geçmiş ve tüm vücut dönmüş demektir.
        if (window.KUMULATIF_KAN_HACMI >= 5000) {
            window.KUMULATIF_KAN_HACMI -= 5000; // Sayacı sıfırlamadan devret
            window.VUCUT_DOLAŞIM_TURU += 1;    // Bütün vücudu dolaşma turunu 1 artır
        }

        // Toplam akan kanı Litre formatına çeviriyoruz
        let toplamAkanLitre = (window.VUCUT_DOLAŞIM_TURU * 5.0) + (window.KUMULATIF_KAN_HACMI / 1000);

            if (phaseProgress < (period / 2)) {
                breathHtml = '<span style="color: #ffaa00; font-weight: bold; text-shadow: 0 0 5px #ffaa00;">INHALATION</span>';
                scaleFactor = phaseProgress / (period / 2);
            } else {
                breathHtml = '<span style="color: #ffaa00; font-weight: bold; text-shadow: 0 0 5px #ffaa00;">EXHALATION</span>';
                scaleFactor = 1.0 - ((phaseProgress - (period / 2)) / (period / 2));
            }

            // 4. CRC KİLİTLENME DEĞERLERİ
            let liveResp = (dynamicBPM / 4.0) + (scaleFactor - 0.5) * 1.8; 
            let actualPRQ = dynamicBPM / liveResp;
            
            const IDEAL_PRQ = 4.0;
            let deviation = Math.abs(IDEAL_PRQ - actualPRQ);

            const BASE_GREEN_LAG = 198;
            let calculatedLag = BASE_GREEN_LAG + (deviation * 143.5);
            let addedLag = Math.round(calculatedLag - BASE_GREEN_LAG);

            let statusColor = "#ff00ff"; 
            let statusText = `ASYNC (+${addedLag}ms LAG)`;

// ⚡ 5. METABOLİZMA PARÇALAMA MOTORU (Kalp Atışına Duyarlı Glikojen Tüketimi)

try {

} catch (e) {

}

           // 🎨 6. ELEMENT YÖNETİMİ (Mevcut kodunuz aynen kalıyor)
            let rawElementId = parseInt(event.data.element_id) || 1;
            let rawMetabolizma = event.data.metabolizma || "";
            let liveElement = "AIR"; 
            if (rawElementId === 8 || rawMetabolizma.includes("PANCREAS") || rawMetabolizma.includes("LIVER")) {
