// DOBLE VORTEX DATA SET
// ============================================================================
class KuantumPaketi {
    constructor(kaynakMesh, hedefMesh, renk, tip, layer) { // 🔑 tip ve layer eklendi
        this.kaynak = kaynakMesh;
        this.hedef = hedefMesh;
        this.ilerleme = 0.0;
        this.tip = tip;       // 🔑 "A" veya "B" mühürü içeri alındı
        this.layer = layer;   // 🔑 "UP", "CENTER", "DOWN" katmanı çakıldı

        paketSayaci++; 
        this.uuid = paketSayaci; 
        
        const pGeom = new THREE.SphereGeometry(0.03, 8, 8); // Görsel netlik için parçacık hafif küçültüldü
  // 🔑 WebGL KATMAN MÜHÜRÜ: neonRengi hatasını çözer, zıt akımları Turkuaz ve Pembe olarak ayırır!
        const pMat = new THREE.MeshBasicMaterial({ 
            color: this.tip === "A" ? 0x00ffff : 0xff0055, // A akımı Turkuaz, B akımı Pembe parlar
            transparent: true, opacity: 0.95,
            depthWrite: false, // Zıt izlerin birbirini derinlik katmanında maskelemesini engeller
            blending: THREE.AdditiveBlending // Çarpışma anında element haçında plazma parlaması yaratır
        });
        this.mesh = new THREE.Mesh(pGeom, pMat);
        
        // İlk doğuş pozisyonu
        this.mesh.position.copy(this.kaynak.position);
        
        // 🚀 3 AŞAMALI KAYNAK ANTENİ: Katmanına göre dikey eksende ilk kırılmayı başlatır
        if (this.layer === "UP") this.mesh.position.y += 0.08;
        if (this.layer === "DOWN") this.mesh.position.y -= 0.08;

        KuantumKafesi.add(this.mesh);
    }

 guncelle(delta) {
        // 🚀 ASYMMETRIC FIELD SPEEDS: Stream A runs standard, Stream B spins with a fractional velocity offset
        let hizKatsayisi = this.tip === "A" ? 2.5 : 3.2;
        let dalgaliIvme = 1.0 + Math.sin(this.ilerleme * Math.PI) * hizKatsayisi;
        this.ilerleme += delta * dalgaliIvme;

        let merkezPos = new THREE.Vector3().lerpVectors(this.kaynak.position, this.hedef.position, Math.min(this.ilerleme, 1.0));
        
        // 🚀 RADIAL ORBIT OFFSET: Broadens Stream A outward and tightens Stream B inward to separate tracks completely
        let genlikKatsayisi = this.tip === "A" ? 0.38 : 0.24;
        let dalgaBoyu = Math.sin(this.ilerleme * Math.PI) * genlikKatsayisi; 
        let yonKatsayisi = this.tip === "A" ? 1 : -1;

        let cekimKuvveti = 1.0 - Math.sin(this.ilerleme * Math.PI) * 0.45;
        dalgaBoyu *= cekimKuvveti;

        let layerKavisY = 0;
        if (this.layer === "UP") layerKavisY = Math.sin(this.ilerleme * Math.PI) * 0.15 * cekimKuvveti;
        if (this.layer === "DOWN") layerKavisY = -Math.sin(this.ilerleme * Math.PI) * 0.15 * cekimKuvveti;

        this.mesh.position.set(
            merkezPos.x + Math.cos(this.ilerleme * Math.PI * 2) * dalgaBoyu * yonKatsayisi,
            merkezPos.y + layerKavisY,
            merkezPos.z + Math.sin(this.ilerleme * Math.PI * 2) * dalgaBoyu * yonKatsayisi
        );
    }
}

// ============================================================================
let globalDönüşHızı = 0.005; 
const hedefFPS = 25;
const kareAralığı = 1000 / hedefFPS; // 40ms
let sonKareZamanı = performance.now();

function animate() {
    requestAnimationFrame(animate);

    // 🛠 25 FPS Zaman Kilidi
    const şimdikiZaman = performance.now();
    const geçenSüre = şimdikiZaman - sonKareZamanı;
    if (geçenSüre < kareAralığı) return; 

    sonKareZamanı = şimdikiZaman - (geçenSüre % kareAralığı);
    const sabitDelta = 1 / hedefFPS; 

    const beyazKutupObj = KuantumKafesi.getObjectByName("BEYAZ_KUTUP_ODASI");
    const siyahKutupObj = KuantumKafesi.getObjectByName("SIYAH_KUTUP_ODASI");

    // 2. ÇİFT RODİN DÖNGÜSÜ (A/B KANALLARI)
    if (beyazKutupObj && siyahKutupObj) {
        
        // === ⚡ AC FREKANS MODÜLASYONU VE TESLA RİTİM KİLİDİ ===
        // 🔑 `aktifPaketler.length === 0` prangası tamamen kırıldı!
        const zamanSinyali = performance.now() * 0.005;
        const ateslemeRitmi = Math.floor(zamanSinyali * 20) % 8 === 0;

        // GÜVENLİK FİLTRESİ: Bellek taşmasını engellemek için havada en fazla 36 paket tutar
          if (ateslemeRitmi && aktifPaketler.length < 36) {
            let kaynakA = spheres.find(o => o.id === rodinDizisiA[aktifIndexA]);
            let hedefA = spheres.find(o => o.id === rodinDizisiA[(aktifIndexA + 1) % rodinDizisiA.length]);
            let kaynakB = spheres.find(o => o.id === rodinDizisiB[aktifIndexB]);
 // 🔑 GERÇEK REVERSE PUMP: B mermisinin hedefini matematiksel olarak geriye doğru okutur
            let hedefB = spheres.find(o => o.id === rodinDizisiB[(aktifIndexB - 1 + rodinDizisiB.length) % rodinDizisiB.length]);

            let meshKA = KuantumKafesi.getObjectByName(kaynakA.name), meshHA = KuantumKafesi.getObjectByName(hedefA.name);
            let meshKB = KuantumKafesi.getObjectByName(kaynakB.name), meshHB = KuantumKafesi.getObjectByName(hedefB.name);

  if (meshKA && meshHA && meshKB && meshHB) {
                // 🔑 Clear of any foreign artifacts, pure symmetric AC multi-vortex firing
 // ⚡ MULTI-LAYER ZIT FAZLI AC ATESLEME MOTORU
                [ { s: meshKA, h: meshHA, d: hedefA, t: "A" }, { s: meshKB, h: meshHB, d: hedefB, t: "B" } ].forEach(p => {
                    // 🔑 FAZ SENSÖRÜ: B akımına 4 karelik (180 derece) faz farkı ekleyerek renk çakışmasını ve dalga nötrlemesini kökten kırar!
                    const fazRölesi = p.t === "A" ? 0 : 4;
                    const kanalRitmi = (Math.floor(zamanSinyali * 20) + fazRölesi) % 8 === 0;

         if (kanalRitmi) {
                        // 🔑 SİSTEMİ ÖZGÜR BIRAKAN SAF 4 SATIRLI BİNARY GEZEGEN MOTORU
                        let katman1 = p.t === "A" ? "UP" : "DOWN";
                        let paket1 = new KuantumPaketi(p.s, p.h, p.d.color, p.t, katman1); paket1.hedefId = p.d.id; aktifPaketler.push(paket1);
                        let katman2 = p.t === "A" ? "DOWN" : "UP";
                        let paket2 = new KuantumPaketi(p.s, p.h, p.d.color, p.t, katman2); paket2.hedefId = p.d.id; aktifPaketler.push(paket2);
                        
                        // İndeksler sadece ilgili kanal gerçekten ateşlendiğinde bağımsız kayar
                        if (p.t === "A") aktifIndexA = (aktifIndexA + 1) % rodinDizisiA.length;
                        if (p.t === "B") aktifIndexB = (aktifIndexB - 1 + rodinDizisiB.length) % rodinDizisiB.length;
                    }
                });

                // 🔑 SEKANSI SERBEST BIRAK: Paketler fırlatıldığı AN indeksler bağımsız kayar!

            }
        }

        // Parçacık Güncelleme (Çift dikiş atlama hatası temizlendi)
        for (let i = aktifPaketler.length - 1; i >= 0; i--) {
            let paket = aktifPaketler[i];
            paket.guncelle(sabitDelta); 
     if (paket.ilerleme >= 1.0) {
                let hData = spheres.find(o => o.id === paket.hedefId);
                if (hData) {
                    let hMesh = KuantumKafesi.getObjectByName(hData.name);
                    if (hMesh) { 
                        hMesh.material.emissiveIntensity = 4.0; hMesh.material.opacity = 1.0; 
                        
                        // 🔑 İŞTE O ANTINODE MOTORU: Tam söylediğin 3 ve 6 kutupsal rezonansını açar!
                        // A akımı (Turkuaz) hedefe vardığında 3 (Beyaz) düğüm kutbunu şarj eder ve parlatır.
                        if (paket.tip === "A") {
                            let pole3 = KuantumKafesi.getObjectByName("BEYAZ_KUTUP_ODASI");
                            if (pole3) pole3.material.emissiveIntensity = 5.0;
                        }
                        // B akımı (Pembe) hedefe vardığında 6 (Siyah) antinode kutbunu tetikler ve parlatır.
                        if (paket.tip === "B") {
                            let pole6 = KuantumKafesi.getObjectByName("SIYAH_KUTUP_ODASI");
                            if (pole6) pole6.material.emissiveIntensity = 5.0;
                        }
                    }
                }
                KuantumKafesi.remove(paket.mesh);
                aktifPaketler.splice(i, 1); 
            }
        }
    }

    // 3. DEŞARJ DÖNGÜSÜ
 spheres.forEach(s => {
        let odaMesh = KuantumKafesi.getObjectByName(s.name);
        if (odaMesh && !s.isPole) {
            // 🔑 RAPID DECHARGE OVERRIDE: Forces the node to dump its energy instantly after a hit
            // This stops uniform glowing and forces explicit rhythmic neon strobing!
            if (odaMesh.material.emissiveIntensity > 0.3) odaMesh.material.emissiveIntensity -= sabitDelta * 28.0;
            if (odaMesh.material.opacity > 0.15) odaMesh.material.opacity -= sabitDelta * (odaMesh.material.opacity > 0.35 ? 1.8 : 3.5);
        }
    });

 // === 🌀 NEON TRAIL (PLAZMA İZ BIRAKMA) MOTORU ===
    // 🔑 KOZMİK SİYAH AÇILIŞI: Beyaz Alpha katmanını anında yırtar, gluonları kapatmadan arkadaki derin karanlık matrisi açar!
    if (renderer.autoClear === true || performance.now() < 2000) {
        renderer.setClearColor(0x000000, 1);
        renderer.clear(); // İlk karelerde beyaz buffer katmanını tamamen kazır ve simsiyah yapar
        renderer.autoClear = false;
    }
    
    // Her karede eski neon izlerini %5 sönümleyerek havada asılı kalan Yaşam Çiçeği tüplerini örer
    renderer.setClearColor(0x000000, 0.05);
    renderer.clearColor(); 
    renderer.clearDepth(); // 3D derinlik tamponunu sıfırlayarak GPU'yu tamamen rahatlatır

    if (typeof controls !== 'undefined') controls.update();
    renderer.render(scene, camera);
} // 🔑 animate fonksiyon kapanışı

// 🔑 GÜVENLİ RESIZE (Tekil ve dışarıda)
window.addEventListener('resize', () => {
    const yeniAspect = window.innerWidth / window.innerHeight;
    camera.left = -d * yeniAspect; camera.right = d * yeniAspect;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();

</script>
</body>
