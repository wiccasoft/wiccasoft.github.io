// DOBLE VORTEX DATA SET
// ============================================================================
class KuantumPaketi {
    constructor(kaynakMesh, hedonMesh, renk) {
        this.kaynak = kaynakMesh; this.hedef = hedonMesh;
        this.ilerleme = 0.0; this.tip = "A"; this.hedefId = null;
        // Parçacık geometrisi ve materyali
        const pGeom = new THREE.SphereGeometry(0.04, 8, 8);
        const pMat = new THREE.MeshBasicMaterial({ color: renk });
        this.mesh = new THREE.Mesh(pGeom, pMat);
        this.mesh.position.copy(this.kaynak.position);
        KuantumKafesi.add(this.mesh);
    }
    guncelle(delta) {
        // 🚀 KEPPLER İVMELENMESİ & 🌀 SWASTIKA MİKRO SARMALI
        let dinamikIvme = 1.8 + Math.sin(this.ilerleme * Math.PI) * 1.5;
        this.ilerleme += delta * dinamikIvme;
        let merkezPos = new THREE.Vector3().lerpVectors(this.kaynak.position, this.hedef.position, Math.min(this.ilerleme, 1.0));
        let dalgaBoyu = Math.sin(this.ilerleme * Math.PI) * 0.12; 
        let yonKatsayisi = this.tip === "A" ? 1 : -1;
        // Bükümlü yörünge hesaplaması
        this.mesh.position.set(
            merkezPos.x + Math.cos(this.ilerleme * Math.PI * 2) * dalgaBoyu * yonKatsayisi,
            merkezPos.y + Math.sin(this.ilerleme * Math.PI * 2) * dalgaBoyu,
            merkezPos.z + Math.sin(this.ilerleme * Math.PI * 2) * dalgaBoyu * yonKatsayisi
        );
    }
}


// ============================================================================
// DOUBLE VORTEX VE KUTSAL KAN POMPALAMA MOTORU
// ============================================================================
// Global veri paket takibi dizisi ve Rodin dizilimi
let aktifPaketler = [];
//const rodinDizisi =[1,2,4,8,7,5];
// 🌪️ ÇİFT GİRDAP DİZİLİMLERİ (Örnek Rodin dizilimi)
const rodinDizisiA = [1, 2, 4, 8, 7, 5]; // Saat Yönü Tersi
const rodinDizisiB = [8, 7, 5, 1, 2, 4]; // Saat Yönü (Ters Pompa)

//let aktifDiziIndex = 0;
let aktifIndexA = 0;
let aktifIndexB = 0;


// ============================================================================
// FPS LİMİTLEYİCİ VE ANİMASYON DÖNGÜSÜ (TAM VE SIZINTISIZ SÜRÜM)
// ============================================================================
let globalDönüşHızı = 0.005; 
const hedefFPS = 25;
const kareAralığı = 1000 / hedefFPS; // 40ms
let sonKareZamanı = performance.now();

function animate() {
    requestAnimationFrame(animate);

    // 🛠 25 FPS Zaman Kilidi
    const şimdikiZaman = performance.now();
    const geçenSüre = şimdikiZaman - sonKareZamanı;
    if (geçenSüre < kareAralığı) return; 

    sonKareZamanı = şimdikiZaman - (geçenSüre % kareAralığı);
    const sabitDelta = 1 / hedefFPS; // Sabit 0.04s

    const beyazKutupObj = KuantumKafesi.getObjectByName("BEYAZ_KUTUP_ODASI");
    const siyahKutupObj = KuantumKafesi.getObjectByName("SIYAH_KUTUP_ODASI");

    // === ⚡ 3 VE 6 KUTUPSAL (+ / -) ELEKTROMANYETİK DÖNGÜSÜ ===
    const zamanSinyali = performance.now() * 0.005; // Döngü hızı

    if (beyazKutupObj && siyahKutupObj) {
        // 3 (Beyaz Kutup) -> (+) Fazı
        beyazKutupObj.material.emissiveIntensity = 0.9 + Math.sin(zamanSinyali) * 0.6;
        beyazKutupObj.material.opacity = 0.6 + Math.sin(zamanSinyali) * 0.3;

        // 6 (Siyah Kutup) -> (-) Fazı
        siyahKutupObj.material.emissiveIntensity = 0.9 - Math.sin(zamanSinyali) * 0.6;
        siyahKutupObj.material.opacity = 0.6 - Math.sin(zamanSinyali) * 0.3;

        // === ⚡ SWASTIKA VE BAĞIMSIZ ÇİFT YÖNLÜ AC ATESLEME MOTORU ===
   // 🔑 KIRILAN KİLİT: `if (aktifPaketler.length === 0)` şartı kaldırıldı, 
// her akım kanalı (A/B) bağımsız çalışır.
[
    { dizi: rodinDizisiA, idx: aktifIndexA, t: "A", nextIdx: () => aktifIndexA = (aktifIndexA + 1) % rodinDizisiA.length },
    { dizi: rodinDizisiB, idx: aktifIndexB, t: "B", nextIdx: () => aktifIndexB = (aktifIndexB + 1) % rodinDizisiB.length }
].forEach(p => {
    // 🛡️ GÜVENLİ FREKANS FRENE: İlgili akım kanalında (A veya B) havada parçacık yoksa ateşle.
    if (!aktifPaketler.some(x => x.tip === p.t)) { 
        let kData = spheres.find(o => o.id === p.dizi[p.idx]);
        let hData = spheres.find(o => o.id === p.dizi[(p.idx + 1) % p.dizi.length]);
        
        if (kData && hData) {
            let mK = KuantumKafesi.getObjectByName(kData.name);
            let mH = KuantumKafesi.getObjectByName(hData.name);

            if (mK && mH) {
                let paket = new KuantumPaketi(mK, mH, hData.color);
                paket.tip = p.t;
                aktifPaketler.push(paket); 
                p.nextIdx(); // 8 düğümünde bağımsız ilerleme
            }
        }
    }
});
        }

        // --- 🚀 PARÇACIK GÜNCELLEME (KİLİT PARANTEZLERİNDEN KURTARILDI) ---
        let turuTamamla = false;
        for (let i = aktifPaketler.length - 1; i >= 0; i--) {
            let paket = aktifPaketler[i];
            paket.guncelle(sabitDelta); 
            if (paket.ilerleme >= 1.0) {
                let hData = spheres.find(o => o.id === paket.hedefId);
                if (hData) {
                    let hMesh = KuantumKafesi.getObjectByName(hData.name);
                    if (hMesh) { 
                        hMesh.material.emissiveIntensity = 4.0; 
                        hMesh.material.opacity = 1.0; 
                    }
                }
                KuantumKafesi.remove(paket.mesh);
                aktifPaketler.splice(i, 1);
                turuTamamla = true;
            }
        }
        
        // Temizlik sonrası kontrol
        if (turuTamamla && aktifPaketler.length === 0) {
            // İndeksler yukarıda ateşlendiği an arttığı için burası güvenli kapatmadır
        }
    }
    // 3. DEŞARJ DÖNGÜSÜ
    spheres.forEach(s => {
        let odaMesh = KuantumKafesi.getObjectByName(s.name);
        if (odaMesh && !s.isPole) {
            if (odaMesh.material.emissiveIntensity > 0.3) odaMesh.material.emissiveIntensity -= sabitDelta * 20.0;
            if (odaMesh.material.opacity > 0.15) odaMesh.material.opacity -= sabitDelta * (odaMesh.material.opacity > 0.35 ? 0.2 : 1.5);
        }
    });

    if (typeof controls !== 'undefined') controls.update();
    renderer.render(scene, camera);
}

// 🔑 GÜVENLİ RESIZE
window.addEventListener('resize', () => {
    const yeniAspect = window.innerWidth / window.innerHeight;
    camera.left = -d * yeniAspect; camera.right = d * yeniAspect;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();

</script>
